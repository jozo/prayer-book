title = "Ranná prosba pod krížom (sv. Tomáš Akvinský)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Milosrdný Bože, dopraj mi, aby som správne poznal a celým srdcom túžil iba po tom,
čo sa Tebe páči, a aby som sa snažil toho múdro dosiahnuť a uskutocniť to ku chvále a sláve Tvojho mena.
Usmerni, Bože, môj život tak, aby som vedel, čo odo mňa chceš, a aby som to k svojmu prospechu vykonal.
Nedopusť, Bože, môj Pane, aby ma zviedol pohodlný život alebo pýcha, alebo aby som podľahol útrapám a zmalomyseľnel.

Nechcem sa ani radovať, ani rmútiť sám za seba, ale podľa toho, čo ma k Tebe vedie alebo od Teba odvádza.
Chcem sa Ti páčiť a obávať sa, aby som sa Ti neznepáčil. Kiež by všetko,
čo je bezcenné pre Teba, Pane, stratilo cenu i pre mňa, a všetko, čo je Ti drahé, bolo drahým i mne.
Nechcem sa veseliť bez Teba, nechcem nič, iba Teba.

Kiež by ma tešila, Pane, každá práca, ktorá je pre Tebe, a kiež by ma netešil odpočinok bez Teba.
Kiež svoje srdce obraciam k Tebe, môj Bože, a ak klesnem,
nech precitnem v bolesti svoj pád v pevnom predsavzatí polepšiť sa.

Učiň ma, Bože, môj Pane, poslušným bez odvrávania, chudobným bez nariekania, čistým bez úhony,
trpezlivým bez reptania, pokorným bez pretvárky, veselým bez rozmarnosti, smutným bez skleslosti,
dokonalým bez nedostatkov, pohotovým bez unáhlenosti a bojacim sa Teba bez strachu.
Uciň ma úprimným bez pretvárky, dobrým bez čakania na ovocie činov, napomínajúcim svojho blížneho
bez povýšenosti a povzbudzujúcim ho slovom i príkladom bez predstierania kvalít, ktoré nemám.

Daj mi, Bože, môj Pane, bdelé srdce, ktoré by od Teba neodviedla žiadna zvedavosť; šľachetné srdce,
ktoré by nestrhol nízky pud; priame srdce, ktoré by nezviedli klamné nadeje; pevné srdce,
ktoré by nezlomil žiadny nezdar; slobodné srdce, ktoré by nepodmanili nečisté vášne.
Daj mi, Bože, môj Pane, rozum, ktorým by som Ťa poznával; horlivosť, s ktorou by som Ťa hľadal;
múdrosť, pomocou ktorej by som Ťa našiel; jednanie, ktoré by sa Ti páčilo; vytrvalosť,
s ktorou by som na Teba verne čakal; a nádej, že k Tebe raz prídem.
Trestaj ma za zlé skutky svojimi spravodlivými trestami, ale daj, aby som na ceste k Tebe užíval
Tvoju dobrotivosť a nakoniec oplýval Tvojou milosťou v sláve svojej nebeskej vlasti.

Nech sa tak stane, Bože, ktorý žiješ a kraľuješ na veky vekov!
"""
