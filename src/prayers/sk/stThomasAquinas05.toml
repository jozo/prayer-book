title = "Modlitba pred svätým prijímáním (sv. Tomáš Akvinský)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Všemohúci, večný Bože, pristupujem k sviatosti Tvojho jednorodeného Syna, nášho Pána Ježiša Krista.
Pristupujem ako nemocný k lekárovi života, nečistý k prameňu milosrdenstva,
slepý k večnému zdroju svetla, chudobný a núdzny k Pánovi nebies a zeme.

Prosím Ťa pre Tvoju nezmernú štedrosť, aby si vyliečil moju nemoc, odstránil moju ošklivosť,
dal slepému svetlo, chudobnému bohatstvo a žobrákovi odev, aby mohol prijať chlieb anjelov,
Kráľa kráľov a Pána pánov s takou úctivosťou a pokorou, s takou oddanosťou a zbožnosťou,
s takou opravdivosťou a vierou, s takým predsavzatím a úmyslom, aby to bolo šťastím pre moju dušu.

Daj mi, vrúcne Ťa prosím, aby som prijal nielen sviatost Tela a krvi Pánovej,
ale tiež podstatu a silu sviatosti.
Dopraj mi, preláskavý Otče, aby som na večnosti pozeral na odhalenú tvár Tvojho milovaného Syna,
ktorého teraz chcem na svojej púti prijať zahaleného vo sviatosti a
ktorý s Tebou žije a kraľuje v jednote svätého Ducha, Boh po veky vekov.

Nech sa tak stane!
"""
