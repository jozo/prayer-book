content = """
_(Schválil ich pápež Sixtus V. v roku 1587)_

Pane, zmiluj sa. _Pane, zmiluj sa._

Kriste, zmiluj sa. _Kriste, zmiluj sa._

Pane, zmiluj sa. _Pane, zmiluj sa._

<br>

Otec na nebesiach, Bože,
_zmiluj sa nad nami._

Syn, Vykupiteľ sveta, Bože,
_zmiluj sa nad nami._

Duch Svätý, Bože,
_zmiluj sa nad nami._

Svätá Trojica, jeden Boh,
_zmiluj sa nad nami._


<br>


Svätá Mária,
_oroduj za nás._

