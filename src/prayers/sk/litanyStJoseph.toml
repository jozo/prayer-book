<br>


Baránok Boží, ty snímaš hriechy sveta, _zľutuj sa nad nami, Pane._

Baránok Boží, ty snímaš hriechy sveta, _vyslyš nás, Pane._

Baránok Boží, ty snímaš hriechy sveta, _zmiluj sa nad nami._


<br>


**℣.** Ustanovil ho za pána svojho domu.

**℟.** A za správcu všetkého svojho majetku.


<br>


**Modlime sa.**

Všemohúci Bože, vo svojej prozreteľnosti si vyvolil svätého Jozefa
za ženích preblahoslavenej Panny Márie; s dôverou ho uctievame tu
na zemi ako svojho ochrancu a prosíme ťa, aby bol naším mocným orodovníkom v nebi.
Skrze Krista, nášho Pána. Amen.

**℟.** Amen.
