_(Schválil ich pápež Pius X. v roku 1909)_

Pane, zmiluj sa. _Pane, zmiluj sa._

Kriste, zmiluj sa. _Kriste, zmiluj sa._

Pane, zmiluj sa. _Pane, zmiluj sa._

<br>

Otec na nebesiach, Bože,
