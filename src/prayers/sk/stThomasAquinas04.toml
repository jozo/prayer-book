title = "Ďakovná modlitba po svätom prijímaní k Bohu Otcovi (sv. Tomáš Akvinský)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Ďakujem Ti, svätý Pane, všemohúci Otče, večný Bože, že si mňa hriešneho,
svojho nehodného služobníka, bez mojich zásluh, iba z prebytku svojho milosrdenstva nasýtil
drahocenným Telom a Krvou svojho Syna, nášho Pána Ježiša Krista.

Vrúcne Ťa prosím, aby toto sväté spojenie nebolo dôvodom môjho odsúdenia k večnému zatrateniu,
ale zárukou spásy a odpustenia, zbrojnicou viery a záštitou dobrej vôle, aby ma zbavilo všetkých chýb,
usmernilo moju žiadostivosť a zmyselnosť, zväčšilo moju lásku, miernosť, pokoru,
oddanosť k Tebe a všetky ostatné cnosti, aby ma chránilo pred nástrahami všetkých
viditeľných i neviditeľných nepriateľov, ukojilo moje telesné i duševné túžby a bolo mojim zakotvením v Tebe,
jedinom a pravom Bohu, a cieľom šťastného ukončenia môjho pozemského života.

Vrúcne Ťa prosím pre Ježiša Krista, nášho Pána, aby si ma hriešneho priviedol na onú nevýslovnou hostinu,
kde si so svojim Synom a svätým Duchom pre svojich vyvolených pravým svetlom, dokonalým nasýtením,
večnou radosťou, najblaženejším zážitkom a vrcholom šťastia.

Nech sa tak stane!
"""
