title = "Modlitba po svätej omši (sv. Tomáš Akvinský)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Pane, svätý Otče, všemohúci a večný Bože, ďakujem ti, že si mňa, hriešnika,
svojho nehodného služobníka, nie podľa mojich zásluh, ale jedine z dobrodenia
tvojho milosrdenstva láskavo nasýtil najdrahším Telom a Krvou svojho Syna,
nášho Pána Ježiša Krista.

Vrúcne ťa prosím, nech toto sväté prijímanie nie je mi dôvodom na potrestanie,
ale spásnym príhovorom na odpustenie. Nech je mi pancierom viery a štítom dobrej vôle.
Nech ma oslobodí od mojich chýb, nech zničí vo mne žiadostivosť a zmyselnosť,
nech mi rozmnoží lásku a trpezlivosť, poníženosť a poslušnosť i všetky čnosti.
Nech ma pevne chráni proti osídlam všetkých nepriateľov, viditeľných i neviditeľných,
nech dokonale utíši moje telesné a duševné hnutia. Nech ma mocne pripúta k tebe,
k jedinému a pravému Bohu a nech mi pomáha šťastlivo zakončiť môj život.

Bože, prosím ťa, láskavo uveď mňa, hriešnika, na tú neopísateľnú hostinu,
pri ktorej ty sám so svojím Synom a Duchom Svätým pre svojich svätých si pravým svetlom,
úplným uspokojením, večnou radosťou, zvrchovanou slasťou a dokonalou blaženosťou.

Skrze Krista, nášho Pána. Amen.
"""
