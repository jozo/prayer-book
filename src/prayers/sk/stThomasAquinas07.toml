title = "Modlitba za správne jednanie (sv. Tomáš Akvinský)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Daj, Všemohúci Bože, aby som Tvoju vôľu vo svojom živote
rozvážne skúmal, pravdivo poznával a dokonale plnil.
Veď môj život tak, aby bol Tebe ku cti a mne ku spáse.
Daj mi k tomu, Pane, myseľ silnú, myseľ slobodnú,
myseľ spravodlivú, myseľ bdelú, myseľ stálu.

Učiň ma prostým bez povýšenosti, vážnym bez smútku,
pravdivým bez klamu, odvážnym bez bázne,
kľudným bez ľahkomyseľnosti.
Daj, aby moje cesty smerovali priamo a bezpečne ku cieľu.
Daj, láskyplný Bože môjho žitia, aby som v Teba vždy dôveroval.

Kiež sa tak stane!
"""
