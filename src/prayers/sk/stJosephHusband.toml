title = "K sv. Jozefovi - za manžela"
categories = ["saints"]

[[versions]]
name = ""
content = """
Svätý Jozef, ďakujem ti za to,
že som sa ešte nevydala.
Svätý Jozef, ty v Bohu vieš,
kto má byť mojím manželom,
pomôž mi ho stretnúť.

Svätý Jozef daj, aby to bol dobrý manžel,
ktorý ma bude milovať a vážiť si ma tak,
ako si si ty vážil Pannu Máriu.

Svätý Jozef daj, aby sa rozpadol môj vzťah, ak sa Bohu nepáči.
Svätý Jozef, sľubujem ti, že si zachovám predmanželskú čistotu.
Svätý Jozef, sľubujem ti, že budem iným ľuďom hovoriť,
že takého dobrého manžela mám od teba.

Amen."""
