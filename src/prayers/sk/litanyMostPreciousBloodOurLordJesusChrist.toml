title = "Litánie k Predrahej Kristovej krvi"
categories = ["litany"]

[[versions]]
name = ""
content = """
_(Schválil ich pápež sv. Ján XXIII. v roku 1960)_

Pane, zmiluj sa. _Pane, zmiluj sa._

Kriste, zmiluj sa. _Kriste, zmiluj sa._

Pane, zmiluj sa. _Pane, zmiluj sa._

<br>

Otec na nebesiach, Bože,
_zmiluj sa nad nami._

Syn, Vykupiteľ sveta, Bože,
_zmiluj sa nad nami._

Duch Svätý, Bože,
_zmiluj sa nad nami._

Svätá Trojica, jeden Boh,
_zmiluj sa nad nami._


<br>


Krv Kristova, krv jednorodeného Syna večného Otca,
_zachráň nás._

Krv Kristova, krv vteleného Božieho Slova,
_zachráň nás._

Krv Kristova, krv novej a večnej zmluvy,
_zachráň nás._

Krv Kristova, tečúca na zem v smrteľnom zápase,
_zachráň nás._

Krv Kristova, prelievaná pri bičovaní,
_zachráň nás._

Krv Kristova, ronená pri korunovaní tŕním,
_zachráň nás._

Krv Kristova, vyliata na kríži,
_zachráň nás._

Krv Kristova, cena našej spásy,
_zachráň nás._

Krv Kristova, bez ktorej niet odpustenia,
_zachráň nás._

Krv Kristova, ktorá napája a očisťuje duše v Eucharistii,
_zachráň nás._

Krv Kristova, prúd milosrdenstva,
_zachráň nás._

Krv Kristova, víťaziaca nad zlými duchmi,
_zachráň nás._

Krv Kristova, odvaha mučeníkov,
_zachráň nás._

Krv Kristova, sila vyznávačov,
_zachráň nás._

Krv Kristova, zdroj panien,
_zachráň nás._

Krv Kristova, opora v nebezpečenstve,
_zachráň nás._

Krv Kristova, úľava trpiacich,
_zachráň nás._

Krv Kristova, potešenie plačúcich,
_zachráň nás._

Krv Kristova, nádej kajúcich,
_zachráň nás._

Krv Kristova, útecha umierajúcich,
_zachráň nás._

Krv Kristova, pokoj a nežnosť našich sŕdc,
_zachráň nás._

Krv Kristova, závdavok večného života,
_zachráň nás._

Krv Kristova, vyslobodenie duší z očistca,
_zachráň nás._

Krv Kristova, hodna všetkej cti a slávy,
_zachráň nás._



<br>


Baránok Boží, ty snímaš hriechy sveta, _zľutuj sa nad nami, Pane._

Baránok Boží, ty snímaš hriechy sveta, _vyslyš nás, Pane._

Baránok Boží, ty snímaš hriechy sveta, _zmiluj sa nad nami._


<br>


**℣.** Vykúpil si nás, Pane, svojou krvou.

**℟.** A urobil si nás kráľovstvom nášmu Bohu.


<br>


**Modlime sa.**

Všemohúci a večný Bože, ty si svojho jednorodeného Syna ustanovil za Vykupiteľa sveta
a jeho krvou si bol uzmierený; prosíme ťa, daj, aby sme nábožne uctievali cenu našej spásy,
aby nás sila jeho krvi chránila od časného zla a zabezpečila nám večnú radosť v nebi.
Lebo on žije a kraľuje na veky vekov.

**℟.** Amen.
"""
