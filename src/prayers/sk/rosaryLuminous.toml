title = "Ruženec svetla"
categories = ["rosary"]

[[versions]]
name = ""
content = """
_Modlí sa v štvrtok._

- ktorý nech je Svetlom nášho života
- ktorý nech nás uzdravuje milosrdnou láskou
- ktorý nech nás vezme k sebe do večnej slávy

<br>

**Tajomstvá:**

1. ktorý bol pokrstený v Jordáne a začal svoje verejne účinkovanie
2. ktorý zázrakom v Káne Galilejskej otvoril srdcia učeníkov pre vieru
3. ktorý ohlasoval Božie kráľovstvo a vyzýval ľud na pokánie
4. ktorý sa ukázal v božskej sláve na hore premenenia
5. ktorý nám dal seba za pokrm a nápoj v Oltárnej sviatosti

**Skrátené tajomstvá ruženca svetla:**

1. ktorý bol pokrstený v Jordáne
2. ktorý zjavil seba samého na svadbe v Káne
3. ktorý ohlasoval Božie kráľovstvo a pokánie
4. ktorý sa premenil na vrchu Tábor
5. ktorý ustanovil Oltárnu sviatosť
"""
