title = "Prosba za dary tela (sv. Tomáš Akvinský)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Vzývam Ťa, môj Bože, darca všetkej útechy, ktorý na mne môžeš vidieť,
že iba Tvoje dary sú dobré, aby si mi po skončení tohoto života dal
poznanie celej pravdy a doprial, aby som sa mohol radovať z Tvojej božskej velebnosti.

Vznešený darca, daj môjmu telu odlesk svojej krásy, sviežosť v pohybe,
eleganciu v obliekaní a úspechy v jednaní. Daj mi tiež dostatočné prostriedky,
stále šťastie a toľko dobra, aby sa mohol radovať z Tvojich darov:
z krásneho prostredia, v ktorom žijem, zo svojho tela a duše, ktoré tak vyznamenávaš,
z milého spoločenstva svojich priateľov, ktorých ku mne posielaš a ktorých si si obľúbil.

Preláskavý Otče, Daj môjmu rozumu svetlo svojej múdrosti,
môjmu citu splnení všetkých túžob a mojej vôli dosiahnutie slávy,
víťazstvo a spočinutie v Tebe. Lebo u Teba mi nehrozí žiadne nebezpečenstvo,
v Tvojom srdci je miesto pre všetkých. Všetci tam majú iba jediné prianie:
byť čo najbližšie pri Tebe, pretože u Teba vládne kúzlo jari, slnko leta,
hojnosť jesene a zimný odpočinok.

Môj Bože, daj mi radosť bez bolesti a život bez smrti, v ktorom je najväčšia sloboda,
slobodná bezpečnosť, bezpečná istota, radosť zo šťastia, šťastná večnosť a
večná blaženosť – videnie Boha a oslava pravdy.

Nech sa tak stane!
"""
