title = "K sv. Jozefovi - za manželku"
categories = ["saints"]

[[versions]]
name = ""
content = """
Svätý Jozef, ďakujem ti za to,
že som sa ešte neoženil.
Svätý Jozef, ty v Bohu vieš,
kto má byť mojou manželkou,
pomôž mi ju stretnúť.

Svätý Jozef daj, aby to bola dobrá manželka,
ktorá ma bude milovať a vážiť si ma tak,
ako si si ty vážil Pannu Máriu.

Svätý Jozef daj, aby sa rozpadol môj vzťah, ak sa Bohu nepáči.
Svätý Jozef, sľubujem ti, že si zachovám predmanželskú čistotu.
Svätý Jozef, sľubujem ti, že budem iným ľuďom hovoriť,
že takú dobrú manželku mám od teba.

Amen."""
