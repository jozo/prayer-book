title = "Bolestný ruženec"
categories = ["rosary"]

[[versions]]
name = ""
content = """
_Modlí sa v utorok a piatok, v Pôstnom období aj v iné dni._

- ktorý nech osvecuje náš rozum
- ktorý nech upevňuje našu vôľu
- ktorý nech posilňuje našu pamäť

<br>

**Tajomstvá:**

1. ktorý sa pre nás krvou potil
2. ktorý pre nás bičovaný bol
3. ktorý pre nás tŕním korunovaný bol
4. ktorý pre nás ťažký kríž niesol
5. ktorý pre nás ukrižovaný bol
"""
