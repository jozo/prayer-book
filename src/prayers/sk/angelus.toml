title = "Anjel Pána"
categories = ["basic"]

[[versions]]
name = ""
content = """
**℣.** Anjel Pána zvestoval Panne Márii.

**℟.** A ona počala z Ducha Svätého.

_Zdravas’, Mária..._

**℣.** Hľa, služobnica Pána.

**℟.** Nech sa mi stane podľa tvojho slova.

_Zdravas’, Mária..._

**℣.** A Slovo sa telom stalo.

**℟.** A prebývalo medzi nami.

_Zdravas’, Mária..._


**℣.** Oroduj za nás, svätá Božia Rodička.

**℟.** Aby sme sa stali hodni Kristových prisľúbení.

**℣.** Modlime sa: Bože, z anjelovho zvestovania vieme, že tvoj Syn Ježiš
Kristus sa stal človekom; prosíme ťa, vlej nám do duše
svoju milosť, aby nás jeho umučenie a kríž priviedli
k slávnemu vzkrieseniu. Skrze Krista, nášho Pána.

**℟.** Amen.
"""
