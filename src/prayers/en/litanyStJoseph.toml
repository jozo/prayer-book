title = "Litany to St. Joseph"
categories = ["litany"]

[[versions]]
name = ""
content = """
Lord have mercy.
Christ have mercy.
Lord have mercy.

Christ hear us.
Christ graciously hear us.

God, the Father of Heaven,
_Have mercy on us._

God, the Son, Redeemer of the world,
_Have mercy on us._

God, the Holy Spirit,
_Have mercy on us._

Holy Trinity, One God,
_Have mercy on us._

Holy Mary,
_Pray for us._

St. Joseph,
_Pray for us._

Renowned offspring of David,
_Pray for us._

Light of Patriarchs,
_Pray for us._

Spouse of the Mother of God,
_Pray for us._

Chaste guardian of the Virgin,
_Pray for us._

Foster father of the Son of God,
_Pray for us._

Diligent protector of Christ,
_Pray for us._

Head of the Holy Family,
_Pray for us._

Joseph most just,
_Pray for us._

Joseph most chaste,
_Pray for us._

Joseph most prudent,
_Pray for us._

Joseph most strong,
_Pray for us._

Joseph most obedient,
_Pray for us._

Joseph most faithful,
_Pray for us._

Mirror of patience,
_Pray for us._

Lover of poverty,
_Pray for us._

Model of artisans,
_Pray for us._

Glory of home life,
_Pray for us._

Guardian of virgins,
_Pray for us._

Pillar of families,
_Pray for us._

Solace of the wretched,
_Pray for us._

Hope of the sick,
_Pray for us._

Patron of the dying,
_Pray for us._

Terror of demons,
_Pray for us._

Protector of Holy Church,
_Pray for us._

Lamb of God, Who takest away the sins of the world,
_Spare us, O Lord._

Lamb of God, Who takest away the sins of the world,
_Graciously hear us, O Lord._

Lamb of God, Who takest away the sins of the world,
_Have mercy on us._

**℣.** He made him the lord of his household.

**℟.** And prince over all his possessions.

**Let us pray:**
O God, in your ineffable providence you were pleased to choose
Blessed Joseph to be the spouse of your most holy Mother;
grant, we beg you, that we may be worthy to have him for
our intercessor in heaven whom on earth we venerate as our Protector
You who live and reign forever and ever.

**℟.** Amen.
"""
