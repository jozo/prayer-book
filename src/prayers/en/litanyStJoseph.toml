title = "Litany to St. Joseph"
categories = ["litany"]

[[versions]]
name = ""
content = """
Lord have mercy.
Christ have mercy.
Lord have mercy.

Christ hear us.
Christ graciously hear us.

God, the Father of Heaven,
Have mercy on us.

God, the Son, Redeemer of the world,
Have mercy on us.

God, the Holy Spirit,
Have mercy on us.

Holy Trinity, One God,
Have mercy on us.

Holy Mary,
Pray for us.

St. Joseph,
Pray for us.

Renowned offspring of David,
Pray for us.

Light of Patriarchs,
Pray for us.

Spouse of the Mother of God,
Pray for us.

Chaste guardian of the Virgin,
Pray for us.

Foster father of the Son of God,
Pray for us.

Diligent protector of Christ,
Pray for us.

Head of the Holy Family,
Pray for us.

Joseph most just,
Pray for us.

Joseph most chaste,
Pray for us.

Joseph most prudent,
Pray for us.

Joseph most strong,
Pray for us.

Joseph most obedient,
Pray for us.

Joseph most faithful,
Pray for us.

Mirror of patience,
Pray for us.

Lover of poverty,
Pray for us.

Model of artisans,
Pray for us.

Glory of home life,
Pray for us.

Guardian of virgins,
Pray for us.

Pillar of families,
Pray for us.

Solace of the wretched,
Pray for us.

Hope of the sick,
Pray for us.

Patron of the dying,
Pray for us.

Terror of demons,
Pray for us.

Protector of Holy Church,
Pray for us.

Lamb of God, Who takest away the sins of the world,
Spare us, O Lord.

Lamb of God, Who takest away the sins of the world,
Graciously hear us, O Lord.

Lamb of God, Who takest away the sins of the world,
Have mercy on us.

**℣.** He made him the lord of his household.  
**℟.** And prince over all his possessions.

**Let us pray:**
O God, in your ineffable providence you were pleased to choose
Blessed Joseph to be the spouse of your most holy Mother;
grant, we beg you, that we may be worthy to have him for
our intercessor in heaven whom on earth we venerate as our Protector
You who live and reign forever and ever. Amen.
"""
