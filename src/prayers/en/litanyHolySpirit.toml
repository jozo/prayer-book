title = "Litany to the Holy Spirit"
categories = ["litany"]

[[versions]]
name = ""
content = """
Lord, have mercy on us.
Lord, have mercy on us.
Lord, have mercy on us.

God the Father of Heaven,
_Have mercy on us._

God the Son, Redeemer of the world,
_Have mercy on us._

God the Holy Spirit,
_Have mercy on us._

Holy Trinity, One God,
_Have mercy on us._

Divine Essence, one true God,
_Have mercy on us_

Spirit of truth and wisdom,
_Have mercy on us_

Spirit of holiness and justice,
_Have mercy on us_

Spirit of understanding and counsel,
_Have mercy on us_

Spirit of love and joy,
_Have mercy on us_

Spirit of peace and patience,
_Have mercy on us_

Spirit of longanimity and meekness,
_Have mercy on us_

Spirit of benignity and goodness,
_Have mercy on us_

Love substantial of the Father and the Son,
_Have mercy on us_

Love and life of saintly souls,
_Have mercy on us_

Fire ever burning,
_Have mercy on us_

Living water to quench the thirst of hearts,
_Have mercy on us_

From all evil,
_Deliver us, O Holy Spirit._

From all impurity of soul and body,
_Deliver us, O Holy Spirit._

From all gluttony and sensuality,
_Deliver us, O Holy Spirit._

From all attachments to the things of the earth,
_Deliver us, O Holy Spirit._

From all hypocrisy and pretense,
_Deliver us, O Holy Spirit._

From all imperfections and deliberate faults,
_Deliver us, O Holy Spirit._

From our own will,
_Deliver us, O Holy Spirit._

From slander,
_Deliver us, O Holy Spirit._

From deceiving our neighbors,
_Deliver us, O Holy Spirit._

From our passions and disorderly appetites,
_Deliver us, O Holy Spirit._

From our inattentiveness to Thy holy inspirations,
_Deliver us, O Holy Spirit._

From despising little things,
_Deliver us, O Holy Spirit._

From debauchery and malice,
_Deliver us, O Holy Spirit._

From love of comfort and luxury,
_Deliver us, O Holy Spirit._

From wishing to seek or desire anything other than Thee,
_Deliver us, O Holy Spirit._

From everything that displeases Thee,
_Deliver us, O Holy Spirit._

Most loving Father,
_forgive us._

Divine Word,
_have pity on us._

Holy and divine Spirit,
_leave us not until we are in possession of the Divine Essence, Heaven of heavens._

Lamb of God, Who takest away the sins of the world,
_Send us the divine Consoler._

Lamb of God, Who takest away the sins of the world,
_Fill us with the gifts of Thy Spirit._

Lamb of God, Who takest away the sins of the world,
_Make the fruits of the Holy Spirit increase within us._

**℣.** Come, O Holy Spirit, fill the hearts of Thy faithful,

**℟.** And enkindle in them the fire of Thy love.

**℣.** Send forth Thy Spirit and they shall be created,

**℟.** And Thou shalt renew the face of the earth.

**Let Us Pray:**
God, Who by the light of the Holy Spirit instructed the hearts of the faithful, 
grant us by the same Spirit to be truly wise and ever to rejoice in His consolation. 
Through Jesus Christ Our Lord.

**℟.** Amen.
"""
