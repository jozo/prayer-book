title = "Litany of the Saints"
categories = ["litany"]

[[versions]]
name = ""
content = """
Lord have mercy.
Christ have mercy.
Lord have mercy.

Christ hear us.
Christ graciously hear us.

God, the Father of Heaven,
_Have mercy on us._

God, the Son, Redeemer of the world,
_Have mercy on us._

God, the Holy Spirit,
_Have mercy on us._

Holy Trinity, One God,
_Have mercy on us._

Holy Mary,
_Pray for us._

Holy Mother of God,
_Pray for us._

Holy Virgin of virgins,
_Pray for us._

St. Michael,
_Pray for us._

St. Gabriel,
_Pray for us._

St. Raphael,
_Pray for us._

All ye holy Angels and Archangels,
_Pray for us._

All ye holy orders of blessed Spirits,
_Pray for us._

St. John the Baptist,
_Pray for us._

St. Joseph,
_Pray for us._

All ye holy Patriarchs and Prophets,
_Pray for us._

St. Peter,
_Pray for us._

St. Paul,
_Pray for us._

St. Andrew,
_Pray for us._

St. James,
_Pray for us._

St. John,
_Pray for us._

St. Thomas,
_Pray for us._

St. James,
_Pray for us._

St. Philip,
_Pray for us._

St. Bartholomew,
_Pray for us._

St. Matthew,
_Pray for us._

St. Simon,
_Pray for us._

St. Thaddeus,
_Pray for us._

St. Matthias,
_Pray for us._

St. Barnabas,
_Pray for us._

St. Luke,
_Pray for us._

St. Mark,
_Pray for us._

All ye holy Apostles and Evangelists,
_Pray for us._

All ye holy Disciples of the Lord,
_Pray for us._

All ye holy Innocents,
_Pray for us._

St. Stephen,
_Pray for us._

St. Lawrence,
_Pray for us._

St. Vincent,
_Pray for us._

SS. Fabian and Sebastian,
_Pray for us._

SS. John and Paul,
_Pray for us._

SS. Cosmas and Damian,
_Pray for us._

SS. Gervase and Protase,
_Pray for us._

All ye holy Martyrs,
_Pray for us._

St. Sylvester,
_Pray for us._

St. Gregory,
_Pray for us._

St. Ambrose,
_Pray for us._

St. Augustine,
_Pray for us._

St. Jerome,
_Pray for us._

St. Martin,
_Pray for us._

St. Nicholas,
_Pray for us._

All ye holy Bishops and Confessors,
_Pray for us._

All ye holy Doctors,
_Pray for us._

St. Anthony,
_Pray for us._

St. Benedict,
_Pray for us._

St. Bernard,
_Pray for us._

St. Dominic,
_Pray for us._

St. Francis,
_Pray for us._

All ye holy Priests and Levites,
_Pray for us._

All ye holy Monks and Hermits,
_Pray for us._

St. Mary Magdalen,
_Pray for us._

St. Agatha,
_Pray for us._

St. Lucy,
_Pray for us._

St. Agnes,
_Pray for us._

St. Cecilia,
_Pray for us._

St. Catherine,
_Pray for us._

St. Anastasia,
_Pray for us._

All ye holy Virgins and Widows,
_Pray for us._

All ye holy Saints of God,
_make intercession for us._

Be merciful,
_Spare us, O Lord._

Be merciful,
_Graciously hear us, O Lord._

From all evil,
_Deliver us, O Lord._

From all sin,
_Deliver us, O Lord._

From Thy wrath,
_Deliver us, O Lord._

From sudden and unlooked for death,
_Deliver us, O Lord._

From the snares of the devil,
_Deliver us, O Lord._

From anger, and hatred, and every evil will,
_Deliver us, O Lord._

From the spirit of fornication,
_Deliver us, O Lord._

From lightning and tempest,
_Deliver us, O Lord._

From the scourge of earthquakes,
_Deliver us, O Lord._

From plague, famine and war,
_Deliver us, O Lord._

From everlasting death,
_Deliver us, O Lord._

Through the mystery of Thy holy Incarnation,
_Deliver us, O Lord._

Through Thy Coming,
_Deliver us, O Lord._

Through Thy Birth,
_Deliver us, O Lord._

Through Thy Baptism and holy Fasting,
_Deliver us, O Lord._

Through Thy Cross and Passion,
_Deliver us, O Lord._

Through Thy Death and Burial,
_Deliver us, O Lord._

Through Thy holy Resurrection,
_Deliver us, O Lord._

Through Thine admirable Ascension,
_Deliver us, O Lord._

Through the coming of the Holy Ghost, the Paraclete,
_Deliver us, O Lord._

In the day of judgment,
_Deliver us, O Lord._

We sinners,
_We beseech Thee, hear us._

That Thou wouldst spare us,
_We beseech Thee, hear us._

That Thou wouldst pardon us,
_We beseech Thee, hear us._

That Thou wouldst bring us to true penance,
_We beseech Thee, hear us._

That Thou wouldst vouchsafe to govern and preserve  Thy holy Church,
_We beseech Thee, hear us._

That Thou wouldst vouchsafe to preserve our Apostolic Prelate, and all orders of the Church in holy religion,
_We beseech Thee, hear us._

That Thou wouldst vouchsafe to humble the enemies of holy Church,
_We beseech Thee, hear us._

That Thou wouldst vouchsafe to give peace and true concord to Christian kings and princes,
_We beseech Thee, hear us._

That Thou wouldst vouchsafe to grant peace and unity to the whole Christian world,
_We beseech Thee, hear us._

That Thou wouldst call back to the unity of the Church all who have strayed from her fold, and to guide all unbelievers into the light of the Gospel
_We beseech Thee, hear us._

That Thou wouldst vouchsafe to confirm and preserve us in Thy holy service,
_We beseech Thee, hear us._

That Thou wouldst lift up our minds to heavenly desires,
_We beseech Thee, hear us._

That Thou wouldst render eternal blessings to all our benefactors,
_We beseech Thee, hear us._

That Thou wouldst deliver our souls, and the souls of our brethren, relations, and benefactors, from eternal damnation,
_We beseech Thee, hear us._

That Thou wouldst vouchsafe to give and preserve the fruits of the earth,
_We beseech Thee, hear us._

That Thou wouldst vouchsafe to grant eternal rest to all the faithful departed,
_We beseech Thee, hear us._

That Thou wouldst vouchsafe graciously to hear us,
_We beseech Thee, hear us._

Son of God,
_We beseech Thee, hear us._

Lamb of God, Who takest away the sins of the world,
_Spare us, O Lord._

Lamb of God, Who takest away the sins of the world,
_Graciously hear us, O Lord._

Lamb of God, Who takest away the sins of the world,
_Have mercy on us._

Christ hear us.
Christ graciously hear us.

Lord have mercy.
Christ have mercy.
Lord have mercy.

Our Father (silently).

**℣.** And lead us not into temptation.

**℟.** But deliver us from evil.
"""
