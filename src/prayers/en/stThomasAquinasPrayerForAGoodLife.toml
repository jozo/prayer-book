title = "Prayer for a Good Life (by St. Thomas Aquinas)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Grant O merciful God, that I may ardently desire, carefully examine,
truly know and perfectly fulfil those things that are pleasing to You
and to the praise and glory of Your holy name.

Direct my life, O my God, and grant that I might know what you would
have me to do and for me to fulfil it as is necessary and profitable to my soul.

Grant to me, O Lord my God, that I may not be found wanting in prosperity
or in adversity and that I may not be lifted up by one nor cast down by the other.

May I find joy in nothing but what leads to You and sorrow in nothing
but what leads away from You.

May I seek to please no one or fear to displease anyone, save only You.

Grant to me, O Lord God,
- a vigilant heart that no subtle speculation may ever lead me from You;
- a noble heart that no unworthy affection may draw me from You;
- an upright heart that no evil purpose may turn me from you.

Give me a steadfast heart that no tribulation may shatter
and a free heart that no violent affection may claim as its own.

And finally, grant me O Lord my God, a mind to know you,
diligence to seek you, wisdom to find you.

Give me a way of life pleasing to You; perseverance to trust
and await You in confidence that I shall embrace You at the last.

Amen.
"""
