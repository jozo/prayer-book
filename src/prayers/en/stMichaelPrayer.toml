title = "Prayer to St. Michael the Archangel"
categories = ["basic", "saints"]

[[versions]]
name = "Traditional"
content = """
Saint Michael the Archangel, defend us in the day of battle.
Be our protection against the wickedness and snares of the devil.

May God rebuke him, we humbly pray; and do thou,
O Prince of the heavenly host,
by the power of God cast into hell Satan and all the evil spirits
who wander throughout the world seeking the ruin of souls.

Amen.
"""

[[versions]]
name = "Modern"
content = """
Holy Michael, the Archangel, defend us in battle.
Be our safeguard against the wickedness and snares of the devil.

May God rebuke him, we humbly pray; and do you,
O Prince of the heavenly host,
by the power of God cast into hell Satan and all the evil spirits
who wander through the world seeking the ruin of souls.

Amen.
"""
