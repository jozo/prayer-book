Lord have mercy.
Christ have mercy.
Lord have mercy.

Christ hear us.
Christ graciously hear us.

God, the Father of Heaven,
_Have mercy on us._

God, the Son, Redeemer of the world,
_Have mercy on us._

God, the Holy Spirit,
_Have mercy on us._

Holy Trinity, One God,
_Have mercy on us._

Holy Mary,
_Pray for us._

Holy Mother of God,
_Pray for us._

Holy Virgin of Virgins,
_Pray for us._

Mother of Christ,
_Pray for us._

Mother of the Church,
_Pray for us._

Mother of Mercy,
_Pray for us._

Mother of Divine Grace,
_Pray for us._

Mother of Hope,
_Pray for us._

Mother Most Pure,
_Pray for us._

Mother Most Chaste,
_Pray for us._

Mother Inviolate,
_Pray for us._

Mother Undefiled,
_Pray for us._

Mother Most Amiable,
_Pray for us._

Mother Most Admirable,
_Pray for us._

Mother of Good Counsel,
_Pray for us._

Mother of our Creator,
_Pray for us._

Mother of our Savior,
_Pray for us._

Virgin Most Prudent,
_Pray for us._

Virgin Most Venerable,
_Pray for us._

Virgin Most Renowned,
_Pray for us._

Virgin Most Powerful,
_Pray for us._

Virgin Most Merciful,
_Pray for us._

Virgin Most Faithful,
_Pray for us._

Mirror of Justice,
_Pray for us._

Seat of Wisdom,
_Pray for us._

