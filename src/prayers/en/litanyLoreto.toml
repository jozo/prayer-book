title = "Litany of Loreto"
categories = ["litany"]

[[versions]]
name = ""
content = """
Lord have mercy.
Christ have mercy.
Lord have mercy.

Christ hear us.
Christ graciously hear us.

God, the Father of Heaven,
Have mercy on us.

God, the Son, Redeemer of the world,
Have mercy on us.

God, the Holy Spirit,
Have mercy on us.

Holy Trinity, One God,
Have mercy on us.


Holy Mary,
Pray for us.  

Holy Mother of God,  
Pray for us.  

Holy Virgin of Virgins,  
Pray for us.  

Mother of Christ,  
Pray for us.  

Mother of the Church,  
Pray for us.  

Mother of Mercy,  
Pray for us.  

Mother of Divine Grace,  
Pray for us.  

Mother of Hope,  
Pray for us.  

Mother Most Pure,  
Pray for us.  

Mother Most Chaste,  
Pray for us.  

Mother Inviolate,  
Pray for us.  

Mother Undefiled,  
Pray for us.  

Mother Most Amiable,  
Pray for us.  

Mother Most Admirable,  
Pray for us.  

Mother of Good Counsel,  
Pray for us.  

Mother of our Creator,  
Pray for us.  

Mother of our Savior,  
Pray for us.  

Virgin Most Prudent,  
Pray for us.  

Virgin Most Venerable,  
Pray for us.  

Virgin Most Renowned,  
Pray for us.  

Virgin Most Powerful,  
Pray for us.  

Virgin Most Merciful,  
Pray for us.  

Virgin Most Faithful,  
Pray for us.  

Mirror of Justice,  
Pray for us.  

Seat of Wisdom,  
Pray for us.  

Cause of Our Joy,  
Pray for us.  

Spiritual Vessel,  
Pray for us.  

Vessel of Honor,  
Pray for us.  

Singular Vessel of Devotion,  
Pray for us.  

Mystical Rose,  
Pray for us.  

Tower of David,  
Pray for us.  

Tower of Ivory,  
Pray for us.  

House of Gold,  
Pray for us.  

Ark of the Covenant,  
Pray for us.  

Gate of Heaven,  
Pray for us.  

Morning Star,  
Pray for us.  

Health of the Sick,  
Pray for us.  

Refuge of Sinners,  
Pray for us.  

Solace of Migrants,  
Pray for us.  

Comforter of the Afflicted,  
Pray for us.  

Help of Christians,  
Pray for us.  

Queen of Angels,  
Pray for us.  

Queen of Patriarchs,  
Pray for us.  

Queen of Prophets,  
Pray for us.  

Queen of Apostles,  
Pray for us.  

Queen of Martyrs,  
Pray for us.  

Queen of Confessors,  
Pray for us.  

Queen of Virgins,  
Pray for us.  

Queen of all Saints,  
Pray for us.  

Queen Conceived without Original Sin,  
Pray for us.  

Queen Assumed into Heaven,  
Pray for us.  

Queen of the Most Holy Rosary,  
Pray for us.  

Queen of Families,  
Pray for us.  

Queen of Peace,  
Pray for us.  

Lamb of God, Who takest away the sins of the world,
Spare us, O Lord.

Lamb of God, Who takest away the sins of the world,
Graciously hear us, O Lord.

Lamb of God, Who takest away the sins of the world,
Have mercy on us.

Pray for us, O holy Mother of God,  
That we be made worthy of the promises of Christ.  

**Let us pray:**
Grant, we beseech thee,  
O Lord God,  
That we, your servants,  
May enjoy perpetual health of mind and body;  
And by the intercession of the Blessed Mary, ever Virgin,  
May be delivered from present sorrow,  
And obtain eternal joy.  
Through Christ Our Lord. Amen.
