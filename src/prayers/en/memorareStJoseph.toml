title = "Memorare to St. Joseph"
categories = ["saints"]

[[versions]]
name = ""
content = """
Remember, O most pure Spouse of the Virgin Mary,
my sweet Protector Saint Joseph,
never was it heard
that anyone who implored thy help
nor sought thy intercession was left unaided.
Inspired by this confidence, I come to thee,
and to thee do I fervently commend myself.
Despise not my petitions,
I beseech thee,
foster Father of the Redeemer,
but graciously hear them. Amen.
"""
