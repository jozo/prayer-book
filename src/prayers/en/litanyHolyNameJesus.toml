title = "Litany of the Holy Name of Jesus"
categories = ["litany"]

[[versions]]
name = ""
content = """
Lord have mercy.
Christ have mercy.
Lord have mercy.

Christ hear us.
Christ graciously hear us.

God, the Father of Heaven,
Have mercy on us.

God, the Son, Redeemer of the world,
Have mercy on us.

God, the Holy Spirit,
Have mercy on us.

Holy Trinity, One God,
Have mercy on us.


Jesus, Son of the living God,
Have mercy on us.

Jesus, Splendor of the Father,
Have mercy on us.

Jesus, Brightness of eternal Light,
Have mercy on us.

Jesus, King of Glory,
Have mercy on us.

Jesus, Sun of Justice,
Have mercy on us.

Jesus, Son of the Virgin Mary,
Have mercy on us.

Jesus, most amiable,
Have mercy on us.

Jesus, most admirable,
Have mercy on us.

Jesus, the mighty God,
Have mercy on us.

Jesus, Father of the world to come,
Have mercy on us.

Jesus, angel of great counsel,
Have mercy on us.

Jesus, most powerful,
Have mercy on us.

Jesus, most patient,
Have mercy on us.

Jesus, most obedient,
Have mercy on us.

Jesus, meek and humble of heart,
Have mercy on us.

Jesus, Lover of Chastity,
Have mercy on us.

Jesus, our Lover,
Have mercy on us.

Jesus, God of Peace,
Have mercy on us.

Jesus, Author of Life,
Have mercy on us.

Jesus, Model of Virtues,
Have mercy on us.

Jesus, zealous for souls,
Have mercy on us.

Jesus, our God,
Have mercy on us.

Jesus, our Refuge,
Have mercy on us.

Jesus, Father of the Poor,
Have mercy on us.

Jesus, Treasure of the Faithful,
Have mercy on us.

Jesus, good Shepherd,
Have mercy on us.

Jesus, true Light,
Have mercy on us.

Jesus, eternal Wisdom,
Have mercy on us.

Jesus, infinite Goodness,
Have mercy on us.

Jesus, our Way and our Life,
Have mercy on us.

Jesus, joy of the Angels,
Have mercy on us.

Jesus, King of the Patriarchs,
Have mercy on us.

Jesus, Master of the Apostles,
Have mercy on us.

Jesus, Teacher of the Evangelists,
Have mercy on us.

Jesus, Strength of Martyrs,
Have mercy on us.

Jesus, Light of Confessors,
Have mercy on us.

Jesus, Purity of Virgins,
Have mercy on us.

Jesus, Crown of all Saints,
Have mercy on us.

Be merciful unto us,
Spare us, O Jesus!

Be merciful unto us,
Graciously hear us, O Jesus!

From all evil,
Deliver us, O Jesus.

From all sin,
Deliver us, O Jesus.

From Thy wrath,
Deliver us, O Jesus.

From the snares of the devil,
Deliver us, O Jesus.

From the spirit of fornication,
Deliver us, O Jesus.

From everlasting death,
Deliver us, O Jesus.

From the neglect of Thine inspirations,
Deliver us, O Jesus.

Through the mystery of Thy holy Incarnation,
Deliver us, O Jesus.

Through Thy Nativity,
Deliver us, O Jesus.

Through Thine Infancy,
Deliver us, O Jesus.

Through Thy most divine Life,
Deliver us, O Jesus.

Through Thy Labors,
Deliver us, O Jesus.

Through Thy Agony and Passion,
Deliver us, O Jesus.

Through Thy Cross and Dereliction,
Deliver us, O Jesus.

Through Thy Sufferings,
Deliver us, O Jesus.

Through Thy Death and Burial,
Deliver us, O Jesus.

Through Thy Resurrection,
Deliver us, O Jesus.

Through Thine Ascension,
Deliver us, O Jesus.

Through Thine Institution of the Most Holy Eucharist,
Deliver us, O Jesus.

Through Thy Joys,
Deliver us, O Jesus.

Through Thy Glory,
Deliver us, O Jesus.

Lamb of God, Who takest away the sins of the world,
Spare us, O Lord.

Lamb of God, Who takest away the sins of the world,
Graciously hear us, O Lord.

Lamb of God, Who takest away the sins of the world,
Have mercy on us.

**V.** Jesus, hear us.
**R.** Jesus, graciously hear us.

**Let us pray:**
O Lord Jesus Christ,
Who has said
Ask and ye shall receive;
seek, and ye shall find;
knock, and it shall be opened unto you
grant, we beseech Thee, to us who ask the grace of Thy most divine love,
that we may love Thee with all our hearts, words and works,
and never cease to praise Thee.
Make us, O Lord, to have a continual fear and love of Thy holy Name;
for Thou never ceasest to rule and govern
those whom Thou doest solidly establish in Thy love.
Who livest and reignest for ever and ever. Amen.
"""
