title = "Litany of the Sacred Heart of Jesus"
categories = ["litany"]

[[versions]]
name = ""
content = """
Lord have mercy.
Christ have mercy.
Lord have mercy.

Christ hear us.
Christ graciously hear us.

God, the Father of Heaven,
Have mercy on us.

God, the Son, Redeemer of the world,
Have mercy on us.

God, the Holy Spirit,
Have mercy on us.

Holy Trinity, One God,
Have mercy on us.

Heart of Jesus, Son of the Eternal Father,
Have mercy on us.

Heart of Jesus, formed in the womb of the Virgin Mother by the Holy Ghost,
Have mercy on us.

Heart of Jesus, united substantially with the word of God,
Have mercy on us.

Heart of Jesus, of infinite majesty,
Have mercy on us.

Heart of Jesus, holy temple of God,
Have mercy on us.

Heart of Jesus, tabernacle of the Most High,
Have mercy on us.

Heart of Jesus, house of God and gate of heaven,
Have mercy on us.

Heart of Jesus, glowing furnace of charity,
Have mercy on us.

Heart of Jesus, vessel of justice and love,
Have mercy on us.

Heart of Jesus, full of goodness and love,
Have mercy on us.

Heart of Jesus, abyss of all virtues,
Have mercy on us.

Heart of Jesus, most worthy of all praise,
Have mercy on us.

Heart of Jesus, king and center of all hearts,
Have mercy on us.

Heart of Jesus, in whom are all the treasures of wisdom and knowledge,
Have mercy on us.

Heart of Jesus, in whom dwelleth all the fullness of the Divinity,
Have mercy on us.

Heart of Jesus, in whom the Father is well pleased,
Have mercy on us.

Heart of Jesus, of whose fullness we have all received,
Have mercy on us.

Heart of Jesus, desire of the everlasting hills,
Have mercy on us.

Heart of Jesus, patient and rich in mercy,
Have mercy on us.

Heart of Jesus, rich to all who invoke Thee,
Have mercy on us.

Heart of Jesus, fount of life and holiness,
Have mercy on us.

Heart of Jesus, propitiation for our sins,
Have mercy on us.

Heart of Jesus, saturated with revilings,
Have mercy on us.

Heart of Jesus, crushed for our iniquities,
Have mercy on us.

Heart of Jesus, made obedient unto death,
Have mercy on us.

Heart of Jesus, pierced with a lance,
Have mercy on us.

Heart of Jesus, source of all consolation,
Have mercy on us.

Heart of Jesus, our life and resurrection,
Have mercy on us.

Heart of Jesus, our peace and reconciliation,
Have mercy on us.

Heart of Jesus, victim for our sins,
Have mercy on us.

Heart of Jesus, salvation of those who hope in Thee,
Have mercy on us.

Heart of Jesus, hope of those who die in Thee,
Have mercy on us.

Heart of Jesus, delight of all saints,
Have mercy on us.

Lamb of God, Who takest away the sins of the world,
Spare us, O Lord.

Lamb of God, Who takest away the sins of the world,
Graciously hear us, O Lord.

Lamb of God, Who takest away the sins of the world,
Have mercy on us.

**℣.** Jesus, meek and humble of Heart.  
**℟.** Make our hearts like unto Thine.

**Let us pray:**
Almighty and everlasting God,
look upon the Heart of Thy well-beloved Son
and upon the acts of praise and satisfaction which He renders unto Thee
in the name of sinners;
and do Thou, in Thy great goodness, grant pardon to them who seek Thy mercy,
in the name of the same Thy Son, Jesus Christ,
Who liveth and reigneth with Thee, world without end. Amen.
"""
