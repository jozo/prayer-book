title = "Student’s Prayer I (by St. Thomas Aquinas)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Come, Holy Spirit, Divine Creator, the true source of light and fountain of wisdom.

Pour forth your brilliance upon my intellect,
dissipate the darkness which covers me, that of sin and of ignorance.

Grant me a penetrating mind to understand, a retentive memory,
method and ease in learning, the lucidity to comprehend,
and abundant grace in expressing myself.

Guide the beginning of my work, direct its progress,
and bring it to successful completion.

This I ask through Jesus Christ, true God and true man,
living and reigning with You and the Father, forever and ever.

Amen.
"""
