title = "Litany of the Most Precious Blood of our Lord Jesus Christ"
categories = ["litany"]

[[versions]]
name = ""
content = """
Lord have mercy.
Christ have mercy.
Lord have mercy.

Christ hear us.
Christ graciously hear us.

God, the Father of Heaven,
_Have mercy on us._

God, the Son, Redeemer of the world,
_Have mercy on us._

God, the Holy Spirit,
_Have mercy on us._

Holy Trinity, One God,
_Have mercy on us._

Blood of Christ, only-begotten Son of the Eternal Father,
_Save us._

Blood of Christ, Incarnate Word of God,
_Save us._

Blood of Christ, of the New and Eternal Testament,
_Save us._

Blood of Christ, falling upon the earth in the Agony,
_Save us._

Blood of Christ, shed profusely in the Scourging,
_Save us._

Blood of Christ, flowing forth in the Crowning with Thorns,
_Save us._

Blood of Christ, poured out on the Cross,
_Save us._

Blood of Christ, price of our salvation,
_Save us._

Blood of Christ, without which there is no forgiveness,
_Save us._

Blood of Christ, Eucharistic drink and refreshment of souls,
_Save us._

Blood of Christ, stream of mercy,
_Save us._

Blood of Christ, victor over demons,
_Save us._

Blood of Christ, courage of Martyrs,
_Save us._

Blood of Christ, strength of Confessors,
_Save us._

Blood of Christ, bringing forth Virgins,
_Save us._

Blood of Christ, help of those in peril,
_Save us._

Blood of Christ, relief of the burdened,
_Save us._

Blood of Christ, solace in sorrow,
_Save us._

Blood of Christ, hope of the penitent,
_Save us._

Blood of Christ, consolation of the dying,
_Save us._

Blood of Christ, peace and tenderness of hearts,
_Save us._

Blood of Christ, pledge of eternal life,
_Save us._

Blood of Christ, freeing souls from purgatory,
_Save us._

Blood of Christ, most worthy of all glory and honor,
_Save us._

Lamb of God, Who takest away the sins of the world,
_Spare us, O Lord._

Lamb of God, Who takest away the sins of the world,
_Graciously hear us, O Lord._

Lamb of God, Who takest away the sins of the world,
_Have mercy on us._

**℣.** Thou hast redeemed us with Thy Blood, O Lord.

**℟.** And made of us a kingdom for our God.

**Let us pray:**
Almighty, and everlasting God, Who hast appointed Thine only-begotten Son to be
the Redeemer of the world, and hast been pleased to be reconciled unto us by His
Blood, grant us, we beseech Thee, so to venerate with solemn worship the price of
our salvation, that the power thereof may here on earth keep us from all things
hurtful, and the fruit of the same may gladden us for ever hereafter in heaven.
Through the same Christ our Lord.

**℟.** Amen.
"""
