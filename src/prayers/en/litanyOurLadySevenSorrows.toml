title = "Litany of Our Lady of the Seven Sorrows"
categories = ["litany"]

[[versions]]
name = ""
content = """
Lord have mercy.
Christ have mercy.
Lord have mercy.

Christ hear us.
Christ graciously hear us.

God, the Father of Heaven,
_Have mercy on us._

God, the Son, Redeemer of the world,
_Have mercy on us._

God, the Holy Spirit,
_Have mercy on us._

Holy Trinity, One God,
_Have mercy on us._

Holy Mary,
_Pray for us._

Holy Mother of God,
_Pray for us._

Holy Virgin of virgins,
_Pray for us._

Mother crucified,
_Pray for us._

Mother sorrowful,
_Pray for us._

Mother tearful,
_Pray for us._

Mother afflicted,
_Pray for us._

Mother forsaken,
_Pray for us._

Mother desolate,
_Pray for us._

Mother bereft of thy Son,
_Pray for us._

Mother pierced with a sword,
_Pray for us._

Mother consumed with grief,
_Pray for us._

Mother filled with anguish,
_Pray for us._

Mother crucified in heart,
_Pray for us._

Mother most sad,
_Pray for us._

Fountain of tears,
_Pray for us._

Mass of suffering,
_Pray for us._

Mirror of patience,
_Pray for us._

Rock of consistency,
_Pray for us._

Anchor of confidence,
_Pray for us._

Refuge of the forsaken,
_Pray for us._

Shield of the oppressed,
_Pray for us._

Subduer of the unbelieving,
_Pray for us._

Comfort of the wretched,
_Pray for us._

Medicine of the sick,
_Pray for us._

Strength of the weak,
_Pray for us._

Harbor of the wrecked,
_Pray for us._

Allay of tempests,
_Pray for us._

Resource of mourners,
_Pray for us._

Terror of the treacherous,
_Pray for us._

Treasure of the faithful,
_Pray for us._

Eye of the prophets,
_Pray for us._

Staff of Apostles,
_Pray for us._

Crown of martyrs,
_Pray for us._

Light of Confessors,
_Pray for us._

Pearl of Virgins,
_Pray for us._

Consolation of widows,
_Pray for us._

Joy of all Saints,
_Pray for us._

Lamb of God, Who takest away the sins of the world,
_Spare us, O Lord._

Lamb of God, Who takest away the sins of the world,
_Graciously hear us, O Lord._

Lamb of God, Who takest away the sins of the world,
_Have mercy on us._

Look down upon us, deliver us from all trouble in the power of Jesus Christ. Amen.

Imprint, O Lady, thy wound upon my heart, that I may read therein sorrow and love
sorrow, to endure every sorrow for thee;
love, to despise every love for thee.

Creed. Hail Holy Queen, and three Hail Marys.
"""
