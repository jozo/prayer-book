title = "Litany of the Immaculate Heart of Mary"
categories = ["litany"]

[[versions]]
name = ""
content = """
Lord have mercy.
Christ have mercy.
Lord have mercy.

Christ hear us.
Christ graciously hear us.

God, the Father of Heaven,
_Have mercy on us._

God, the Son, Redeemer of the world,
_Have mercy on us._

God, the Holy Spirit,
_Have mercy on us._

Holy Trinity, One God,
_Have mercy on us._

Heart of Mary,
_Pray for us._

Heart of Mary, according to the Heart of Jesus,
_Pray for us._

Heart of Mary, united to the Heart of Jesus,
_Pray for us._

Heart of Mary, Sanctuary of the Holy Ghost,
_Pray for us._

Heart of Mary, Temple of the Divinity,
_Pray for us._

Heart of Mary, Tabernacle of the Word incarnate,
_Pray for us._

Heart of Mary, always exempt from sin,
_Pray for us._

Heart of Mary, always full of grace,
_Pray for us._

Heart of Mary, blessed among all hearts,
_Pray for us._

Heart of Mary, illustrious throne of glory,
_Pray for us._

Heart of Mary, abyss and prodigy of humility,
_Pray for us._

Heart of Mary, glorious holocaust of divine love,
_Pray for us._

Heart of Mary, nailed to the cross of Jesus,
_Pray for us._

Heart of Mary, comfort of the afflicted,
_Pray for us._

Heart of Mary, refuge of sinners,
_Pray for us._

Heart of Mary, hope of the agonizing,
_Pray for us._

Heart of Mary, seat of mercy,
_Pray for us._

Lamb of God, Who takest away the sins of the world,
_Spare us, O Lord._

Lamb of God, Who takest away the sins of the world,
_Graciously hear us, O Lord._

Lamb of God, Who takest away the sins of the world,
_Have mercy on us._

**℣.** Pray for us, O holy Mother of God.

**℟.** That we may be made worthy of the promises of Christ.

**Let us pray:**
O divine Jesus, Who tenderly lovest the most holy of virgins, and art reciprocally loved by her, grant, we beseech Thee, through the intercession of Thy blessed Mother, and by the resemblance her sacred Heart bore to Thine, that we may ever return due love and affection for her care and tenderness in our regard, Who with the Father and the Holy Ghost, livest and reignest, world without end.

**℟.** Amen.
"""
