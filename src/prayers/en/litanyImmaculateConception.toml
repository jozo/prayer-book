title = "Litany of the Immaculate Conception"
categories = ["litany"]

[[versions]]
name = ""
content = """
Lord have mercy.
Christ have mercy.
Lord have mercy.

Christ hear us.
Christ graciously hear us.

God, the Father of Heaven,
_Have mercy on us._

God, the Son, Redeemer of the world,
_Have mercy on us._

God, the Holy Spirit,
_Have mercy on us._

Holy Trinity, One God,
_Have mercy on us._

Holy Mary, Virgin conceived without the stain of sin,
_Pray for us._

Immaculate Virgin of Virgins,
_Pray for us._

Immaculate Eternal Daughter of the Father,
_Pray for us._

The Immaculate Mother of Jesus, the Son of God,
_Pray for us._

Immaculate Spouse of the Holy Spirit,
_Pray for us._

Immaculate Virgin, Temple of the Holy Trinity,
_Pray for us._

Image of the Wisdom of God, from the line of David, which crushed the head of the serpent,
_Pray for us._

Immaculate Virgin, who by the power of God overcame original sin,
_Pray for us._

Immaculate Virgin, Dawn of the Sun of Justice,
_Pray for us._

The Immaculate Virgin, the Living Ark, in which she deposited the most precious body of the Redeemer,
_Pray for us._

Immaculate Virgin, the way of life, leading to Jesus,
_Pray for us._

Immaculate Virgin, Queen of heaven and earth,
_Pray for us._

Immaculate Virgin, Source of graces,
_Pray for us._

Immaculate Virgin, Heavenly Gate of Jerusalem,
_Pray for us._

Immaculate Virgin, Spouse of Chaste Joseph,
_Pray for us._

Immaculate Virgin, Star shining at the joy of the world,
_Pray for us._

Immaculate Virgin, Fortress of the Church Militant,
_Pray for us._

Immaculate Virgin, Rose among Thorns,
_Pray for us._

Immaculate Virgin, Olive tree in the mystic field,
_Pray for us._

Immaculate Virgin, Example of perfection,
_Pray for us._

Immaculate Virgin, Pillar of our faith,
_Pray for us._

Immaculate Virgin, Source of divine love,
_Pray for us._

Immaculate Virgin, Sure sign of eternal salvation,
_Pray for us._

Immaculate Virgin, Rule of perfect obedience,
_Pray for us._

Immaculate Virgin, Wonderful temple of purity,
_Pray for us._

Immaculate Virgin, Anchor of eternal life,
_Pray for us._

Immaculate Virgin, Crown of the Patriarchs,
_Pray for us._

Immaculate Virgin, Mistress of the Apostles,
_Pray for us._

Immaculate Virgin, Fortitude of the Martyrs,
_Pray for us._

Immaculate Virgin, Perseverance of the Confessors,
_Pray for us._

Immaculate Virgin, Purity of Virgins,
_Pray for us._

Immaculate Virgin, Joy of all who hope in thee,
_Pray for us._

Immaculate Virgin, Salvation of the sick,
_Pray for us._

Immaculate Virgin, Refuge of sinners,
_Pray for us._

Immaculate Virgin, Terror of heretics,
_Pray for us._

Immaculate Virgin, sweet and powerful Patroness of all the faithful of the Church,
_Pray for us._

Lamb of God, Who takest away the sins of the world,
_Spare us, O Lord._

Lamb of God, Who takest away the sins of the world,
_Graciously hear us, O Lord._

Lamb of God, Who takest away the sins of the world,
_Have mercy on us._

Christ hear us.
Christ graciously hear us.

Lord have mercy.
Christ have mercy.
Lord have mercy.

**℣.** Immaculate Virgin, pray for us,

**℟.** That we may be made worthy of the promises of thy Son Jesus Christ.

**Let us pray:**

Almighty eternal God, who hast deigned to make thy Church rejoice with the glory of the Immaculate Conception of the Mother of thy eternal Son, grant that those who remember this Immaculate Conception with joy on earth, may deserve eternal joy in heaven; Through Christ our Lord.

**℟.** Amen.
"""
