title = "God's love (by Fritz Mascarenhas)"
categories = ["other"]

[[versions]]
name = ""
content = """
Abba Father, You are my Father and I am your son/daughter. I am loved by you.
Every facet of my life, even a hair on my head is taken into account
by your loving, caring, healing, freeing, providing and sanctifying love.

I have nothing to be anxious about so I abandon myself to your love and care
and I find my peace and rest in You my Father, in You Jesus my Saviour and
Good Shepherd and in You Holy Spirit my Comforter and Guide.

Br. Fritz Mascarenhas
"""
