title = "Chaplet of Divine Mercy"
categories = ["basic"]

[[versions]]
name = ""
content = """
**Opening:**

_Our Father..._

_Hail Mary..._

_The Apostles' Creed..._

**On each "Our Father" bead of the rosary, pray:**

**℣.** Eternal Father, I offer you the Body and Blood, soul and divinity of your dearly beloved Son, our Lord Jesus Christ,

**℟.** in atonement for our sins and those of the whole world.

**On each of the 10 "Hail Mary" beads, pray:**

**℣.** For the sake of his sorrowful Passion,

**℟.** have mercy on us and on the whole world.

**Conclusion:**

Holy God, Holy Mighty One, Holy Immortal One, have mercy on us and on the whole world. (3x)

**Closing Prayer (optional):**

_(Diary, 950)_

Eternal God, in whom mercy is endless and the treasury of compassion inexhaustible, look kindly upon us and increase your mercy in us, that in difficult moments we might not despair nor become despondent, but with great confidence submit ourselves to your holy will, which is Love and Mercy itself. Amen.

**Or:**

_(Roman Missal, Votive Mass of the Mercy of God)_

O God, whose mercies are without number and whose treasure of goodness is infinite, graciously increase the faith of the people consecrated to you, that all may grasp and rightly understand by whose love they have been created, through whose Blood they have been redeemed, and by whose Spirit they have been reborn. Through Christ our Lord. Amen.
"""