title = "Litany of Our Lady of Sorrows"
categories = ["litany"]

[[versions]]
name = ""
content = """
Lord have mercy.
Christ have mercy.
Lord have mercy.

Christ hear us.
Christ graciously hear us.

God, the Father of Heaven,
Have mercy on us.

God, the Son, Redeemer of the world,
Have mercy on us.

God, the Holy Spirit,
Have mercy on us.

Holy Trinity, One God,
Have mercy on us.


Holy Mary,
Pray for us.

Holy Mother of God,
Pray for us.

Holy Virgin of virgins,
Pray for us.

Mother crucified,
Pray for us.

Mother sorrowful,
Pray for us.

Mother tearful,
Pray for us.

Mother afflicted,
Pray for us.

Mother forsaken,
Pray for us.

Mother desolate,
Pray for us.

Mother bereft of thy Son,
Pray for us.

Mother pierced with a sword,
Pray for us.

Mother consumed with grief,
Pray for us.

Mother filled with anguish,
Pray for us.

Mother crucified in heart,
Pray for us.

Mother most sad,
Pray for us.

Fountain of tears,
Pray for us.

Mass of suffering,
Pray for us.

Mirror of patience,
Pray for us.

Rock of consistency,
Pray for us.

Anchor of confidence,
Pray for us.

Refuge of the forsaken,
Pray for us.

Shield of the oppressed,
Pray for us.

Subduer of the unbelieving,
Pray for us.

Comfort of the wretched,
Pray for us.

Medicine of the sick,
Pray for us.

Strength of the weak,
Pray for us.

Harbor of the wrecked,
Pray for us.

Allay of tempests,
Pray for us.

Resource of mourners,
Pray for us.

Terror of the treacherous,
Pray for us.

Treasure of the faithful,
Pray for us.

Eye of the prophets,
Pray for us.

Staff of Apostles,
Pray for us.

Crown of martyrs,
Pray for us.

Light of Confessors,
Pray for us.

Pearl of Virgins,
Pray for us.

Consolation of widows,
Pray for us.

Joy of all Saints,
Pray for us.

Lamb of God, Who takest away the sins of the world,
Spare us, O Lord.

Lamb of God, Who takest away the sins of the world,
Graciously hear us, O Lord.

Lamb of God, Who takest away the sins of the world,
Have mercy on us.

Look down upon us, deliver us from all trouble in the power of Jesus Christ. Amen.

Imprint, O Lady, thy wound upon my heart, that I may read therein sorrow and love
sorrow, to endure every sorrow for thee;
love, to despise every love for thee.

Creed. Hail Holy Queen, and three Hail Marys.
"""
