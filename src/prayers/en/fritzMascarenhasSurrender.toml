name = ""
content = """
Abba Father, Thy Kingdom come, Thy Will be done,
I unite my will to Thy Holy Will, strengthen my will
to continually say yes to Thy leading (Mat 6:9).

Jesus my Lord and my God, I enthrone You as The Lord and Saviour of my life.
You are my Good Shepherd, I entrust my life to your safe keeping,
teach me to hear Your Voice that I may follow You (John 10:27).

Holy Spirit be it done unto me according to Thy Word.
I want to be led by You.
Teach me do be docile according to Your Prompting (Rom 8:14).

Br. Fritz Mascarenhas<br>
