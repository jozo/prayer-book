title = "Litany of the Most Blessed Sacrament"
categories = ["litany"]

[[versions]]
name = ""
content = """
Lord have mercy.
Christ have mercy.
Lord have mercy.

Christ hear us.
Christ graciously hear us.

God, the Father of Heaven,
_Have mercy on us._

God, the Son, Redeemer of the world,
_Have mercy on us._

God, the Holy Spirit,
_Have mercy on us._

Holy Trinity, One God,
_Have mercy on us._

O Living Bread, who from heaven descended,
_Have mercy on us._

Hidden God and Savior,
_Have mercy on us._

Grain of the elect,
_Have mercy on us._

Wine sprouting forth virgins,
_Have mercy on us._

Wholesome Bread and delicacy of kings,
_Have mercy on us._

Perpetual sacrifice,
_Have mercy on us._

Clean oblation,
_Have mercy on us._

Lamb without spot,
_Have mercy on us._

Most pure Feast,
_Have mercy on us._

Food of angels,
_Have mercy on us._

Hidden manna,
_Have mercy on us._

Memory of God's wonders,
_Have mercy on us._

Supersubstantial Bread,
_Have mercy on us._

Word made flesh, living in us,
_Have mercy on us._

Holy Victim,
_Have mercy on us._

Cup of blessing,
_Have mercy on us._

Mystery of faith,
_Have mercy on us._

Most high and venerable Sacrament,
_Have mercy on us._

Most holy of all sacrifices,
_Have mercy on us._

True propitiatory Sacrifice for the living and the dead,
_Have mercy on us._

Heavenly antidote, by which we are preserved from sin,
_Have mercy on us._

Most stupendous of all miracles,
_Have mercy on us._

Most holy Commemoration of the Passion of Christ
_Have mercy on us._

Gift transcending all abundance,
_Have mercy on us._

Extraordinary memorial of divine love,
_Have mercy on us._

Affluence of divine largesse,
_Have mercy on us._

Most holy and august mystery,
_Have mercy on us._

Medicine of immortality,
_Have mercy on us._

Awesome and life-giving Sacrament,
_Have mercy on us._

Bread-made-Flesh by the omnipotence of the Word.
_Have mercy on us._

Unbloody sacrifice,
_Have mercy on us._

Our food and guest,
_Have mercy on us._

Sweetest banquet at which the Angels serve,
_Have mercy on us._

Sacrament of goodness,
_Have mercy on us._

Bond of love,
_Have mercy on us._

Offerer and offering,
_Have mercy on us._

Spiritual sweetness tasted in its own fountain,
_Have mercy on us._

Refreshment of holy souls,
_Have mercy on us._

Viaticum of those dying in the Lord,
_Have mercy on us._

Pledge of future glory,
_Have mercy on us._

Be merciful,
_Spare us, O Lord._

Be merciful,
_Graciously hear us, O Lord._

From the unworthy reception of Thy Body and Blood,
_Deliver us, O Lord._

From passions of the flesh,
_Deliver us, O Lord._

From the concupiscence of the eyes,
_Deliver us, O Lord._

From pride,
_Deliver us, O Lord._

From every occasion of sin,
_Deliver us, O Lord._

Through that desire, with which Thou desiredst to eat the Passover with Thy disciples,
_Deliver us, O Lord._

Through that profound humility with which Thou didst wash Thy disciples' feet,
_Deliver us, O Lord._

Through that most ardent love, with which Thou instituted this Divine Sacrament,
_Deliver us, O Lord._

Through the most precious Blood, which Thou hast left for us upon the altar,
_Deliver us, O Lord._

Through those five wounds of Thy most holy Body, which was given up for us,
_Deliver us, O Lord._

Sinners we are,
_We ask Thee, hear us._

That Thou wouldst graciously preserve and augment the faith, reverence, and devotion in us towards this admirable Sacrament,
_We ask Thee, hear us._

That Thou wouldst graciously lead us through the true confession of our sins to a frequent reception of the Eucharist,
_We ask Thee, hear us._

That Thou wouldst graciously free us from every heresy, falsehood, and blindness of the heart,
_We ask Thee, hear us._

That Thou wouldst graciously impart to us the heavenly and precious fruits of this most Holy Sacrament,
_We ask Thee, hear us._

That Thou wouldst graciously protect and strengthen us in our hour of death with this heavenly viaticum,
_We ask Thee, hear us._

O Son of God,
_We ask Thee, hear us._

Lamb of God, Who takest away the sins of the world,
_Spare us, O Lord._

Lamb of God, Who takest away the sins of the world,
_Graciously hear us, O Lord._

Lamb of God, Who takest away the sins of the world,
_Have mercy on us._

Christ hear us.
Christ graciously hear us.

Lord have mercy.
Christ have mercy.
Lord have mercy.

Our Father...

Hail Mary...

**℣.** Thou didst furnished them with Bread from heaven, (P.T. Alleluia)

**℟.** Having in it every delight. (P.T. Alleluia)

**Let us pray:**
O God, who under a marvelous Sacrament has left us a memorial of Thy Passion; grant us; we beseech Thee; so to venerate the sacred mysteries of Thy Body and Blood, that we may ever perceive within us the fruit of Thy Redemption. Thou, who livest and reignest forever and ever.

**℟.** Amen.
"""
