title = "Misterios Luminosos"
categories = ["rosary"]

[[versions]]
name = ""
content = """
1. **El Bautismo de Jesús en el Jordán.**
Fruto del Misterio: Apertura al Espíritu Santo, el Sanador.
2. **Las Bodas de Caná de Galilea.**
Fruto del Misterio: A Jesús por María, Comprensión de la capacidad de manifestarse por la fe.
3. **El anuncio del Reino de Dios por Jesús.**
Fruto del Misterio: Confianza en Dios (Llamada de conversión a Dios).
4. **La Transfiguración.**
Fruto del Misterio: El deseo de santidad.
5. **La institución de la Eucaristía.**
Fruto del Misterio: La Adoración.
"""
