title = "Letanía del Santo Nombre de Jesús"
categories = ["litany"]

[[versions]]
name = ""
content = """
Señor, ten piedad.
Cristo, ten piedad.
Señor, ten piedad.

Cristo, óyenos.
Cristo, escúchanos.

Dios Padre celestial,
_Ten piedad de nosotros._

Dios Hijo, Redentor del mundo,
_Ten piedad de nosotros._

Dios Espíritu Santo,
_Ten piedad de nosotros._

Santísima Trinidad, un solo Dios,
_Ten piedad de nosotros._

Jesús, hijo de Dios vivo,
_Ten piedad de nosotros._

Jesús, esplendor del Padre,
_Ten piedad de nosotros._

Jesús, pureza de la luz eterna,
_Ten piedad de nosotros._

Jesús, rey de la gloria,
_Ten piedad de nosotros._

Jesús, sol de justicia,
_Ten piedad de nosotros._

Jesús, hijo de la Virgen María,
_Ten piedad de nosotros._

Jesús, amable,
_Ten piedad de nosotros._

Jesús, admirable,
_Ten piedad de nosotros._

Jesús, Dios fuerte,
_Ten piedad de nosotros._

Jesús, padre del siglo futuro,
_Ten piedad de nosotros._

Jesús, mensajero del plan divino,
_Ten piedad de nosotros._

Jesús Todopoderoso,
_Ten piedad de nosotros._

Jesús, pacientísimo,
_Ten piedad de nosotros._

Jesús, obedientísimo,
_Ten piedad de nosotros._

Jesús, manso y humilde de corazón,
_Ten piedad de nosotros._

Jesús, amante de la castidad,
_Ten piedad de nosotros._

Jesús, amador nuestro,
_Ten piedad de nosotros._

Jesús, Dios de paz,
_Ten piedad de nosotros._

Jesús, autor de la vida,
_Ten piedad de nosotros._

Jesús, modelo de virtudes,
_Ten piedad de nosotros._

Jesús, celoso de la salvación de las almas,
_Ten piedad de nosotros._

Jesús, nuestro Dios,
_Ten piedad de nosotros._

Jesús, nuestro refugio,
_Ten piedad de nosotros._

Jesús, padre de los pobres,
_Ten piedad de nosotros._

Jesús Tesoro de los fieles,
_Ten piedad de nosotros._

Jesús, pastor bueno,
_Ten piedad de nosotros._

Jesús, verdadera luz,
_Ten piedad de nosotros._

Jesús, sabiduría eterna,
_Ten piedad de nosotros._

Jesús, bondad infinita,
_Ten piedad de nosotros._

Jesús, camino y vida nuestra,
_Ten piedad de nosotros._

Jesús, alegría de los ángeles,
_Ten piedad de nosotros._

Jesús, rey de los patriarcas,
_Ten piedad de nosotros._

Jesús, maestro de los apóstoles,
_Ten piedad de nosotros._

Jesús, doctor de los evangelistas,
_Ten piedad de nosotros._

Jesús, fortaleza de los mártires,
_Ten piedad de nosotros._

Jesús, luz de los confesores,
_Ten piedad de nosotros._

Jesús, pureza de las vírgenes,
_Ten piedad de nosotros._

Jesús, corona de todos los santos,
_Ten piedad de nosotros._

Sednos propicio,
_Perdónanos, Jesús._

Sednos propicio,
_Escúchanos, Jesús._

De todo mal,
_Líbranos, Jesús._

De todo pecado,
_Líbranos, Jesús._

De tu ira,
_Líbranos, Jesús._

De las asechanzas del demonio,
_Líbranos, Jesús._

Del espíritu impuro,
_Líbranos, Jesús._

De la muerte eterna,
_Líbranos, Jesús._

Del menosprecio de tus inspiraciones,
_Líbranos, Jesús._

Por el misterio de tu santa encarnación,
_Líbranos, Jesús._

Por tu natividad,
_Líbranos, Jesús._

Por tu infancia,
_Líbranos, Jesús._

Por tu divinísima vida,
_Líbranos, Jesús._

Por tus trabajos,
_Líbranos, Jesús._

Por tu agonía y pasión,
_Líbranos, Jesús._

Por tu cruz y desamparo,
_Líbranos, Jesús._

Por tus sufrimientos,
_Líbranos, Jesús._

Por tu muerte y sepultura,
_Líbranos, Jesús._

Por tu resurrección,
_Líbranos, Jesús._

Por tu ascensión,
_Líbranos, Jesús._

Por tu institución de la santísima eucaristía,
_Líbranos, Jesús._

Por tus gozos,
_Líbranos, Jesús._

Por tu gloria,
_Líbranos, Jesús._

Cordero de Dios, que quitas el pecado del mundo,
_Perdónanos, Jesús._

Cordero de Dios, que quitas el pecado del mundo,
_Óyenos, Jesús._

Cordero de Dios, que quitas el pecado del mundo,
_Ten misericordia de nosotros, Jesús._

**℣.** Jesús, óyenos.

**℟.** Jesús, escúchanos.

**Oremos:**
Te pedimos Señor, que quienes veneremos el Santísimo Nombre de Jesús
disfrutemos en esta vida de la dulzura de su gracia y de su gozo eterno en el cielo. Por Jesucristo nuestro Señor.

**℟.** Amén.
"""
