title = "Oración del Estudiante II (por Santo Tomás de Aquino)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Concédeme, misericordioso Dios,
tener un ardiente deseo por lo que te agrada,
una prudente investigación de ello,
una búsqueda diligente,
un conocimiento veraz
y el cumplimiento perfecto de lo mismo.

Ordena, Dios mío, el inicio de mi obra,
dirige su progreso
y perfecciona tú mismo lo que yo no logro completar.

Te lo pido por Cristo nuestro Señor.

Amén.
"""
