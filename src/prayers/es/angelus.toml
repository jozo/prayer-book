title = "Angelus"
categories = ["basic"]

[[versions]]
name = ""
content = """
**V**: El Angel del Señor anunció a María.

**R**: Y concibió por obra del Espíritu Santo.

_Dios te salve, María..._


**V**: He aquí la esclava del Señor.

**R**: Hágase en mí según Tu palabra.

_Dios te salve, María..._


**V**: Y el Verbo se hizo carne.

**R**: Y habitó entre nosotros.

_Dios te salve, María..._


**V**: Ruega por nosotros, Santa Madre de Dios.

**R**: Para que seamos dignos de alcanzar las promesas de Nuestro Señor Jesucristo.

Oremos: Derrama, Señor, Tu gracia en nuestros corazones; que habiendo conocido la Encarnación de Jesucristo,
Tu Hijo, por la voz del Angel, por los méritos de Su Pasión y de Su Cruz seamos llevados a la gloria
de la Resurrección. Por el mismo Jesucristo, Nuestro Señor.

Amén.
"""
