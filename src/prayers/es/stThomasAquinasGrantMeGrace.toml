title = "Concédeme la Gracia (por Santo Tomás de Aquino)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Concédeme la gracia, oh Dios misericordioso, de:

- desear con ardor,
- examinar con prudencia,
- reconocer con verdad,
- y cumplir con perfección,

todo lo que sea de tu agrado,
para alabanza y gloria de tu santo Nombre.

Amen.
"""
