title = "Oración A San Miguel Arcángel"
categories = ["basic", "saints"]

[[versions]]
name = ""
content = """
San Miguel, Arcángel, defiéndenos en la batalla.
Sé nuestro amparo contra la perversidad y acechanzas del demonio.

Reprímale, Dios, pedimos suplicantes; y tu,
Oh Príncipe de la milicia celestial,
arroja al infierno, con el divino poder, a satanás y a los otros espíritus malignos
que andan dispersos por el mundo para la perdición de las almas.

Amén.
"""
