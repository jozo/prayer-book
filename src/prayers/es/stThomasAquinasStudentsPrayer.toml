title = "Oración del Estudiante I (por Santo Tomás de Aquino)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Ven, Espíritu Santo, Creador divino,
fuente verdadera de luz y manantial de sabiduría.

Derrama sobre mi entendimiento tus resplandores,
disipa las tinieblas que me cubren:
las del pecado y las de la ignorancia.

Concédeme un entendimiento penetrante para comprender,
una memoria fiel para retener,
facilidad y método en el aprender,
lucidez para interpretar
y abundante gracia al expresarme.

Guía el comienzo de mi trabajo,
dirige su desarrollo
y llévalo a feliz término.

Esto te lo pido por Jesucristo,
Dios verdadero y hombre verdadero,
que vive y reina contigo y con el Padre
por los siglos de los siglos.

Amen.
"""
