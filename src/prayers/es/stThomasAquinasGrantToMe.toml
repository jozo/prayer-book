title = "Concédeme… (por Santo Tomás de Aquino)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Concédeme, oh Señor y Dios mío:
una mente para conocerte,
un corazón para buscarte,
sabiduría para encontrarte,
una conducta que te sea agradable,
perseverancia fiel en esperarte,
y la esperanza de abrazarte al final.

Amen.
"""
