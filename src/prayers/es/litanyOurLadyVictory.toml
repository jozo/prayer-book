title = "Letanía de Nuestra Señora de la Victoria"
categories = ["litany"]

[[versions]]
name = ""
content = """
Señor, ten misericordia.
Cristo, ten misericordia.
Señor, ten misericordia.

Cristo, óyenos.
Cristo, escúchanos benignamente.

Dios, Padre celestial,
_Ten misericordia de nosotros._

Dios, Hijo, Redentor del mundo,
_Ten misericordia de nosotros._

Dios, Espíritu Santo,
_Ten misericordia de nosotros._

Santísima Trinidad, un solo Dios,
_Ten misericordia de nosotros._

Nuestra Señora de la Victoria,
_Ruega por nosotros._

Hija victoriosa del Padre,
_Ruega por nosotros._

Madre victoriosa del Hijo,
_Ruega por nosotros._

Esposa victoriosa del Espíritu Santo,
_Ruega por nosotros._

Sierva victoriosa de la Santísima Trinidad,
_Ruega por nosotros._

Victoriosa en tu Inmaculada Concepción,
_Ruega por nosotros._

Victoriosa al aplastar la cabeza de la serpiente,
_Ruega por nosotros._

Victoriosa sobre todos los hijos de Adán,
_Ruega por nosotros._

Victoriosa sobre todos los enemigos,
_Ruega por nosotros._

Victoriosa en tu respuesta al Ángel Gabriel,
_Ruega por nosotros._

Victoriosa en tu desposorio con San José,
_Ruega por nosotros._

Victoriosa en el nacimiento de Cristo,
_Ruega por nosotros._

Victoriosa en la huida a Egipto,
_Ruega por nosotros._

Victoriosa en tu destierro,
_Ruega por nosotros._

Victoriosa en tu hogar de Nazaret,
_Ruega por nosotros._

Victoriosa al hallar a Cristo en el templo,
_Ruega por nosotros._

Victoriosa en la misión de tu Hijo,
_Ruega por nosotros._

Victoriosa en Su pasión y muerte,
_Ruega por nosotros._

Victoriosa en Su resurrección y ascensión,
_Ruega por nosotros._

Victoriosa en la venida del Espíritu Santo,
_Ruega por nosotros._

Victoriosa en tus dolores y gozos,
_Ruega por nosotros._

Victoriosa en tu gloriosa Asunción,
_Ruega por nosotros._

Victoriosa en los ángeles que permanecieron fieles,
_Ruega por nosotros._

Victoriosa en la felicidad de los santos,
_Ruega por nosotros._

Victoriosa en el mensaje de los profetas,
_Ruega por nosotros._

Victoriosa en el testimonio de los patriarcas,
_Ruega por nosotros._

Victoriosa en el celo de los apóstoles,
_Ruega por nosotros._

Victoriosa en el testimonio de los evangelistas,
_Ruega por nosotros._

Victoriosa en la sabiduría de los doctores,
_Ruega por nosotros._

Victoriosa en las obras de los confesores,
_Ruega por nosotros._

Victoriosa en el triunfo de todas las santas mujeres,
_Ruega por nosotros._

Victoriosa en la fidelidad de los mártires,
_Ruega por nosotros._

Victoriosa en tu poderosa intercesión,
_Ruega por nosotros._

Victoriosa bajo tus innumerables títulos,
_Ruega por nosotros._

Victoriosa en la hora de la muerte,
_Ruega por nosotros._

Cordero de Dios, que quitas los pecados del mundo,
_Perdónanos, Señor._

Cordero de Dios, que quitas los pecados del mundo,
_Escúchanos benignamente, Señor._

Cordero de Dios, que quitas los pecados del mundo,
_Ten misericordia de nosotros._

℣. Ruega por nosotros, bendita Señora de la Victoria.  
℟. Para que seamos dignos de las promesas de Cristo.

Oremos:
¡Oh Señora victoriosa! Tú que tienes tan poderoso influjo ante tu Divino Hijo para convertir los corazones más endurecidos, intercede por aquellos por quienes oramos, para que, ablandados por los rayos de la gracia divina, regresen a la unidad de la verdadera fe. Por Cristo nuestro Señor.

**℟.** Amen.
"""
