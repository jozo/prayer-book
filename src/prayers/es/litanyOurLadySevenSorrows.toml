title = "Letanía de Nuestra Señora de los Siete Dolores"
categories = ["litany"]

[[versions]]
name = ""
content = """
Señor, ten piedad.
Cristo, ten piedad.
Señor, ten piedad.

Cristo, óyenos.
Cristo, escúchanos.

Dios, Padre celestial,
_Ten misericordia de nosotros._

Dios, Hijo, Redentor del mundo,
_Ten misericordia de nosotros._

Dios, Espíritu Santo,
_Ten misericordia de nosotros._

Santísima Trinidad, un solo Dios,
_Ten misericordia de nosotros._

Santa María,
_Ruega por nosotros._

Santa Madre de Dios,
_Ruega por nosotros._

Santa Virgen de las Vírgenes,
_Ruega por nosotros._

Madre crucificada,
_Ruega por nosotros._

Madre dolorosa,
_Ruega por nosotros._

Madre lacrimosa,
_Ruega por nosotros._

Madre afligida,
_Ruega por nosotros._

Madre abandonada,
_Ruega por nosotros._

Madre desolada,
_Ruega por nosotros._

Madre privada de su Hijo,
_Ruega por nosotros._

Madre traspasada por la espada,
_Ruega por nosotros._

Madre consumida de dolor,
_Ruega por nosotros._

Madre llena de angustia,
_Ruega por nosotros._

Madre crucificada en el corazón,
_Ruega por nosotros._

Madre tristísima,
_Ruega por nosotros._

Fuente de lágrimas,
_Ruega por nosotros._

Cúmulo de dolores,
_Ruega por nosotros._

Espejo de paciencia,
_Ruega por nosotros._

Roca de constancia,
_Ruega por nosotros._

Ancla de confianza,
_Ruega por nosotros._

Refugio de los abandonados,
_Ruega por nosotros._

Escudo de los oprimidos,
_Ruega por nosotros._

Derrota de los incrédulos,
_Ruega por nosotros._

Consuelo de los miserables,
_Ruega por nosotros._

Medicina de los enfermos,
_Ruega por nosotros._

Fortaleza de los débiles,
_Ruega por nosotros._

Puerto de los náufragos,
_Ruega por nosotros._

Apaciguadora de tempestades,
_Ruega por nosotros._

Auxiliadora de los necesitados,
_Ruega por nosotros._

Terror de los que incitan al mal,
_Ruega por nosotros._

Tesoro de los fieles,
_Ruega por nosotros._

Ojo de los profetas,
_Ruega por nosotros._

Báculo de los apóstoles,
_Ruega por nosotros._

Corona de los mártires,
_Ruega por nosotros._

Luz de los confesores,
_Ruega por nosotros._

Perla de las vírgenes,
_Ruega por nosotros._

Consuelo de las viudas,
_Ruega por nosotros._

Alegría de todos los Santos,
_Ruega por nosotros._

Cordero de Dios, que quitas los pecados del mundo,
_Perdónanos, Señor._

Cordero de Dios, que quitas los pecados del mundo,
_Escúchanos, Señor._

Cordero de Dios, que quitas los pecados del mundo,
_Ten misericordia de nosotros._

**℣.** Ruega por nosotros, Madre de los Dolores.

**℟.** Para que seamos dignos de alcanzar las promesas de Nuestro Señor Jesucristo.

Oremos:
Oh Dios, que quisiste que la vida de la Virgen María estuviera marcada por el misterio del dolor, concédenos, te rogamos, que al recorrer con fe los Siete Dolores de su alma doliente, participemos de su compasión y unamos nuestros sufrimientos a la pasión de Tu Hijo para nuestra salvación. Por Jesucristo nuestro Señor. Amén.

Credo. Salve, y tres Ave Marías.
"""










title = "Litany of Our Lady of the Seven Sorrows"
categories = ["litany"]

[[versions]]
name = ""
content = """
Lord have mercy.
Christ have mercy.
Lord have mercy.

Christ hear us.
Christ graciously hear us.

God, the Father of Heaven,
_Have mercy on us._

God, the Son, Redeemer of the world,
_Have mercy on us._

God, the Holy Spirit,
_Have mercy on us._

Holy Trinity, One God,
_Have mercy on us._

Holy Mary,
_Pray for us._

Holy Mother of God,
_Pray for us._

Holy Virgin of virgins,
_Pray for us._

Mother crucified,
_Pray for us._

Mother sorrowful,
_Pray for us._

Mother tearful,
_Pray for us._

Mother afflicted,
_Pray for us._

Mother forsaken,
_Pray for us._

Mother desolate,
_Pray for us._

Mother bereft of thy Son,
_Pray for us._

Mother pierced with a sword,
_Pray for us._

Mother consumed with grief,
_Pray for us._

Mother filled with anguish,
_Pray for us._

Mother crucified in heart,
_Pray for us._

Mother most sad,
_Pray for us._

Fountain of tears,
_Pray for us._

Mass of suffering,
_Pray for us._

Mirror of patience,
_Pray for us._

Rock of consistency,
_Pray for us._

Anchor of confidence,
_Pray for us._

Refuge of the forsaken,
_Pray for us._

Shield of the oppressed,
_Pray for us._

Subduer of the unbelieving,
_Pray for us._

Comfort of the wretched,
_Pray for us._

Medicine of the sick,
_Pray for us._

Strength of the weak,
_Pray for us._

Harbor of the wrecked,
_Pray for us._

Allay of tempests,
_Pray for us._

Resource of mourners,
_Pray for us._

Terror of the treacherous,
_Pray for us._

Treasure of the faithful,
_Pray for us._

Eye of the prophets,
_Pray for us._

Staff of Apostles,
_Pray for us._

Crown of martyrs,
_Pray for us._

Light of Confessors,
_Pray for us._

Pearl of Virgins,
_Pray for us._

Consolation of widows,
_Pray for us._

Joy of all Saints,
_Pray for us._

Lamb of God, Who takest away the sins of the world,
_Spare us, O Lord._

Lamb of God, Who takest away the sins of the world,
_Graciously hear us, O Lord._

Lamb of God, Who takest away the sins of the world,
_Have mercy on us._

Look down upon us, deliver us from all trouble in the power of Jesus Christ. Amen.

Imprint, O Lady, thy wound upon my heart, that I may read therein sorrow and love
sorrow, to endure every sorrow for thee;
love, to despise every love for thee.

Creed. Hail Holy Queen, and three Hail Marys.
"""
