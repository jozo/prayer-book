title = "Después de la Comunión (por Santo Tomás de Aquino)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Te doy gracias, Señor, Padre omnipotente, Dios eterno,
porque, sin mérito alguno por mi parte, sino por sola tu misericordia,
te has dignado alimentarme, a mí, pecador y siervo indigno,
con el preciosísimo Cuerpo y la Sangre de tu Hijo,
nuestro Señor Jesucristo.

Te ruego que esta Sagrada Comunión no sea para mí motivo de juicio y condenación,
sino de perdón y salvación. Que esta Sagrada Comunión sea para mí armadura de fe
y escudo de buena voluntad, purificación de todos los vicios
y extirpación de todos los malos deseos.
Que acreciente en mí la caridad y la paciencia, la humildad y la obediencia
y todas las virtudes. Que sea una firme defensa contra los perversos designios
de todos mis enemigos visibles e invisibles,
y que serene perfectamente todos los movimientos de mi alma y de mi cuerpo.
Que esta Sagrada Comunión produzca en mí
una perfecta unión contigo, único y verdadero Dios,
y que finalmente me permita alcanzar la bienaventuranza eterna
cuando me llames.

Te ruego que me hagas llegar, a mí, pecador,
al inefable banquete donde Tú,
con tu Hijo y el Espíritu Santo,
eres para tus santos luz verdadera,
bienaventuranza plena,
gozo eterno y felicidad perfecta.
Por el mismo Cristo nuestro Señor.

Amen.
"""
