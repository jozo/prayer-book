title = "Letanías de la Divina Misericordia"
categories = ["litany"]

[[versions]]
name = ""
content = """
Señor, ten misericordia de nosotros.
Cristo, ten misericordia de nosotros.
Señor, ten misericordia de nosotros.

Cristo, óyenos.
Cristo, escúchanos.

Dios, Padre celestial,
_ten misericordia de nosotros._

Dios, Hijo, Redentor del mundo,
_ten misericordia de nosotros._

Dios, Espíritu Santo,
_ten misericordia de nosotros._

Santísima Trinidad, un solo Dios verdadero,
_ten misericordia de nosotros._

Misericordia Divina, que brota del seno del Padre,
_en Ti confío._

Misericordia Divina, supremo atributo de Dios,
_en Ti confío._

Misericordia Divina, misterio incomprensible,
_en Ti confío._

Misericordia Divina, fuente que brota del misterio de la Santísima Trinidad,
_en Ti confío._

Misericordia Divina, insondable para todo entendimiento humano o angélico,
_en Ti confío._

Misericordia Divina, de donde brotan toda vida y felicidad,
_en Ti confío._

Misericordia Divina, más sublime que los cielos,
_en Ti confío._

Misericordia Divina, fuente de milagros y maravillas,
_en Ti confío._

Misericordia Divina, que abarca todo el universo,
_en Ti confío._

Misericordia Divina, que bajó al mundo en la Persona del Verbo Encarnado,
_en Ti confío._

Misericordia Divina, que manó de la herida abierta del Corazón de Jesús,
_en Ti confío._

Misericordia Divina, encerrada en el Corazón de Jesús para nosotros y, especialmente, para los pecadores,
_en Ti confío._

Misericordia Divina, impenetrable en la institución de la Santa Hostia,
_en Ti confío._

Misericordia Divina, en la institución de la Santa Iglesia,
_en Ti confío._

Misericordia Divina, en el sacramento del Santo Bautismo,
_en Ti confío._

Misericordia Divina, en nuestra justificación por Jesucristo,
_en Ti confío._

Misericordia Divina, que nos acompaña durante toda la vida,
_en Ti confío._

Misericordia Divina, que nos abraza especialmente en la hora de la muerte,
_en Ti confío._

Misericordia Divina, que nos otorga la vida inmortal,
_en Ti confío._

Misericordia Divina, que nos acompaña en cada momento de nuestra vida,
_en Ti confío._

Misericordia Divina, que nos protege del fuego infernal,
_en Ti confío._

Misericordia Divina, en la conversión de los pecadores empedernidos,
_en Ti confío._

Misericordia Divina, asombro para los ángeles, incomprensible aun para los santos,
_en Ti confío._

Misericordia Divina, insondable en todos los misterios de Dios,
_en Ti confío._

Misericordia Divina, que nos rescata de toda miseria,
_en Ti confío._

Misericordia Divina, fuente de nuestra felicidad y deleite,
_en Ti confío._

Misericordia Divina, que de la nada nos llamó a la existencia,
_en Ti confío._

Misericordia Divina, que abarca todas las obras de Sus manos,
_en Ti confío._

Misericordia Divina, corona de todas las obras de Dios,
_en Ti confío._

Misericordia Divina, en la que estamos todos sumergidos,
_en Ti confío._

**Cordero de Dios …**
Cordero de Dios, que quitas los pecados del mundo,
_perdónanos, Señor._

Cordero de Dios, que quitas los pecados del mundo,
_escúchanos, Señor._

Cordero de Dios, que quitas los pecados del mundo,
_en misericordia de nosotros._

**℣.** Las misericordias de Dios son más grandes que todas sus obras.

**℟.** Por eso alabaremos la misericordia del Señor por siempre. 

**Oremos:**
Oh Dios eterno, en quien la misericordia es infinita y el tesoro de compasión inagotable, vuelve a nosotros Tu mirada bondadosa y aumenta Tu misericordia en nosotros; para que ni siquiera en los momentos más difíciles nos desesperemos ni desalentemos, sino que, con gran confianza, nos sometamos a Tu santa Voluntad — que es Misericordia y Amor mismos. Por nuestro Señor Jesucristo, Rey de Misericordia, que contigo y con el Espíritu Santo nos muestra misericordia ahora y por los siglos.

**℟.** Amen.
"""
