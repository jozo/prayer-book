title = "Misterios Dolorosos"
categories = ["rosary"]

[[versions]]
name = ""
content = """
1. **La Agonía en el Huerto de Getsemaní.**
Fruto del Misterio: Dolor por el Pecado, Uniformidad con la Voluntad de Dios.
2. **La flagelación de Jesús atado a la columna.**
Fruto del Misterio: Mortificación (Pureza).
3. **La Coronación de Espinas.**
Fruto del Misterio: El Desprecio del Mundo (Valor Moral).
4. **Jesús con la Cruz a cuestas camino del Calvario.**
Fruto del Misterio: Paciencia.
5. **Crucifixión y muerte del Señor.**
Fruto del misterio: Perseverancia en la fe, Gracia para una muerte santa. Perdón.
"""
