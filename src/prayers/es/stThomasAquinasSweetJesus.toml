title = "Dulce Jesús (por Santo Tomás de Aquino)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Dulce Jesús, Cuerpo y Sangre sacratísimos,
sed el deleite y gozo de mi alma,
mi fortaleza y salvación en todas las tentaciones,
mi alegría y paz en toda prueba,
mi luz y guía en cada palabra y acción,
y mi protector final en la hora de la muerte.

Amen.
"""
