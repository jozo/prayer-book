title = "Oración de San Pío X a San José Obrero"
categories = ["saints"]

[[versions]]
name = ""
content = """
Oh glorioso San José,
modelo de todos los que están consagrados al trabajo,
alcanzadme la gracia de trabajar con espíritu de penitencia
en expiación de mis numerosos pecados;
de trabajar con conciencia, poniendo el deber por encima de mis inclinaciones;
de considerar, con gratitud y alegría, como un honor
el emplear y desarrollar mediante el trabajo los dones que he recibido de Dios;
de trabajar ordenadamente, en paz, con moderación y paciencia,
sin rehuir jamás el trabajo por cansancio o dificultad;
de trabajar, sobre todo, con pureza de intención y desprendimiento,
teniendo incesantemente ante mis ojos la muerte
y la cuenta que debo rendir
del tiempo perdido, de los talentos no usados, del bien omitido,
y de la vana complacencia en el éxito,
tan funesta para la obra de Dios.
¡Todo por Jesús, todo por María, todo para imitarte a ti, oh Patriarca San José!
Éste será mi lema para la vida y para la eternidad. Amen.
"""
