title = "Letanías de la Inmaculada Concepción"
categories = ["litany"]

[[versions]]
name = ""
content = """
Señor, ten piedad.
Cristo, ten piedad.
Señor, ten piedad.

Cristo, óyenos.
Cristo, escúchanos.

Dios, Padre del Cielo,
_Ten piedad de nosotros._

Dios, Hijo, Redentor del mundo,
_Ten piedad de nosotros._

Dios, Espíritu Santo,
_Ten piedad de nosotros._

Santísima Trinidad, un solo Dios,
_Ten piedad de nosotros._

Santa María, Virgen concebida sin la mancha del pecado,
_Ruega por nosotros._

Inmaculada Virgen de las Vírgenes,
_Ruega por nosotros._

Inmaculada Hija eterna del Padre,
_Ruega por nosotros._

Inmaculada Madre de Jesús, el Hijo de Dios,
_Ruega por nosotros._

Inmaculada Esposa del Espíritu Santo,
_Ruega por nosotros._

Inmaculada Virgen, Templo de la Santísima Trinidad,
_Ruega por nosotros._

Imagen de la Sabiduría de Dios, del linaje de David, que aplastó la
cabeza de la serpiente,
_Ruega por nosotros._

Inmaculada Virgen, que por el poder de Dios venciste el pecado original,
_Ruega por nosotros._

Inmaculada Virgen, Aurora del Sol de Justicia,
_Ruega por nosotros._

Inmaculada Virgen, Arca viva donde se depositó el preciosísimo Cuerpo
del Redentor,
_Ruega por nosotros._

Inmaculada Virgen, camino de vida que conduce a Jesús,
_Ruega por nosotros._

Inmaculada Virgen, Reina del cielo y de la tierra,
_Ruega por nosotros._

Inmaculada Virgen, Fuente de gracias,
_Ruega por nosotros._

Inmaculada Virgen, Puerta celestial de Jerusalén,
_Ruega por nosotros._

Inmaculada Virgen, Esposa del castísimo José,
_Ruega por nosotros._

Inmaculada Virgen, Estrella que brilla para alegría del mundo,
_Ruega por nosotros._

Inmaculada Virgen, Fortaleza de la Iglesia militante,
_Ruega por nosotros._

Inmaculada Virgen, Rosa entre espinas,
_Ruega por nosotros._

Inmaculada Virgen, Olivo en el campo místico,
_Ruega por nosotros._

Inmaculada Virgen, Ejemplo de perfección,
_Ruega por nosotros._

Inmaculada Virgen, Pilar de nuestra fe,
_Ruega por nosotros._

Inmaculada Virgen, Fuente del amor divino,
_Ruega por nosotros._

Inmaculada Virgen, Signo seguro de la salvación eterna,
_Ruega por nosotros._

Inmaculada Virgen, Regla de perfecta obediencia,
_Ruega por nosotros._

Inmaculada Virgen, Maravilloso templo de pureza,
_Ruega por nosotros._

Inmaculada Virgen, Ancla de la vida eterna,
_Ruega por nosotros._

Inmaculada Virgen, Corona de los Patriarcas,
_Ruega por nosotros._

Inmaculada Virgen, Señora de los Apóstoles,
_Ruega por nosotros._

Inmaculada Virgen, Fortaleza de los Mártires,
_Ruega por nosotros._

Inmaculada Virgen, Perseverancia de los Confesores,
_Ruega por nosotros._

Inmaculada Virgen, Pureza de las Vírgenes,
_Ruega por nosotros._

Inmaculada Virgen, Gozo de todos los que esperan en ti,
_Ruega por nosotros._

Inmaculada Virgen, Salvación de los enfermos,
_Ruega por nosotros._

Inmaculada Virgen, Refugio de los pecadores,
_Ruega por nosotros._

Inmaculada Virgen, Terror de los herejes,
_Ruega por nosotros._

Inmaculada Virgen, dulce y poderosa Patrona de todos los fieles de la
Iglesia,
_Ruega por nosotros._

Cordero de Dios, que quitas los pecados del mundo,
_Perdónanos, Señor._

Cordero de Dios, que quitas los pecados del mundo,
_Escúchanos, Señor._

Cordero de Dios, que quitas los pecados del mundo,
_Ten piedad de nosotros._

Cristo, óyenos.
Cristo, escúchanos.

Señor, ten piedad.
Cristo, ten piedad.
Señor, ten piedad.

**℣.** Inmaculada Virgen, ruega por nosotros,

**℟.** Para que seamos dignos de las promesas de tu Hijo Jesucristo.

**Oremos:**

Dios omnipotente y eterno, que te has dignado hacer que tu Iglesia se regocije con la gloria de la Inmaculada Concepción de la Madre de tu Hijo eterno, concede que quienes recuerdan con alegría esta Inmaculada Concepción en la tierra merezcan gozar de la alegría eterna en el cielo. Por Cristo nuestro Señor..

**℟.** Amen.
"""
