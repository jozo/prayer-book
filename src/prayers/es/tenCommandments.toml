title = "Ten Commandments"
categories = ["basic"]

[[versions]]
name = ""
content = """
1. Yo soy el Señor tu Dios. Adorarás al Señor tu Dios adorarás y sólo a Él servirás.
2. No tomarás en vano el nombre del Señor tu Dios.
3. Acuérdate de santificar el día de reposo.
4. Honra a tu padre y a tu madre.
5. No matarás.
6. No cometerás actos impuros.
7. No robarás.
8. No dirás falso testimonio ni mentirás.
9. No desearás la mujer de tu prójimo.
10. No codiciarás los bienes ajenos.
"""
