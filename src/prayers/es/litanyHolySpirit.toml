title = "Letanías del Espíritu Santo"
categories = ["litany"]

[[versions]]
name = ""
content = """
Señor, _Ten piedad de nosotros._

Jesucristo, _Ten piedad de nosotros._

Señor, _Ten piedad de nosotros._

Dios, Padre celestial, _Ten piedad de nosotros._

Dios, Hijo, Redentor del mundo, _Ten piedad de nosotros._

Dios, Espíritu Santo, _Ten piedad de nosotros._

Trinidad Santa, un solo Dios, _Ten piedad de nosotros._

Divina Esencia, Dios verdadero y único, _Ten piedad de nosotros._

Espíritu de verdad y de sabiduría, _Ten piedad de nosotros._

Espíritu de santidad y de justicia, _Ten piedad de nosotros._

Espíritu de entendimiento y de consejo, _Ten piedad de nosotros._

Espíritu de caridad y de gozo, _Ten piedad de nosotros._

Espíritu de paz y de paciencia, _Ten piedad de nosotros._

Espíritu de longanimidad y mansedumbre, _Ten piedad de nosotros._

Espíritu de benignidad y de bondad, _Ten piedad de nosotros._

Amor substancial del Padre y del Hijo, _Ten piedad de nosotros._

Amor y vida de las almas santas, _Ten piedad de nosotros._

Fuego siempre ardiendo, _Ten piedad de nosotros._

Agua viva que apagáis la sed de los corazones, _Ten piedad de nosotros._

De todo mal, _Líbranos Espíritu Santo._

De toda impureza de alma y cuerpo, _Líbranos Espíritu Santo._

De toda gula y sensualidad, _Líbranos Espíritu Santo._

De todo afecto a los bienes terrenos, _Líbranos Espíritu Santo._

De todo afecto a cosas y a criaturas, _Líbranos Espíritu Santo._

De toda hipocresía y fingimiento, _Líbranos Espíritu Santo._

De toda imperfección y faltas deliberadas, _Líbranos Espíritu Santo._

Del amor propio y juicio propio, _Líbranos Espíritu Santo._

De la propia voluntad, _Líbranos Espíritu Santo._

De la murmuración, _Líbranos Espíritu Santo._

De la doblez a nuestros prójimos, _Líbranos Espíritu Santo._

De nuestras pasiones y apetitos desordenados, _Líbranos Espíritu Santo._

De no estar atentos a vuestra inspiración Santa, _Líbranos Espíritu Santo._

Del desprecio a las cosas pequeñas, _Líbranos Espíritu Santo._

De la glotonería y malicia, _Líbranos Espíritu Santo._

De todo regalo y comodidad, _Líbranos Espíritu Santo._

De querer buscar o desear algo que no seáis Vos, _Líbranos Espíritu Santo._

De todo lo que te desagrade, _Líbranos Espíritu Santo._

De todo pecado e imperfección y de todo mal, _Líbranos Espíritu Santo._

Padre amantísimo, _Perdónanos._

Divino Verbo, _Ten misericordia de nosotros._

Santo y Divino Espíritu, _No nos abandones hasta que estemos en posesión de la Divina Esencia, Cielo de los cielos._

Cordero de Dios, que borras los pecados del mundo, _Envíanos al divino Consolador._

Cordero de Dios, que borras los pecados del mundo,
_Llénanos de los dones de vuestro espíritu._

Cordero de Dios, que borras los pecados del mundo,
_Haz que crezcan en nosotros los frutos del Espíritu Santo._

Ven, ¡Oh Santo Espíritu!, llena los corazones de tus fieles y enciende en ellos el fuego de tu amor.

**℣.** Envía tu Espíritu y todo será creado.

**℟.** _Y se renovará la faz de la tierra._

**Oremos:**
¡Oh Dios!, que habéis instruido los corazones de los fieles con la luz del Espíritu Santo, concedednos,
según el mismo Espíritu, conocer las cosas rectas y gozar siempre de sus divinos consuelos.
Por Jesucristo, Señor nuestro.

**℟.** Amén.
"""
