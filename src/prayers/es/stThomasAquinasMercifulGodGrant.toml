title = "Oh Dios misericordioso, concédeme… (por Santo Tomás de Aquino)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Oh Dios misericordioso,
concédeme cumplir siempre perfectamente
Tu Voluntad en todas las cosas.
Que sea mi único deseo obrar
para Tu honor y Tu gloria.

Haz que no me goce en nada
que no me conduzca a Ti,
ni me aflija nada
que me aparte de Ti.

Que todas las cosas pasajeras
sean como nada ante mis ojos,
y que todo lo que es Tuyo
me sea querido,
y Tú, Dios mío,
más querido que todo.

Que toda alegría
sea vana sin Ti,
y que nada desee
fuera de Ti.
Que todo trabajo y fatiga
me sean dulces cuando sean por Ti.

Hazme, Señor:
obediente sin quejarme,
pobre sin pesar,
paciente sin murmurar,
humilde sin fingimiento,
alegre sin frivolidad,
y veraz sin doblez.

Dame, oh Dios,
un corazón siempre vigilante,
que nada pueda apartar de Ti;
un corazón noble,
que ningún afecto indigno
pueda arrastrar hacia la tierra;
un corazón recto,
que ningún mal pueda torcer;
un corazón invencible,
que ninguna tribulación pueda quebrantar;
un corazón libre,
que ninguna afección desordenada
pueda reclamar como propio.

Concédeme, oh Dios:
inteligencia para conocerte,
diligencia para buscarte,
y sabiduría para encontrarte;
una vida que pueda agradarte,
y una esperanza que pueda
abrazarte al final.

Amen.
"""
