title = "Letanía de los Santos"
categories = ["litany"]

[[versions]]
name = ""
content = """
Señor, ten misericordia.
Cristo, ten misericordia.
Señor, ten misericordia.

Cristo, óyenos.
Cristo, escúchanos benignamente.

Dios, Padre celestial,
_Ten misericordia de nosotros._

Dios, Hijo, Redentor del mundo,
_Ten misericordia de nosotros._

Dios, Espíritu Santo,
_Ten misericordia de nosotros._

Santísima Trinidad, un solo Dios,
_Ten misericordia de nosotros._

Santa María,
_Ruega por nosotros._

Santa Madre de Dios,
_Ruega por nosotros._

Santa Virgen de las vírgenes,
_Ruega por nosotros._

San Miguel,
_Ruega por nosotros._

San Gabriel,
_Ruega por nosotros._

San Rafael,
_Ruega por nosotros._

Todos los santos Ángeles y Arcángeles,
_Rogad por nosotros._

Todos los santos órdenes de bienaventurados espíritus,
_Rogad por nosotros._

San Juan Bautista,
_Ruega por nosotros._

San José,
_Ruega por nosotros._

Todos los santos Patriarcas y Profetas,
_Rogad por nosotros._

San Pedro,
_Ruega por nosotros._

San Pablo,
_Ruega por nosotros._

San Andrés,
_Ruega por nosotros._

Santiago,
_Ruega por nosotros._

San Juan,
_Ruega por nosotros._

Santo Tomás,
_Ruega por nosotros._

Santiago,
_Ruega por nosotros._

San Felipe,
_Ruega por nosotros._

San Bartolomé,
_Ruega por nosotros._

San Mateo,
_Ruega por nosotros._

San Simón,
_Ruega por nosotros._

San Tadeo,
_Ruega por nosotros._

San Matías,
_Ruega por nosotros._

San Bernabé,
_Ruega por nosotros._

San Lucas,
_Ruega por nosotros._

San Marcos,
_Ruega por nosotros._

Todos los santos Apóstoles y Evangelistas,
_Rogad por nosotros._

Todos los santos Discípulos del Señor,
_Rogad por nosotros._

Todos los santos Inocentes,
_Rogad por nosotros._

San Esteban,
_Ruega por nosotros._

San Lorenzo,
_Ruega por nosotros._

San Vicente,
_Ruega por nosotros._

Santos Fabián y Sebastián,
_Rogad por nosotros._

Santos Juan y Pablo,
_Rogad por nosotros._

Santos Cosme y Damián,
_Rogad por nosotros._

Santos Gervasio y Protasio,
_Rogad por nosotros._

Todos los santos Mártires,
_Rogad por nosotros._

San Silvestre,
_Ruega por nosotros._

San Gregorio,
_Ruega por nosotros._

San Ambrosio,
_Ruega por nosotros._

San Agustín,
_Ruega por nosotros._

San Jerónimo,
_Ruega por nosotros._

San Martín,
_Ruega por nosotros._

San Nicolás,
_Ruega por nosotros._

Todos los santos Obispos y Confesores,
_Rogad por nosotros._

Todos los santos Doctores,
_Rogad por nosotros._

San Antonio,
_Ruega por nosotros._

San Benito,
_Ruega por nosotros._

San Bernardo,
_Ruega por nosotros._

Santo Domingo,
_Ruega por nosotros._

San Francisco,
_Ruega por nosotros._

Todos los santos Sacerdotes y Levitas,
_Rogad por nosotros._

Todos los santos Monjes y Ermitaños,
_Rogad por nosotros._

Santa María Magdalena,
_Ruega por nosotros._

Santa Águeda,
_Ruega por nosotros._

Santa Lucía,
_Ruega por nosotros._

Santa Inés,
_Ruega por nosotros._

Santa Cecilia,
_Ruega por nosotros._

Santa Catalina,
_Ruega por nosotros._

Santa Anastasia,
_Ruega por nosotros._

Todas las santas Vírgenes y Viudas,
_Rogad por nosotros._

Todos los Santos de Dios,
_Interceded por nosotros._

Sednos propicio,
_Perdónanos, Señor._

Sednos propicio,
_Escúchanos benignamente, Señor._

De todo mal,
_Líbranos, Señor._

De todo pecado,
_Líbranos, Señor._

De tu ira,
_Líbranos, Señor._

De la muerte súbita e imprevista,
_Líbranos, Señor._

De las asechanzas del demonio,
_Líbranos, Señor._

De la ira, del odio y de todo mal querer,
_Líbranos, Señor._

Del espíritu de fornicación,
_Líbranos, Señor._

Del rayo y la tempestad,
_Líbranos, Señor._

Del azote de los terremotos,
_Líbranos, Señor._

De la peste, del hambre y de la guerra,
_Líbranos, Señor._

De la muerte eterna,
_Líbranos, Señor._

Por el misterio de tu santa Encarnación,
_Líbranos, Señor._

Por tu Venida,
_Líbranos, Señor._

Por tu Nacimiento,
_Líbranos, Señor._

Por tu Bautismo y santo ayuno,
_Líbranos, Señor._

Por tu Cruz y Pasión,
_Líbranos, Señor._

Por tu Muerte y Sepultura,
_Líbranos, Señor._

Por tu santa Resurrección,
_Líbranos, Señor._

Por tu admirable Ascensión,
_Líbranos, Señor._

Por la venida del Espíritu Santo, el Paráclito,
_Líbranos, Señor._

En el día del juicio,
_Líbranos, Señor._

Nosotros, pecadores,
_Te rogamos, óyenos._

Que te dignes perdonarnos,
_Te rogamos, óyenos._

Que te dignes escucharnos,
_Te rogamos, óyenos._

Que te dignes conducirnos a verdadera penitencia,
_Te rogamos, óyenos._

Que te dignes gobernar y conservar tu santa Iglesia,
_Te rogamos, óyenos._

Que te dignes conservar a nuestro Prelado Apostólico y a todas las órdenes de la Iglesia en santa religión,
_Te rogamos, óyenos._

Que te dignes humillar a los enemigos de la santa Iglesia,
_Te rogamos, óyenos._

Que te dignes conceder paz y verdadera concordia a los reyes y príncipes cristianos,
_Te rogamos, óyenos._

Que te dignes conceder paz y unión a todo el mundo cristiano,
_Te rogamos, óyenos._

Que te dignes llamar a la unidad de la Iglesia a cuantos se han extraviado, y conducir a los infieles a la luz del Evangelio,
_Te rogamos, óyenos._

Que te dignes confirmarnos y conservarnos en tu santo servicio,
_Te rogamos, óyenos._

Que te dignes elevar nuestras mentes a los deseos celestiales,
_Te rogamos, óyenos._

Que te dignes dar y conservar los frutos de la tierra,
_Te rogamos, óyenos._

Que te dignes conceder el descanso eterno a todos los fieles difuntos,
_Te rogamos, óyenos._

Que te dignes escucharnos benignamente,
_Te rogamos, óyenos._

Hijo de Dios,
_Te rogamos, óyenos._

Cordero de Dios, que quitas los pecados del mundo,
_Perdónanos, Señor._

Cordero de Dios, que quitas los pecados del mundo,
_Escúchanos benignamente, Señor._

Cordero de Dios, que quitas los pecados del mundo,
_Ten misericordia de nosotros._

Cristo, óyenos.
Cristo, escúchanos benignamente.

Señor, ten misericordia.
Cristo, ten misericordia.
Señor, ten misericordia.

Padre nuestro (en silencio).

℣. Y no nos dejes caer en la tentación.  
℟. Mas líbranos del mal.
"""
