title = "Misterios Gloriosos"
categories = ["rosary"]

[[versions]]
name = ""
content = """
1. **La Resurrección.**
Fruto del Misterio: Fe.
2. **La Ascensión.**
Fruto del Misterio: Esperanza, Deseo de Ascender al Cielo
3. **La Venida del Espíritu Santo.**
Fruto del Misterio: Amor de Dios, Santa Sabiduría para conocer la verdad y compartirla con todos, Caridad Divina, Adoración al Espíritu Santo.
4. **La Asunción de la Virgen María.**
Fruto del Misterio: Unión con María y Verdadera Devoción a María.
5. **La Coronación de la Virgen.**
Fruto del Misterio: Perseverancia y Aumento de la Virtud (Confianza en la Intercesión de María).
"""
