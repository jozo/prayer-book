title = "Regina Caeli (Reina del Cielo)"
categories = ["basic"]

[[versions]]
name = ""
content = """
**V.** Reina del Cielo, alégrate. Aleluya.

**R.** Porque el que mereciste llevar en tu seno. Aleluya.

**V.** Resucitó, como dijo. Aleluya.

**R.** Ruega por nosotros a Dios. Aleluya.

**V.** Gózate y alégrate, Virgen María. Aleluya.

**R.** Porque en verdad resucitó el Señor. Aleluya.

**V.** Oremos:
Oh Dios, que te dignaste alegrar al mundo por la Resurrección de tu Hijo, 
Nuestro Señor Jesucristo; concédenos, te rogamos, 
que por la mediación de la Virgen María, su Madre, 
alcancemos los gozos de la vida eterna. 
Por el mismo Jesucristo Nuestro Señor.

**R.** Amén.
"""
