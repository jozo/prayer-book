title = "Letanía a La Preciosísima Sangre de Nuestro Señor Jesucristo"
categories = ["litany"]

[[versions]]
name = ""
content = """
Señor, ten piedad de nosotros.
Cristo, ten piedad de nosotros.
Señor, ten piedad de nosotros.

Cristo, óyenos.
Cristo, escúchanos.

Dios Padre celestial,
_ten piedad de nosotros._

Dios Hijo, Redentor del mundo,
_ten piedad de nosotros._

Dios Espíritu Santo,
_ten piedad de nosotros._

Santísima Trinidad, que sois un solo Dios,
_ten piedad de nosotros._

Sangre de Cristo, del Unigénito del Padre,
_Sálvanos._

Sangre de Cristo, del Verbo de Dios encarnado,
_Sálvanos._

Sangre de Cristo, del Testamento Nuevo y Eterno,
_Sálvanos._

Sangre de Cristo, derramada sobre la tierra en la agonía,
_Sálvanos._

Sangre de Cristo, vertida copiosamente en la flagelación,
_Sálvanos._

Sangre de Cristo, brotada en la coronación de espinas,
_Sálvanos._

Sangre de Cristo, derramada en la cruz,
_Sálvanos._

Sangre de Cristo, prenda de nuestra salvación,
_Sálvanos._

Sangre de Cristo, sin la cual no hay perdón,
_Sálvanos._

Sangre de Cristo, bebida eucarística y refrigerio de las almas,
_Sálvanos._

Sangre de Cristo, manantial de misericordia,
_Sálvanos._

Sangre de Cristo, vencedora de los demonios,
_Sálvanos._

Sangre de Cristo, fortaleza de los mártires,
_Sálvanos._

Sangre de Cristo, fuerza de los confesores,
_Sálvanos._

Sangre de Cristo, que engendra vírgenes,
_Sálvanos._

Sangre de Cristo, socorro en el peligro,
_Sálvanos._

Sangre de Cristo, alivio de los afligidos,
_Sálvanos._

Sangre de Cristo, solaz en las penas,
_Sálvanos._

Sangre de Cristo, esperanza del penitente,
_Sálvanos._

Sangre de Cristo, consuelo del moribundo,
_Sálvanos_

Sangre de Cristo, paz y ternura para los corazones,
_Sálvanos._

Sangre de Cristo, promesa de vida eterna,
_Sálvanos._

Sangre de Cristo, que libras a las almas del purgatorio,
_Sálvanos._

Sangre de Cristo, dignísima de toda gloria y honor,
_Sálvanos._

Cordero de Dios, que quitas el pecado del mundo,
_Perdónanos, Señor._

Cordero de Dios, que quitas el pecado del mundo,
_Escúchanos, Señor._

Cordero de Dios, que quitas el pecado del mundo,
_Ten piedad de nosotros._

**℣.** ¡Oh Señor, nos has redimido en tu sangre!

**℟.** Y nos hiciste reino de nuestro Dios.

**Oremos:**
Omnipotente y Sempiterno Dios, que constituiste a tu Hijo Unigénito Redentor del mundo, y que
te es grato reconciliarte con nosotros a través de Su Sangre: te suplicamos nos concedas que
veneremos con solemne adoración el precio de nuestra Redención, que por su virtud seamos
preservados en la tierra de los males de la vida presente, para que gocemos en el Cielo de su
fruto eterno. Por el mismo Cristo Nuestro Señor.

**℟.** Amén.
"""
