title = "Acuérdate (Memorare)"
categories = ["basic"]

[[versions]]
name = "Version 1"
content = """
Acordaos, oh piadosísima Virgen María!,
que jamás se ha oído decir
que ninguno de los que han acudido a vuestra protección,
implorando tu auxilio,
haya sido desamparado.
Animado por esta confianza, a Vos acudo,
Madre, Virgen de la vírgenes,
y gimiendo bajo el peso de mis pecados
me atrevo a comparecer ante Vos.
Madre de Dios,
no desechéis mis súplicas,
antes bien, escuchadlas y acogedlas benignamente. Amén.
"""

[[versions]]
name = "Version 2"
content = """
Acuérdate, oh piadosísima Virgen María,
que jamás se ha oído decir
que ninguno de los que han acudido a tu protección,
implorado tu auxilio,
o buscado tu intercesión, haya sido desamparado.
Animado con esta confianza, a ti también acudo,
oh Virgen de las vírgenes, mi Madre;
a ti vengo,
ante ti me presento, pecador y contrito.
Oh Madre del Verbo Encarnado,
no desprecies mis súplicas,
antes bien, óyelas y acógelas benignamente. Amén.
"""
