title = "Credo de los Apóstoles"
categories = ["basic"]

[[versions]]
name = ""
content = """
Creo en Dios Padre, Todopoderoso, Creador del Cielo y de la tierra.
Y en Jesucristo su único Hijo, Nuestro Señor;  que fue concebido por
obra y gracia del Espíritu Santo; nació de Santa María Virgen; padeció
bajo el poder de Poncio Pilato; fué crucificado, muerto y sepultado;
descendió a los infiernos; al tercer día resucitó de entre los muertos;
subió a los cielos y está sentado a la diestra de Dios Padre Todopoderoso;
desde allí ha de venir a juzgar a los vivos y a los muertos.
Creo en el Esprítu Santo, en la Santa Iglesia Católica; la Comunión de los Santos;
el perdón de los pecados; la resurrección de la carne y la vida eterna.

Amén.
"""
