title = "Letanía del Inmaculado Corazón de María"
categories = ["litany"]

[[versions]]
name = ""
content = """
Señor, ten piedad.
Cristo, ten piedad.
Señor, ten piedad.

Cristo, óyenos.
Cristo, escúchanos benignamente.

Dios, Padre celestial,
_Ten misericordia de nosotros._

Dios, Hijo, Redentor del mundo,
_Ten misericordia de nosotros._

Dios, Espíritu Santo,
_Ten misericordia de nosotros._

Santísima Trinidad, un solo Dios,
_Ten misericordia de nosotros._

Corazón de María,
_Ruega por nosotros._

Corazón de María, conforme al Corazón de Jesús,
_Ruega por nosotros._

Corazón de María, unido al Corazón de Jesús,
_Ruega por nosotros._

Corazón de María, santuario del Espíritu Santo,
_Ruega por nosotros._

Corazón de María, templo de la Divinidad,
_Ruega por nosotros._

Corazón de María, tabernáculo del Verbo encarnado,
_Ruega por nosotros._

Corazón de María, siempre exento de pecado,
_Ruega por nosotros._

Corazón de María, siempre lleno de gracia,
_Ruega por nosotros._

Corazón de María, bendito entre todos los corazones,
_Ruega por nosotros._

Corazón de María, ilustre trono de gloria,
_Ruega por nosotros._

Corazón de María, abismo y prodigio de humildad,
_Ruega por nosotros._

Corazón de María, glorioso holocausto de amor divino,
_Ruega por nosotros._

Corazón de María, traspasado junto a la cruz de Jesús,
_Ruega por nosotros._

Corazón de María, consuelo de los afligidos,
_Ruega por nosotros._

Corazón de María, refugio de los pecadores,
_Ruega por nosotros._

Corazón de María, esperanza de los agonizantes,
_Ruega por nosotros._

Corazón de María, asiento de la misericordia,
_Ruega por nosotros._

Cordero de Dios, que quitas los pecados del mundo,
_Perdónanos, Señor._

Cordero de Dios, que quitas los pecados del mundo,
_Escúchanos, Señor._

Cordero de Dios, que quitas los pecados del mundo,
_Ten misericordia de nosotros._

℣. Ruega por nosotros, Santa Madre de Dios.

℟. Para que seamos dignos de alcanzar las promesas de Nuestro Señor Jesucristo.

**Oremos:**
Oh Jesús divino, que con amor tiernísimo amaste a la más santa de las vírgenes, y que por Ella eres correspondido con igual amor; concédenos, te rogamos, que por su piadosa intercesión y por la semejanza que su Corazón sagrado tuvo con el tuyo, seamos inflamados de verdadero amor hacia tan buena Madre. Tú, que vives y reinas con el Padre y el Espíritu Santo, Dios por los siglos de los siglos.

℟. Amén.
"""

