title = "Letanías de San José"
categories = ["litany"]

[[versions]]
name = ""
content = """
Señor, ten misericordia de nosotros.
Cristo, ten misericordia de nosotros.
Señor, ten misericordia de nosotros.

Cristo, óyenos.
Cristo, escúchanos.

Dios Padre celestial,
_ten misericordia de nosotros._

Dios Hijo, Redentor del mundo,
_ten misericordia de nosotros._

Dios Espíritu Santo,
_ten misericordia de nosotros._

Santa Trinidad, un solo Dios,
_ten misericordia de nosotros._

Santa María,
_ruega por nosotros._

San José,
_ruega por nosotros._

Ilustre descendiente de David,
_ruega por nosotros._

Luz de los Patriarcas,
_ruega por nosotros._

Esposo de la Madre de Dios,
_ruega por nosotros._

Casto guardián de la Virgen,
_ruega por nosotros._

Padre nutricio del Hijo de Dios,
_ruega por nosotros._

Celoso defensor de Cristo,
_ruega por nosotros._

Jefe de la Sagrada Familia,
_ruega por nosotros._

José, justísimo,
_ruega por nosotros._

José, castísimo,
_ruega por nosotros._

José, prudentísimo,
_ruega por nosotros._

José, valentísimo,
_ruega por nosotros._

José, fidelísimo,
_ruega por nosotros._

Espejo de paciencia,
_ruega por nosotros._

Amante de la pobreza,
_ruega por nosotros._

Modelo de trabajadores,
_ruega por nosotros._

Gloria de la vida doméstica,
_ruega por nosotros._

Custodio de Vírgenes,
_ruega por nosotros._

Sostén de las familias,
_ruega por nosotros._

Consuelo de los desgraciados,
_ruega por nosotros._

Esperanza de los enfermos,
_ruega por nosotros._

Patrón de los moribundos,
_ruega por nosotros._

Terror de los demonios,
_ruega por nosotros._

Protector de la Santa Iglesia,
_ruega por nosotros._

Cordero de Dios, que quitas los pecados del mundo,
_perdónanos, Señor._

Cordero de Dios, que quitas los pecados del mundo,
_escúchanos, Señor._

Cordero de Dios, que quitas los pecados del mundo,
_ten misericordia de nosotros._

**℣.** Le estableció señor de su casa.

**℟.** Y jefe de toda su hacienda.
 
**Oremos:**
Oh Dios, que en tu inefable providencia, te dignaste elegir a San José por Esposo de tu Santísima Madre: concédenos, te rogamos, que merezcamos tener por intercesor en el cielo al que veneramos como protector en la tierra. Tú que vives y reinas por los siglos de los siglos.

**℟.** Amén.
"""
