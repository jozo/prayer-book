title = "Oración para una Buena Vida (por Santo Tomás de Aquino)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Concédeme, oh Dios misericordioso,
que pueda desear ardientemente,
examinar con cuidado,
conocer verdaderamente
y cumplir perfectamente
aquello que Te es agradable
y que redunda en la alabanza
y gloria de Tu santo nombre.

Dirige mi vida, oh Dios mío,
y concédeme conocer
lo que quieres que haga
y que lo cumpla
como conviene y aprovecha
a la salvación de mi alma.

Concédeme, Señor Dios mío,
que no me halle falto en la prosperidad
ni en la adversidad,
y que ni una me ensoberbezca
ni la otra me abata.

Haz que no halle alegría
sino en lo que me conduce a Ti,
ni pena alguna
que no sea la que me aparta de Ti.

Haz que no busque agradar a nadie
ni tema desagradar a nadie,
sino solamente a Ti.

Concédeme, Señor Dios:
- un corazón vigilante, para que ninguna sutil seducción me aparte de Ti;
- un corazón noble, para que ningún afecto indigno me arrastre lejos de Ti;
- un corazón recto, para que ningún mal propósito me aparte de Ti;

Dame un corazón firme,
que ninguna tribulación pueda quebrantar,
y un corazón libre,
que ninguna pasión desordenada pueda reclamar como suyo.

Y finalmente, concédeme,
oh Señor Dios mío:
una mente para conocerte,
diligencia para buscarte,
sabiduría para encontrarte.

Dame una vida que Te sea agradable;
perseverancia para esperarte con confianza,
y la certeza de que al final podré abrazarte eternamente.

Amen.
"""
