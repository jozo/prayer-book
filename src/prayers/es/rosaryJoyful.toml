title = "Mysteries Gozosos"
categories = ["rosary"]

[[versions]]
name = ""
content = """
1. **La Anunciación.**
Fruto del Misterio: Humildad
2. **La Visitación.**
Fruto del Misterio: Amor al prójimo.
3. **El Nacimiento de Jesús.**
Fruto del Misterio: Pobreza, Desprendimiento de las cosas del mundo, Desprecio de las riquezas, Amor a los pobres.
4. **La Presentación de Jesús en el Templo.**
Fruto del Misterio: Don de Sabiduría y Pureza de mente y cuerpo (Obediencia).
5. **El Niño Jesús perdido y hallado en el Templo.**
Fruto del Misterio: Verdadera Conversión (Piedad, Alegría de Encontrar a Jesús).
"""
