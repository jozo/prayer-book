title = "Memorare a San José"
categories = ["saints"]

[[versions]]
name = ""
content = """
Recuerda, oh castísimo esposo de la Virgen María,
que jamás se ha oído decir
que ninguno que haya invocado tu protección
o implorado tu intercesión, no haya recibido consuelo.
Lleno pues, de toda confianza en tu poder,
acudo suplicante a tu presencia
y me encomiendo a tu protección.
No deseches mi humilde súplica,
custodio de nuestro Redentor,
antes bien acógela en tu paternal generosidad
y dígnate acceder a ella. Amén.
"""
