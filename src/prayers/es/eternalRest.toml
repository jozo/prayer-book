title = "Oración por el Descanso Eterno"
categories = ["basic"]

[[versions]]
name = ""
content = """
_(Para una persona)_

Concédele, Señor, el descanso eterno,
y que brille para él/ella tu luz perpetua.
Que su alma y las almas de todos los fieles difuntos
descansen en paz.

Amén.

_(Colectivo)_

Concédeles, Señor, el descanso eterno,
y brille para ellos tu luz perpetua.
Que sus almas y las de todos los fieles difuntos
descansen en paz.

Amén.
"""
