title = "Ladainha de São José"
categories = ["litany"]

[[versions]]
name = ""
content = """
Senhor, tende piedade de nós.
Jesus Cristo, tende piedade de nós.
Senhor, tende piedade de nós.

Jesus Cristo, ouvi-nos.
Jesus Cristo, atendei-nos.

Deus Pai dos céus,
_tende piedade de nós._

Deus Filho Redentor do mundo,
_tende piedade de nós._

Deus Espírito Santo,
_tende piedade de nós._

Santíssima Trindade, que sois um só Deus,
_tende piedade de nós._

Santa Maria,
_rogai por nós._

São José,
_rogai por nós._

Ilustre filho de Davi,
_rogai por nós._

Luz dos Patriarcas,
_rogai por nós._

Esposo da Mãe de Deus,
_rogai por nós._

Casto guarda da Virgem,
_rogai por nós._

Sustentador do Filho de Deus,
_rogai por nós._

Zeloso defensor de Jesus Cristo,
_rogai por nós._

Chefe da Sagrada Família,
_rogai por nós._

José justíssimo,
_rogai por nós._

José castíssimo,
_rogai por nós._

José prudentíssimo,
_rogai por nós._

José fortíssimo,
_rogai por nós._

José obedientíssimo,
_rogai por nós._

José fidelíssimo,
_rogai por nós._

Espelho de paciência,
_rogai por nós._

Amante da pobreza,
_rogai por nós._

Modelo dos trabalhadores,
_rogai por nós._

Honra da vida de família,
_rogai por nós._

Guarda das virgens,
_rogai por nós._

Sustentáculo das famílias,
_rogai por nós._

Alívio dos miseráveis,
_rogai por nós._

Esperança dos doentes,
_rogai por nós._

Patrono dos moribundos,
_rogai por nós._

Terror dos demônios,
_rogai por nós._

Protetor da Santa Igreja,
_rogai por nós._

Cordeiro de Deus, que tirais os pecados do mundo,
_perdoai-nos, Senhor._

Cordeiro de Deus, que tirais os pecados do mundo,
_ouvi-nos, Senhor._

Cordeiro de Deus, que tirais os pecados do mundo,
_tende piedade de nós._

**℣.** Ele constituiu-o senhor de sua casa.

**℟.** E fê-lo príncipe de todos os seus bens.

**Oremos:**
Ó Deus, que por inefável providência vos dignastes escolher a São José por esposo de vossa Mãe Santíssima; concedei-nos, vo-lo pedimos, que mereçamos ter por intercessor no céu, aquele que veneramos na terra como protetor. Vós que viveis e reinais por todos os séculos dos séculos.

**℟.** Amém.
"""
