title = "Ladainha do Santíssimo Nome de Jesus"
categories = ["litany"]

[[versions]]
name = ""
content = """
Senhor, tende piedade de nós.
Jesus Cristo, tende piedade de nós.
Senhor, tende piedade de nós.

Jesus Cristo, ouvi-nos.
Jesus Cristo, atendei-nos.

Deus Pai dos céus,
_tende piedade de nós._

Deus Filho Redentor do mundo,
_tende piedade de nós._

Deus Espírito Santo,
_tende piedade de nós._

Santíssima Trindade, que sois um só Deus,
_tende piedade de nós._

Jesus, Filho de Deus vivo,
_tende piedade de nós._

Jesus, esplendor do Pai,
_tende piedade de nós._

Jesus, pureza da luz eterna,
_tende piedade de nós._

Jesus, Rei da glória,
_tende piedade de nós._

Jesus, sol da justiça,
_tende piedade de nós._

Jesus, Filho da Virgem Maria,
_tende piedade de nós._

Jesus amável,
_tende piedade de nós._

Jesus admirável,
_tende piedade de nós._

Jesus, Deus forte,
_tende piedade de nós._

Jesus, pai do futuro do século,
_tende piedade de nós._

Jesus, anjo do grande conselho,
_tende piedade de nós._

Jesus poderosíssimo,
_tende piedade de nós._

Jesus pacientíssimo,
_tende piedade de nós._

Jesus obedientíssimo,
_tende piedade de nós._

Jesus, manso e humilde de coração,
_tende piedade de nós._

Jesus, amante da castidade,
_tende piedade de nós._

Jesus, amador nosso,
_tende piedade de nós._

Jesus, Deus da paz,
_tende piedade de nós._

Jesus, autor da vida,
_tende piedade de nós._

Jesus, exemplar das virtudes,
_tende piedade de nós._

Jesus, zelador das almas,
_tende piedade de nós._

Jesus, nosso Deus,
_tende piedade de nós._

Jesus, nosso refúgio,
_tende piedade de nós._

Jesus, pai dos pobres,
_tende piedade de nós._

Jesus, tesouro dos fiéis,
_tende piedade de nós._

Jesus, bom pastor,
_tende piedade de nós._

Jesus, luz verdadeira,
_tende piedade de nós._

Jesus, sabedoria eterna,
_tende piedade de nós._

Jesus, bondade infinita,
_tende piedade de nós._

Jesus, nosso caminho e nossa vida,
_tende piedade de nós._

Jesus, alegria dos anjos,
_tende piedade de nós._

Jesus, rei dos patriarcas,
_tende piedade de nós._

Jesus, mestre dos Apóstolos,
_tende piedade de nós._

Jesus, doutor dos evangelistas,
_tende piedade de nós._

Jesus, fortaleza dos mártires,
_tende piedade de nós._

Jesus, luz dos confessores,
_tende piedade de nós._

Jesus, pureza das virgens,
_tende piedade de nós._

Jesus, coroa de todos os santos,
_tende piedade de nós._

Sede-nos propício,
_perdoai-nos, Jesus._

Sede-nos propício,
_ouvi-nos, Jesus._

De todo o mal,
_livrai-nos, Jesus._

De todo o pecado,
_livrai-nos, Jesus._

De vossa ira,
_livrai-nos, Jesus._

Das ciladas do demônio,
_livrai-nos, Jesus._

Do espírito de impureza,
_livrai-nos, Jesus._

Da morte eterna,
_livrai-nos, Jesus._

Do desprezo das vossas inspirações,
_livrai-nos, Jesus._

Pelo mistério da vossa santa Encarnação,
_livrai-nos, Jesus._

Pela vossa natividade,
_livrai-nos, Jesus._

Pela vossa infância,
_livrai-nos, Jesus._

Pela vossa santíssima vida,
_livrai-nos, Jesus._

Pelos vossos trabalhos,
_livrai-nos, Jesus._

Pela vossa agonia e paixão,
_livrai-nos, Jesus._

Pela vossa cruz e desamparo,
_livrai-nos, Jesus._

Pelas vossas angústias,
_livrai-nos, Jesus._

Pela vossa morte e sepultura,
_livrai-nos, Jesus._

Pela vossa ressurreição,
_livrai-nos, Jesus._

Pela vossa ascensão,
_livrai-nos, Jesus._

Pela vossa instituição da Santíssima Eucaristia,
_livrai-nos, Jesus._

Pelas vossas alegrias,
_livrai-nos, Jesus._

Pela vossa glória,
_livrai-nos, Jesus._

Cordeiro de Deus, que tirais os pecados do mundo,
_perdoai-nos, Senhor._

Cordeiro de Deus, que tirais os pecados do mundo,
_ouvi-nos, Senhor._

Cordeiro de Deus, que tirais os pecados do mundo,
_tende piedade de nós._

**℣.** Jesus, ouvi-nos.

**℟.** Jesus, atendei-nos.

**Oremos:**
Senhor Jesus Cristo, que dissestes: “Pedi e recebereis, buscai e achareis, batei e abrir-se-vos-á”, nós vos suplicamos que concedais a nós, que vos pedimos, os sentimentos afetivos de vosso divino amor, a fim de que vos amemos de todo o coração e que esse amor transcenda por nossas ações. Permiti que tenhamos sempre, Senhor, um igual temor e amor pelo vosso santo nome, pois não deixais de governar aqueles que estabeleceis na firmeza do vosso amor. Vós que viveis e renais pelos séculos dos séculos.

**℟.** Amém.
"""
