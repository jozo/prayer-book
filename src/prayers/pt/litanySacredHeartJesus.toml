title = "Ladainha do Sagrado Coração de Jesus"
categories = ["litany"]

[[versions]]
name = ""
content = """
Senhor, tende piedade de nós.
Jesus Cristo, tende piedade de nós.
Senhor, tende piedade de nós.

Jesus Cristo, ouvi-nos.
Jesus Cristo, atendei-nos.

Deus Pai dos céus,
_tende piedade de nós._

Deus Filho Redentor do mundo,
_tende piedade de nós._

Deus Espírito Santo,
_tende piedade de nós._

Santíssima Trindade, que sois um só Deus,
_tende piedade de nós._

Coração de Jesus, Filho do Pai eterno,
_tende piedade de nós._

Coração de Jesus, formado pelo Espírito Santo no seio da Virgem Mãe,
_tende piedade de nós._

Coração de Jesus, unido substancialmente ao Verbo de Deus,
_tende piedade de nós._

Coração de Jesus, de majestade infinita,
_tende piedade de nós._

Coração de Jesus, templo santo de Deus,
_tende piedade de nós._

Coração de Jesus, tabernáculo do Altíssimo,
_tende piedade de nós._

Coração de Jesus, casa de Deus e porta do Céu,
_tende piedade de nós._

Coração de Jesus, fornalha ardente de caridade,
_tende piedade de nós._

Coração de Jesus, receptáculo de justiça e de amor,
_tende piedade de nós._

Coração de Jesus, cheio de bondade e de amor,
_tende piedade de nós._

Coração de Jesus, abismo de todas as virtudes,
_tende piedade de nós._

Coração de Jesus, digníssimo de todo o louvor,
_tende piedade de nós._

Coração de Jesus, Rei e centro de todos os corações,
_tende piedade de nós._

Coração de Jesus, no qual estão todos os tesouros da sabedoria e ciência,
_tende piedade de nós._

Coração de Jesus, no qual habita toda a plenitude da divindade,
_tende piedade de nós._

Coração de Jesus, no qual o Pai põe todas as suas complacências,
_tende piedade de nós._

Coração de Jesus, de cuja plenitude todos nós participamos,
_tende piedade de nós._

Coração de Jesus, desejado das colinas eternas,
_tende piedade de nós._

Coração de Jesus, paciente e de muita misericórdia,
_tende piedade de nós._

Coração de Jesus, rico para todos que vos invocam,
_tende piedade de nós._

Coração de Jesus, fonte de vida e santidade,
_tende piedade de nós._

Coração de Jesus, propiciação por nossos pecados,
_tende piedade de nós._

Coração de Jesus, saturado de opróbrios,
_tende piedade de nós._

Coração de Jesus, esmagado de dor por causa dos nossos pecados,
_tende piedade de nós._

Coração de Jesus, feito obediente até a morte,
_tende piedade de nós._

Coração de Jesus, transpassado pela lança,
_tende piedade de nós._

Coração de Jesus, fonte de toda consolação,
_tende piedade de nós._

Coração de Jesus, nossa vida e ressurreição,
_tende piedade de nós._

Coração de Jesus, nossa paz e reconciliação,
_tende piedade de nós._

Coração de Jesus, vítima dos pecadores,
_tende piedade de nós._

Coração de Jesus, salvação dos que em vós esperam,
_tende piedade de nós._

Coração de Jesus, esperança dos que morrem em vós,
_tende piedade de nós._

Coração de Jesus, delícias de todos os santos,
_tende piedade de nós._

Cordeiro de Deus, que tirais os pecados do mundo,
_perdoai-nos, Senhor._

Cordeiro de Deus, que tirais os pecados do mundo,
_ouvi-nos, Senhor._

Cordeiro de Deus, que tirais os pecados do mundo,
_tende piedade de nós._

**℣.** Jesus, manso e humilde de coração,

**℟.** Fazei o nosso coração semelhante ao vosso.

**Oremos:**
Deus eterno e todo-poderoso, olhai para o Coração do vosso diletíssimo Filho e para os louvores e satisfações que Ele, em nome dos pecadores, vos tem tributado; e, deixando-vos aplacar, perdoai aos que imploram a vossa misericórdia, em nome de vosso mesmo Filho, Jesus Cristo, que convosco vive e reina na unidade do Espírito Santo.

**℟.** Amém.
"""
