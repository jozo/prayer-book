title = "Ladainha a Nossa Senhora"
categories = ["litany"]

[[versions]]
name = ""
content = """
Senhor, tende piedade de nós.
Jesus Cristo, tende piedade de nós.
Senhor, tende piedade de nós.

Jesus Cristo, ouvi-nos.
Jesus Cristo, atendei-nos.

Deus Pai dos céus,
_Tende piedade de nós._

Deus Filho Redentor do mundo,
_Tende piedade de nós._

Deus Espírito Santo,
_Tende piedade de nós._

Santíssima Trindade, que sois um só Deus,
_Tende piedade de nós._

Santa Maria,
_Rogai por nós._

Santa Mãe de Deus,
_Rogai por nós._

Santa Virgem das virgens,
_Rogai por nós._

Mãe de Jesus Cristo,
_Rogai por nós._

Mãe da Igreja,
_Rogai por nós._

Mãe da divina graça,
_Rogai por nós._

Mãe puríssima,
_Rogai por nós._

Mãe castíssima,
_Rogai por nós._

Mãe imaculada,
_Rogai por nós._

Mãe intacta,
_Rogai por nós._

Mãe amável,
_Rogai por nós._

Mãe admirável,
_Rogai por nós._

Mãe do bom conselho,
_Rogai por nós._

Mãe do Criador,
_Rogai por nós._

Mãe do Salvador,
_Rogai por nós._

Virgem prudentíssima,
_Rogai por nós._

Virgem veneranda,
_Rogai por nós._

Virgem digna de louvor,
_Rogai por nós._

Virgem poderosa,
_Rogai por nós._

Virgem clemente,
_Rogai por nós._

Virgem fiel,
_Rogai por nós._

Espelho da justiça,
_Rogai por nós._

Sede da Sabedoria,
_Rogai por nós._

Causa da nossa alegria,
_Rogai por nós._

Vaso espiritual,
_Rogai por nós._

Vaso honorável,
_Rogai por nós._

Vaso insigne de devoção,
_Rogai por nós._

Rosa mística,
_Rogai por nós._

Torre de Davi,
_Rogai por nós._

Torre de marfim,
_Rogai por nós._

Casa de ouro,
_Rogai por nós._

Arca da aliança,
_Rogai por nós._

Porta do céu,
_Rogai por nós._

Estrela da manhã,
_Rogai por nós._

Saúde dos enfermos,
_Rogai por nós._

Refúgio dos pecadores,
_Rogai por nós._

Consoladora dos aflitos,
_Rogai por nós._

Auxílio dos cristãos,
_Rogai por nós._

Rainha dos Anjos,
_Rogai por nós._

Rainha dos Patriarcas,
_Rogai por nós._

Rainha dos Profetas,
_Rogai por nós._

Rainha dos Apóstolos,
_Rogai por nós._

Rainha dos Mártires,
_Rogai por nós._

Rainha dos Confessores,
_Rogai por nós._

Rainha das Virgens,
_Rogai por nós._

Rainha de todos os Santos,
_Rogai por nós._

Rainha concebida sem pecado original,
_Rogai por nós._

Rainha assunta aos céus,
_Rogai por nós._

Rainha do Santíssimo Rosário,
_Rogai por nós._

Rainha da Família,
_Rogai por nós._

Rainha da Paz,
_Rogai por nós._

Cordeiro de Deus, que tirais os pecados do mundo,
_Perdoai-nos, Senhor._

Cordeiro de Deus, que tirais os pecados do mundo,
_Ouvi-nos, Senhor._

Cordeiro de Deus, que tirais os pecados do mundo,
_Tende piedade de nós._

À vossa proteção nós recorremos, Santa Mãe de Deus;
não desprezeis as súplicas que em nossas necessidades vos dirigimos,
mas livrai-nos sempre de todos os perigos, ó Virgem gloriosa e
bendita.

**℣.** Rogai por nós, Santa Mãe de Deus.

**℟.** Para que sejamos dignos das promessas de Cristo.

**Oremos:**
Infundi, Senhor, nós vos pedimos, em nossas almas
a vossa graça, para que nós, que conhecemos pela Anunciação
do Anjo a Encarnação de Jesus Cristo, vosso Filho, cheguemos
por sua Paixão e sua Cruz à glória da ressurreição. Pelo mesmo
Jesus Cristo, Senhor Nosso.

**℟.** Amém.
"""
