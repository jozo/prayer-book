title = "Litanies de St. Joseph"
categories = ["litany"]

[[versions]]
name = ""
content = """
Seigneur, ayez pitié de nous.
Ô Christ, ayez pitié de nous.
Seigneur, ayez pitié de nous.

Jésus-Christ, écoutez-nous.
Jésus-Christ, exaucez-nous.

Père céleste qui êtes Dieu,
_ayez pitié de nous._

Fils, rédempteur du monde, qui êtes Dieu,
_ayez pitié de nous._

Esprit-Saint, qui êtes Dieu,
_ayez pitié de nous._

Trinité Sainte, qui êtes un seul Dieu,
_ayez pitié de nous._

Sainte Marie,
_priez pour nous._

Saint Joseph,
_priez pour nous._

Illustre descendant de David,
_priez pour nous._

Lumière des patriarches,
_priez pour nous._

Époux de la mère de Dieu,
_priez pour nous._

Chaste gardien de la Vierge,
_priez pour nous._

Nourricier du fils de Dieu,
_priez pour nous._

Zélé défenseur de Jésus,
_priez pour nous._

Chef de la sainte famille,
_priez pour nous._

Joseph très juste,
_priez pour nous._

Joseph très chaste,
_priez pour nous._

Joseph très prudent,
_priez pour nous._

Joseph très courageux,
_priez pour nous._

Joseph très obéissant,
_priez pour nous._

Joseph très fidèle,
_priez pour nous._

Miroir de patience,
_priez pour nous._

Ami de la pauvreté,
_priez pour nous._

Modèle des travailleurs,
_priez pour nous._

Gloire de la vie de famille,
_priez pour nous._

Gardien des vierges,
_priez pour nous._

Soutien des familles,
_priez pour nous._

Consolation des malheureux,
_priez pour nous._

Espérance des malades,
_priez pour nous._

Patron des mourants,
_priez pour nous._

Terreur des démons,
_priez pour nous._

Protecteur de la sainte Eglise,
_priez pour nous._

Agneau de Dieu qui effacez les péchés du monde,
_pardonnez-nous, Seigneur._

Agneau de Dieu qui effacez les péchés du monde,
_exaucez-nous, Seigneur._

Agneau de Dieu qui effacez les péchés du monde,
_ayez pitié de nous._

**℣.** Il l'a établi le chef de sa maison.

**℟.** Et l'intendant de tous ses biens.

**Prions:**
Ô Dieu, qui, par une providence ineffable, avez daigné choisir le bienheureux Joseph,
pour être l'époux de votre sainte mère, faites, nous vous en prions, que,
l'honorant ici-bas comme protecteur, nous méritions de l'avoir pour intercesseur dans le ciel :
vous qui vivez et régnez dans les siècles des siècles.

**℟.** Amen.
"""
