title = "Regina Caeli (Reine du Ciel)"
categories = ["basic"]

[[versions]]
name = ""
content = """
**℣.** Reine du ciel, réjouis-toi, alleluia.

**℟.** Car celui qu'il te fut donné de porter, alleluia.

**℣.** Est ressuscité comme il l'avait dit, alleluia.

**℟.** Prie Dieu pour nous, alleluia.

**℣.** Sois heureuse et réjouis-toi, alleluia.

**℟.** Car le Seigneur est vraiment ressuscité, alleluia.


Prions.


Dieu qui as donné la joie au monde en ressuscitant Jésus, ton Fils,
accorde-nous, par sa Mère, la Vierge Marie, de parvenir au bonheur de la vie éternelle.
Par Jésus, le Christ, notre Seigneur.

Amen.
"""
