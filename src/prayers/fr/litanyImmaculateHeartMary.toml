title = "Litanies du Saint Coeur de Marie"
categories = ["litany"]

[[versions]]
name = ""
content = """
Seigneur, ayez pitié de nous.
Ô Christ, ayez pitié de nous.
Seigneur, ayez pitié de nous.

Jésus-Christ, écoutez-nous.
Jésus-Christ, exaucez-nous.

Père céleste qui êtes Dieu,
_ayez pitié de nous._

Fils, rédempteur du monde, qui êtes Dieu,
_ayez pitié de nous._

Esprit-Saint, qui êtes Dieu,
_ayez pitié de nous._

Trinité Sainte, qui êtes un seul Dieu,
_ayez pitié de nous._

Coeur de Marie conçue sans péché,
_priez pour nous._

Coeur de Marie, objet des complaisances du coeur de Dieu,
_priez pour nous._

Coeur de Marie, uni au Coeur de Jésus,
_priez pour nous._

Coeur de Marie, organe du Saint-Esprit,
_priez pour nous._

Coeur de Marie, sanctuaire de l'adorable Trinité,
_priez pour nous._

Coeur de Marie, tabernacle du Verbe incarné,
_priez pour nous._

Coeur de Marie, immaculé dès le commencement,
_priez pour nous._

Coeur de Marie, rempli de grâce,
_priez pour nous._

Coeur de Marie, béni entre tous les coeurs,
_priez pour nous._

Coeur de Marie, trône de gloire,
_priez pour nous._

Coeur de Marie, abîme d'humilité,
_priez pour nous._

Coeur de Marie, holocauste du divin amour,
_priez pour nous._

Coeur de Marie, fixé à la croix avec Jésus crucifié,
_priez pour nous._

Coeur de Marie, consolation des affligés,
_priez pour nous._

Coeur de Marie, refuge des pécheurs,
_priez pour nous._

Coeur de Marie, espérance des agonisants,
_priez pour nous._

Coeur de Marie, siège de la miséricorde,
_priez pour nous._

Agneau de Dieu qui effacez les péchés du monde,
_pardonnez-nous, Seigneur._

Agneau de Dieu qui effacez les péchés du monde,
_exaucez-nous, Seigneur._

Agneau de Dieu qui effacez les péchés du monde,
_ayez pitié de nous._

**℣.** Marie immaculée, douce et humble de coeur,

**℟.** Rendez mon coeur semblable au Coeur de Jésus !

**Prions:**
Dieu très clément, qui, pour donner le salut aux pécheurs et un refuge aux miséreux, avez voulu que le Coeur immaculé de la Bienheureuse Vierge Marie soit semblable par la charité et la miséricorde au divin Coeur de Jésus-Christ votre Fils, accordez à ceux qui honorent ce Coeur très doux et très aimant de parvenir, par l'intercession et les mérites de cette Bienheureuse Vierge, à une parfaite conformité avec le Coeur de Jésus, Lui qui vit et règne avec Vous dans l'unité du Saint-Esprit, Dieu, pour les siècles des siècles.

**℟.** Amen.
"""
