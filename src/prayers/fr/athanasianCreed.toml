title = "Symbole (ou Credo) d'Athanase"
categories = ["basic"]

[[versions]]
name = ""
content = """
Quiconque veut être sauvé doit, avant tout, tenir la foi catholique : 
s'il ne la garde pas entière et pure, il périra sans aucun doute pour l'éternité.

Voici la foi catholique : nous vénérons un Dieu dans la Trinité et la Trinité dans l'Unité, 
sans confondre les Personnes ni diviser la substance : autre est en effet la Personne du Père, 
autre celle du Fils, autre celle du Saint-Esprit ; mais une est la divinité du Père,
du Fils et du Saint-Esprit, égale la gloire, coéternelle la majesté.

Comme est le Père, tel est le Fils, tel est aussi le Saint-Esprit :
incréé est le Père, incréé le Fils, incréé le Saint-Esprit ; infini est le Père,
infini le Fils, infini le Saint-Esprit ; éternel est le Père, éternel le Fils,
éternel le Saint-Esprit ; et cependant, ils ne sont pas trois éternels,
mais un éternel ; tout comme ils ne sont pas trois incréés, ni trois infinis,
mais un incréé et un infini. De même, tout-puissant est le Père, tout-puissant le Fils,
tout-puissant le Saint-Esprit ; et cependant ils ne sont pas trois tout-puissants,
mais un tout-puissant. Ainsi le Père est Dieu, le Fils est Dieu,
le Saint-Esprit est Dieu ; et cependant ils ne sont pas trois Dieux, mais un Dieu.
Ainsi le Père est Seigneur, le Fils est Seigneur, le Saint-Esprit est Seigneur ;
et cependant ils ne sont pas trois Seigneurs, mais un Seigneur ; car,
de même que la vérité chrétienne nous oblige à confesser que chacune des
personnes en particulier est Dieu et Seigneur, de même la religion catholique
nous interdit de dire qu'il y a trois Dieux ou trois Seigneurs.

Le Père n'a été fait par personne et il n'est ni créé ni engendré ;
le Fils n'est issu que du Père, il n'est ni fait, ni créé, mais engendré ;
le Saint-Esprit vient du Père et du Fils, il n'est ni fait, ni créé, ni engendré,
mais il procède. Il n'y a donc qu'un Père, non pas trois Pères ; un Fils,
non pas trois Fils ; un Saint-Esprit, non pas trois Saint-Esprit.
Et dans cette Trinité il n'est rien qui soit avant ou après, rien qui soit plus grand ou plus petit,
mais les Personnes sont toutes trois également éternelles et semblablement égales.
Si bien qu'en tout, comme on l'a déjà dit plus haut, on doit vénérer,
et l'Unité dans la Trinité, et la Trinité dans l'Unité.
Qui donc veut être sauvé, qu'il croie cela de la Trinité.

Mais il est nécessaire au salut éternel de croire fidèlement aussi en l'incarnation de
notre Seigneur Jésus-Christ. C'est donc la foi droite que de croire et de confesser que
notre Seigneur Jésus-Christ, Fils de Dieu, est Dieu et homme.

Il est Dieu, de la substance du Père, engendré avant les siècles, et il est homme,
né de la substance de sa mère, dans le temps ; Dieu parfait,
homme parfait composé d'une âme raisonnable et de chair humaine, égal au Père selon la divinité,
inférieur au Père selon l'humanité.

Bien qu'il soit Dieu et homme, il n'y a pas cependant deux Christ, mais un Christ ;
un, non parce que la divinité a été transformée en la chair,
mais parce que l'humanité a été assumée en Dieu ; un absolument, non par un mélange de substance,
mais par l'unité de la personne. Car, de même que l'âme raisonnable et le corps font un homme,
de même Dieu et l'homme font un Christ. Il a souffert pour notre salut, il est descendu aux enfers,
le troisième jour il est ressuscité des morts, il est monté aux cieux, il siège à la droite du Père,
d'où il viendra juger les vivants et les morts. À sa venue, tous les hommes
ressusciteront avec leurs corps et rendront compte de leurs propres actes :
ceux qui ont bien agi iront dans la vie éternelle, ceux qui ont mal agi, au feu éternel.

Telle est la foi catholique : si quelqu'un n'y croit pas fidèlement et fermement, il ne pourra être sauvé.
"""
