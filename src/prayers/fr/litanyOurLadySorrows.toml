title = "Litanies de Notre-Dame des Douleurs"
categories = ["litany"]

[[versions]]
name = ""
content = """
Seigneur, ayez pitié de nous.
Ô Christ, ayez pitié de nous.
Seigneur, ayez pitié de nous.

Jésus-Christ, écoutez-nous.
Jésus-Christ, exaucez-nous.

Père céleste qui êtes Dieu,
_ayez pitié de nous._

Fils, rédempteur du monde, qui êtes Dieu,
_ayez pitié de nous._

Esprit-Saint, qui êtes Dieu,
_ayez pitié de nous._

Trinité Sainte, qui êtes un seul Dieu,
_ayez pitié de nous._

Sainte Vierge Marie, Mère de Dieu,
_priez pour nous._

Sainte Vierge Marie, Mère des douleurs,
_priez pour nous._

Mère de douleurs, souffrant des rebuts des habitants de Bethléem,
_priez pour nous._

Mère de douleurs, attristée par les larmes de Jésus dans la crèche,
_priez pour nous._

Mère de douleurs, pleurant avec lui au jour de la circoncision,
_priez pour nous._

Mère de douleurs, présentant au Seigneur l'Agneau divin qui efface les péchés du monde,
_priez pour nous._

Mère de douleurs, dont l'âme fut percée d'un glaive à la prophétie de Siméon,
_priez pour nous._

Mère de douleurs, affligée de cruelles angoisses pendant la fuite en Egypte,
_priez pour nous._

Mère de douleurs, mortellement désolée par la perte de l'Enfant-Jésus,
_priez pour nous._

Mère de douleurs, qui l'avez cherché trois jours en versant des larmes amères,
_priez pour nous._

Mère de douleurs, dont le cœur fut à l'agonie avec Celui de Jésus,
_priez pour nous._

Mère de douleurs, qui avez été à la rencontre de Jésus portant sa croix et l'avez suivi courageusement au calvaire,
_priez pour nous._

Mère de douleurs, qui par votre compassion l'avez dédommagé de nos ingratitudes,
_priez pour nous._

Mère de douleurs, dont le cœur fut broyé quand vous entendîtes les bourreaux le clouer à la croix,
_priez pour nous._

Mère de douleurs, debout près de la croix, écoutant les paroles de Jésus mourant,
_priez pour nous._

Mère de douleurs, qui nous avez reçus pour enfants sur le Calvaire,
_priez pour nous._

Mère de douleurs, dont l'affliction fut grande comme la mer, en voyant expirer le Dieu sauveur,
_priez pour nous._

Mère de douleurs, qui avez reçu, toute en larmes, le corps inanimé de Jésus,
_priez pour nous._

Mère de douleurs, mourant d'amour pour Dieu et récompensée de vos souffrances en votre glorieuse Assomption,
_priez pour nous._

Mère de douleurs, consolatrice des affligés,
_priez pour nous._

Mère de douleurs, espérance des désespérés,
_priez pour nous._

Mère de douleurs, Mère des miséricordes,
_priez pour nous._

Mère de douleurs, refuge assuré des pécheurs,
_priez pour nous._

Mère de douleurs, modèle de patience et de résignation,
_priez pour nous._

Mère de douleurs, tendre Mère des orphelins,
_priez pour nous._

Mère de douleurs, consolatrice des mourants,
_priez pour nous._

Mère de douleurs, secours de tous les malheureux,
_priez pour nous._

Mère de douleurs, Notre-Dame de Pitié, que l'on n'invoque jamais en vain,
_priez pour nous._

O Marie, vous êtes notre Mère et nous sommes vos enfants,
_Bonne Mère, intercédez pour nous._

Pour que nous évitions le péché, cause de vos douleurs et de la Passion de Jésus,
_Bonne Mère, intercédez pour nous._

Pour que nous obtenions avant la mort la grâce de la contrition parfaite,
_Bonne Mère, intercédez pour nous._

Pour que dans les deuils et les épreuves nous unissions toujours nos larmes aux vôtres,
_Bonne Mère, intercédez pour nous._

Pour que les plaies de Jésus et vos douleurs soient imprimées dans nos cœurs,
_Bonne Mère, intercédez pour nous._

Pour que, après avoir pleuré avec vous ici-bas, nous allions nous réjouir au Ciel auprès de vous,
_Bonne Mère, intercédez pour nous._

Pour que, dans toutes ses tribulations, la sainte Église soit secourue par votre maternelle assistance,
_Bonne Mère, intercédez pour nous._

Agneau de Dieu qui effacez les péchés du monde,
_pardonnez-nous, Seigneur._

Agneau de Dieu qui effacez les péchés du monde,
_exaucez-nous, Seigneur._

Agneau de Dieu qui effacez les péchés du monde,
_ayez pitié de nous._

**℣.** O vous qui passez par le chemin,

**℟.** Regardez et voyez s'il est une douleur semblable à ma douleur.

**Prions:**
O Dieu qui avez permis que, dans votre Passion, selon la prophétie de Siméon, un glaive
de douleur transperçât le très doux Cœur de la glorieuse Vierge Marie, votre Mère, accordez-
nous de ressentir en honorant ses douleurs les heureux effets de votre Passion, par les mérites et
les prières des saints qui sont restés fidèles près de la Croix avec Elle. Nous vous en prions, ô
vous qui vivez et régnez avec le Père et le Saint-Esprit dans les siècles des siècles.

**℟.** Amen.
"""
