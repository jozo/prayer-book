title = "Litanies de l'Esprit Saint"
categories = ["litany"]

[[versions]]
name = ""
content = """
Seigneur, ayez pitié de nous.
Jésus-Christ, ayez pitié de nous.
Seigneur, ayez pitié de nous.

Jésus-Christ, écoutez-nous.
Jésus-Christ, exaucez-nous.

Père céleste qui êtes Dieu,
_ayez pitié de nous._

Fils, rédempteur du monde, qui êtes Dieu,
_ayez pitié de nous._

Esprit-Saint, qui êtes Dieu,
_ayez pitié de nous._

Trinité Sainte, qui êtes un seul Dieu,
_ayez pitié de nous._

Esprit-Saint, qui procédez du Père et du Fils,
_ayez pitié de nous._

Esprit du Seigneur, qui remplissez tout l'univers,
_ayez pitié de nous._

Esprit-Saint, de qui Jésus a été conçu dans le sein de la Vierge Marie,
_ayez pitié de nous._

Esprit de sagesse et d'intelligence,
_ayez pitié de nous._

Esprit de conseil et de force,
_ayez pitié de nous._

Esprit de science et de piété,
_ayez pitié de nous._

Esprit de crainte du Seigneur,
_ayez pitié de nous._

Esprit de foi, d'espérance et d'amour,
_ayez pitié de nous._

Esprit d'humilité et de mansuétude,
_ayez pitié de nous._

Esprit de justice et de chasteté,
_ayez pitié de nous._

Esprit de vérité qui êtes envoyé pour nous consoler,
_ayez pitié de nous._

Esprit-Saint, qui répandez la charité dans nos cœurs,
_ayez pitié de nous._

Esprit-Saint, dont les apôtres ont été remplis,
_ayez pitié de nous._

Esprit de toute grâce, qui distribuez vos dons selon votre bon plaisir,
_ayez pitié de nous._

Soyez-nous propice, pardonnez-nous, Seigneur.
Soyez-nous propice, exaucez-nous Seigneur.

De tout péché,
_délivrez-nous, Seigneur._

Des tentations et des embûches du démon,
_délivrez-nous, Seigneur._

De la présomption et du désespoir,
_délivrez-nous, Seigneur._

De la résistance à vos inspirations,
_délivrez-nous, Seigneur._

De l'obstination et de l'impénitence,
_délivrez-nous, Seigneur._

De toute souillure de corps, de cœur et d'esprit,
_délivrez-nous, Seigneur._

De l'esprit d'erreur et de blasphème et de tout esprit mauvais,
_délivrez-nous, Seigneur._

Pauvres pécheurs, nous vous en prions, écoutez-nous. 

Afin que vos inspirations se manifestent dans nos œuvres,
_nous vous en prions, écoutez-nous._

Afin que nous ne profanions jamais notre âme dont vous avez fait votre temple,
_nous vous en prions, écoutez-nous._

Afin de ne pas vous contrister, vous qui êtes l'Esprit-Saint de Dieu,
_nous vous en prions, écoutez-nous._

Afin que, prenant goût aux choses de Dieu, nous devenions avides des dons supérieurs de votre grâce,
_nous vous en prions, écoutez-nous._

Afin que tous, animés d'un même Esprit, nous soyons unis dans la paix,
_nous vous en prions, écoutez-nous._

Afin que vous conserviez dans leur sainte vocation tous les Ordres du Clergé et toutes les Familles religieuses,
_nous vous en prions, écoutez-nous._

Afin que vous défendiez et reculiez les frontières de l'Église,
_nous vous en prions, écoutez-nous._

Par le cœur Immaculé de Marie, votre sanctuaire de prédilection,
_nous vous en prions, écoutez-nous. _

Agneau de Dieu qui effacez les péchés du monde,
_répandez en nous le Saint-Esprit._

Agneau de Dieu qui effacez les péchés du monde,
_envoyez-nous le Saint-Esprit._

Agneau de Dieu qui effacez les péchés du monde,
_donnez-nous le Saint-Esprit._

**℣.** Envoyez votre Esprit et tout sera créé.

**℟.** Et vous renouvellerez la face de la terre.

**Prions:**
Ô Dieu qui avez préparé des biens invisibles à ceux qui vous aiment,
répandez dans nos cœurs en nous donnant votre Saint-Esprit, la tendresse de votre amour,
afin que, vous aimant en toutes choses et par-dessus toutes choses,
nous puissions parvenir à la jouissance de vos promesses qui surpassent tous nos désirs.
Par Jésus-Christ Notre-Seigneur. 

**℟.** Amen.
"""
