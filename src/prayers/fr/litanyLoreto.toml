title = "Litanies de Lorette"
categories = ["litany"]

[[versions]]
name = ""
content = """
Seigneur, prends pitié.
Ô Christ, prends pitié.
Seigneur, prends pitié.
Christ, écoute-nous.
Christ, écoute-nous.

Père du Ciel, toi qui es Dieu,
aie pitié de nous.

Fils, Rédempteur du monde, toi qui es Dieu,
Esprit Saint, toi qui es Dieu,
Trinité sainte, toi qui es un seul Dieu,

Sainte Marie, priez pour nous.
Sainte Mère de Dieu, priez pour nous.
Sainte Vierge des vierges, priez pour nous.
Mère du Christ, priez pour nous.
Mère de l'Église, priez pour nous.
Mère de Miséricorde, priez pour nous.
Mère de la grâce divine, priez pour nous.
Mère de l'Espérance, priez pour nous.
Mère très pure, priez pour nous.
Mère très chaste, priez pour nous.
Mère toujours vierge, priez pour nous.
Mère sans taches, priez pour nous.
Mère très aimable, priez pour nous.
Mère admirable, priez pour nous.
Mère du bon conseil, priez pour nous.
Mère du Créateur, priez pour nous.
Mère du Sauveur, priez pour nous.
Mère très prudente, priez pour nous.
Mère digne d'honneur, priez pour nous.
Mère digne de louange, priez pour nous.
Vierge puissante, priez pour nous.
Vierge clémente, priez pour nous.
Vierge fidèle, priez pour nous.
Miroir de la sainteté divine, priez pour nous.
Siège de la Sagesse, priez pour nous.
Cause de notre joie, priez pour nous.
Temple de l'Esprit Saint, priez pour nous.
Tabernacle de la gloire éternelle, priez pour nous.
Demeure toute consacrée à Dieu, priez pour nous.
Rose mystique, priez pour nous.
Tour de David, priez pour nous.
Tour d'ivoire, priez pour nous.
Maison d'or, priez pour nous.
Arche d'alliance, priez pour nous.
Porte du ciel, priez pour nous.
Étoile du matin, priez pour nous.
Salut des malades, priez pour nous.
Refuge des pécheurs, priez pour nous.
Réconfort des Migrants, priez pour nous.
Consolatrice des affligés, priez pour nous.
Secours des chrétiens, priez pour nous.
Reine des Anges, priez pour nous.
Reine des Patriarches, priez pour nous.
Reine des Prophètes, priez pour nous.
Reine des Apôtres, priez pour nous.
Reine des Martyrs, priez pour nous.
Reine des Confesseurs, priez pour nous.
Reine des Vierges, priez pour nous.
Reine de tous les Saints, priez pour nous.
Reine conçue sans le péché originel, priez pour nous.
Reine élevée au ciel, priez pour nous.
Reine du Saint Rosaire, priez pour nous.
Reine de la famille, priez pour nous.
Reine de la paix. priez pour nous.

Agneau de Dieu, qui enlèves le péché du monde,
pardonne-nous, Seigneur.

Agneau de Dieu, qui enlèves le péché du monde,
écoute-nous, Seigneur.

Agneau de Dieu, qui enlèves le péché du monde,
aie pitié de nous, Seigneur.

Prie pour nous, Sainte Mère de Dieu,
afin que nous devenions dignes des promesses du Christ.

Prions,
Accorde à tes fidèles,
Seigneur notre Dieu,
de bénéficier de la santé de l'âme et du corps,
par la glorieuse intercession
de la bienheureuse Marie toujours vierge,
délivre-nous des tristesse du temps présent
et conduis-nous au bonheur éternel,
Par Jésus, le Christ, notre Seigneur.
Amen.
"""
