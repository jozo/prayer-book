title = "Litanies de Lorette"
categories = ["litany"]

[[versions]]
name = ""
content = """
Seigneur, prends pitié.
Ô Christ, prends pitié.
Seigneur, prends pitié.

Jésus-Christ, écoute-nous.
Jésus-Christ, exauce-nous.

Père du Ciel, toi qui es Dieu,
_aie pitié de nous._

Fils, Rédempteur du monde, toi qui es Dieu,
_aie pitié de nous._

Esprit Saint, toi qui es Dieu,
_aie pitié de nous._

Trinité sainte, toi qui es un seul Dieu,
_aie pitié de nous._

Sainte Marie,
_priez pour nous._

Sainte Mère de Dieu,
_priez pour nous._

Sainte Vierge des vierges,
_priez pour nous._

Mère du Christ,
_priez pour nous._

Mère de l'Église,
_priez pour nous._

Mère de Miséricorde,
_priez pour nous._

Mère de la grâce divine,
_priez pour nous._

Mère de l'Espérance,
_priez pour nous._

Mère très pure,
_priez pour nous._

Mère très chaste,
_priez pour nous._

Mère toujours vierge,
_priez pour nous._

Mère sans taches,
_priez pour nous._

Mère très aimable,
_priez pour nous._

Mère admirable,
_priez pour nous._

Mère du bon conseil,
_priez pour nous._

Mère du Créateur,
_priez pour nous._

Mère du Sauveur,
_priez pour nous._

Mère très prudente,
_priez pour nous._

Mère digne d'honneur,
_priez pour nous._

Mère digne de louange,
_priez pour nous._

Vierge puissante,
_priez pour nous._

Vierge clémente,
_priez pour nous._

Vierge fidèle,
_priez pour nous._

Miroir de la sainteté divine,
_priez pour nous._

Siège de la Sagesse,
_priez pour nous._

Cause de notre joie,
_priez pour nous._

Temple de l'Esprit Saint,
_priez pour nous._

Tabernacle de la gloire éternelle,
_priez pour nous._

Demeure toute consacrée à Dieu,
_priez pour nous._

Rose mystique,
_priez pour nous._

Tour de David,
_priez pour nous._

Tour d'ivoire,
_priez pour nous._

Maison d'or,
_priez pour nous._

Arche d'alliance,
_priez pour nous._

Porte du ciel,
_priez pour nous._

Étoile du matin,
_priez pour nous._

Salut des malades,
_priez pour nous._

Refuge des pécheurs,
_priez pour nous._

Réconfort des Migrants,
_priez pour nous._

Consolatrice des affligés,
_priez pour nous._

Secours des chrétiens,
_priez pour nous._

Reine des Anges,
_priez pour nous._

Reine des Patriarches,
_priez pour nous._

Reine des Prophètes,
_priez pour nous._

Reine des Apôtres,
_priez pour nous._

Reine des Martyrs,
_priez pour nous._

Reine des Confesseurs,
_priez pour nous._

Reine des Vierges,
_priez pour nous._

Reine de tous les Saints,
_priez pour nous._

Reine conçue sans le péché originel,
_priez pour nous._

Reine élevée au ciel,
_priez pour nous._

Reine du Saint Rosaire,
_priez pour nous._

Reine de la famille,
_priez pour nous._

Reine de la paix.
_priez pour nous._

Agneau de Dieu, qui enlèves le péché du monde,
_pardonne-nous, Seigneur._

Agneau de Dieu, qui enlèves le péché du monde,
_écoute-nous, Seigneur._

Agneau de Dieu, qui enlèves le péché du monde,
_aie pitié de nous, Seigneur._

**℣.** Prie pour nous, Sainte Mère de Dieu,

**℟.** afin que nous devenions dignes des promesses du Christ.

**Prions:**
Accorde à tes fidèles,
Seigneur notre Dieu,
de bénéficier de la santé de l'âme et du corps,
par la glorieuse intercession
de la bienheureuse Marie toujours vierge,
délivre-nous des tristesse du temps présent
et conduis-nous au bonheur éternel,
Par Jésus, le Christ, notre Seigneur.

**℟.** Amen.
"""
