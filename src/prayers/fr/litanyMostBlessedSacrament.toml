name = ""
content = """
Seigneur, ayez pitié de nous.
Ô Christ, ayez pitié de nous.
Seigneur, ayez pitié de nous.

Jésus-Christ, écoutez-nous.
Jésus-Christ, exaucez-nous.

Père céleste qui êtes Dieu,
_ayez pitié de nous._

Fils, rédempteur du monde, qui êtes Dieu,
_ayez pitié de nous._

Esprit-Saint, qui êtes Dieu,
_ayez pitié de nous._

Trinité Sainte, qui êtes un seul Dieu,
_ayez pitié de nous._

Pain vivant qui êtes descendu du ciel,
_ayez pitié de nous._

Dieu caché et Sauveur,
_ayez pitié de nous._

Froment des élus,
_ayez pitié de nous._

Vin céleste qui faites germer dans les cœurs la fleur de la virginité,
_ayez pitié de nous._

Pain qui faites les délices des rois,
_ayez pitié de nous._

Sacrifice perpétuel,
_ayez pitié de nous._

Oblation pure,
_ayez pitié de nous._

Agneau sans tache,
_ayez pitié de nous._

Table où nous est donnée la sainteté même,
_ayez pitié de nous._

Nourriture des anges,
_ayez pitié de nous._

Manne dont la force et la vertu sont tout intérieures,
_ayez pitié de nous._

Abrégé des merveilles du Tout-Puissant,
_ayez pitié de nous._

Pain au-dessus de tout substance,
_ayez pitié de nous._

Verbe fait chair,
_ayez pitié de nous._

Dieu avec nous,
_ayez pitié de nous._

Hostie sainte et adorable,
_ayez pitié de nous._

Calice de bénédiction,
_ayez pitié de nous._

Mystère de foi,
_ayez pitié de nous._

Sacrement sublime et vénérable,
_ayez pitié de nous._

Sacrifice le plus saint,
_ayez pitié de nous._

Sacrifice vraiment expiatoire pour les vivants et pour les morts,
_ayez pitié de nous._

Céleste remède contre les atteintes du péché,
_ayez pitié de nous._

Miracle étonnant et le plus grand des prodiges,
_ayez pitié de nous._

Souvenir sacré de la passion du Seigneur,
_ayez pitié de nous._

Don précieux qui surpassez la plénitude de tous les dons,
_ayez pitié de nous._

Témoignage le plus touchant de l'amour de notre Dieu,
_ayez pitié de nous._

Torrent de la munificence divine,
_ayez pitié de nous._

Mystère le plus relevé et le plus auguste,
_ayez pitié de nous._

Gage de notre immortalité,
_ayez pitié de nous._

Sacrement redoutable à l'enfer, et qui vivifiez nos âmes,
_ayez pitié de nous._

Pain devenu la propre chair du Verbe incarné,
_ayez pitié de nous._

Sacrifice non sanglant,
_ayez pitié de nous._

Aliment de vie présenté par la Vie même,
_ayez pitié de nous._

Banquet délicieux dont les anges sont les ministres,
_ayez pitié de nous._

Sacrement d'amour,
_ayez pitié de nous._

Lien de charité,
_ayez pitié de nous._

Oblation d'un Dieu qui s'offre lui-même comme victime,
_ayez pitié de nous._

Douceur spirituelle goûtée dans sa propre source,
_ayez pitié de nous._

Réfection des âmes saintes,
_ayez pitié de nous._

Viatique de ceux qui meurent dans le Seigneur,
_ayez pitié de nous._

Gage assuré de notre gloire future,
_ayez pitié de nous._

Soyez-nous propice,
_pardonnez-nous, Seigneur._

Soyez-nous propice,
_pardonnez-nous, Seigneur._

Du malheur de recevoir indignement votre Corps et votre Sang adorables,
_délivrez-nous, Seigneur._

De la concupiscence de la chair,
_délivrez-nous, Seigneur._

De la concupiscence des yeux,
_délivrez-nous, Seigneur._

De l'orgueil de la vie,
_délivrez-nous, Seigneur._

De toute occasion de vous offenser,
_délivrez-nous, Seigneur._

Par le désir ardent que vous avez eu de célébrer la dernière Pâque avec vos apôtres,
_délivrez-nous, Seigneur._

Par la profonde humilité qui vous a fait laver les pieds de vos disciples,
_délivrez-nous, Seigneur._

Par l'immense charité qui vous a porté à instituer ce divin Sacrement,
_délivrez-nous, Seigneur._

Par les cinq plaies douloureuses qu'a reçues votre corps sacré pour l'amour de nous,
_délivrez-nous, Seigneur._

Tout pécheurs que nous sommes, nous vous en prions,
_écoutez-nous._

Daignez accroître et conserver en nous la foi, le respect et la dévotion envers ce Sacrement admirable, nous vous en prions,
_écoutez-nous._

Daignez-nous conduire, par la confession humble et sincère de nos péchés, à l'usage fréquent de la sainte Eucharistie, nous vous en prions,
_écoutez-nous._

Daignez-nous préserver de toute hérésie, de toute infidélité et de tout aveuglement intérieur, nous vous en prions,
_écoutez-nous._

Daignez-nous faire recueillir les fruits célestes qu'opère, dans les âmes bien disposées, ce Sacrement qui renferme en lui la sainteté même, nous vous en prions,
_écoutez-nous._

Daignez enfin nous soutenir et nous fortifier aux approches de la mort, par la vertu efficace de ce Viatique céleste, nous vous en prions,
_écoutez-nous._

Fils éternel du vrai Dieu, nous vous en prions,
_écoutez-nous._

Agneau de Dieu qui effacez les péchés du monde,
_pardonnez-nous, Seigneur._

Agneau de Dieu qui effacez les péchés du monde,
_exaucez-nous, Seigneur._

Agneau de Dieu qui effacez les péchés du monde,
_ayez pitié de nous._

Jésus-Christ, écoutez-nous.
Jésus-Christ, exaucez-nous.

Seigneur, ayez pitié de nous.
Ô Christ, ayez pitié de nous.
Seigneur, ayez pitié de nous.

Notre père...

Je vous salue, Marie...

**℣.** Vous leur avez donné le pain du ciel.

**℟.** Qui renferme toutes sortes de délices.

**Prions:**
Ô Dieu, qui nous avez laissé un souvenir continuel de votre passion dans le Sacrement admirable de l'Eucharistie, faites-nous la grâce de révérer de telle sorte les mystères sacrés de votre corps et de votre sang, que nous ressentions sans cesse en nous le fruit de votre rédemption. Vous qui, étant Dieu, vivez et régnez avec Dieu le Père en l'unité du Saint-Esprit, dans tous les siècles des siècles.

**℟.** Amen.
