name = ""
content = """
Seigneur, ayez pitié de nous.
Ô Christ, ayez pitié de nous.
Seigneur, ayez pitié de nous.

Jésus-Christ, écoutez-nous.
Jésus-Christ, exaucez-nous.

Père céleste qui êtes Dieu,
_ayez pitié de nous._

Fils, rédempteur du monde, qui êtes Dieu,
_ayez pitié de nous._

Esprit-Saint, qui êtes Dieu,
_ayez pitié de nous._

Trinité Sainte, qui êtes un seul Dieu,
_ayez pitié de nous._

Jésus, fils du Dieu vivant,
_ayez pitié de nous._

Jésus, splendeur du père,
_ayez pitié de nous._

Jésus, splendeur de la lumière éternelle,
_ayez pitié de nous._

Jésus, roi de gloire,
_ayez pitié de nous._

Jésus, soleil de justice,
_ayez pitié de nous._

Jésus, fils de la vierge Marie,
_ayez pitié de nous._

Jésus, aimable,
_ayez pitié de nous._

Jésus, admirable,
_ayez pitié de nous._

Jésus, Dieu fort,
_ayez pitié de nous._

Jésus, père des siècles à venir,
_ayez pitié de nous._

Jésus, ange du grand conseil,
_ayez pitié de nous._

Jésus, très puissant,
_ayez pitié de nous._

Jésus, très patient,
_ayez pitié de nous._

Jésus, très obéissant,
_ayez pitié de nous._

Jésus, doux et humble de cœur,
_ayez pitié de nous._

Jésus, qui aimez la chasteté,
_ayez pitié de nous._

Jésus, qui nous aimez,
_ayez pitié de nous._

Jésus, Dieu de paix,
_ayez pitié de nous._

Jésus, auteur de la vie,
_ayez pitié de nous._

Jésus, modèle des vertus,
_ayez pitié de nous._

Jésus, zélateur des âmes,
_ayez pitié de nous._

Jésus, notre Dieu,
_ayez pitié de nous._

Jésus, notre refuge,
_ayez pitié de nous._

Jésus, père des pauvres,
_ayez pitié de nous._

Jésus, trésor des fidèles,
_ayez pitié de nous._

Jésus, bon pasteur,
_ayez pitié de nous._

Jésus, vraie lumière,
_ayez pitié de nous._

Jésus, sagesse éternelle,
_ayez pitié de nous._

Jésus, bonté infinie,
_ayez pitié de nous._

Jésus, notre voie et notre vie,
_ayez pitié de nous._

Jésus, joie des anges,
_ayez pitié de nous._

Jésus, roi des patriarches,
_ayez pitié de nous._

Jésus, maître des apôtres,
_ayez pitié de nous._

Jésus, docteur des évangélistes,
_ayez pitié de nous._

Jésus, force des martyrs,
_ayez pitié de nous._

Jésus, lumière des confesseurs,
_ayez pitié de nous._

Jésus, pureté des vierges,
_ayez pitié de nous._

Jésus, couronne de tous les saints,
_ayez pitié de nous._

Soyez-nous propices,
_pardonnez-nous, Jésus._

Soyez-nous propices,
_exaucez-nous, Jésus._

De tout mal,
_délivrez-nous, Jésus._

De tout péché,
_délivrez-nous, Jésus._

De votre colère,
_délivrez-nous, Jésus._

Des embûches du démon,
_délivrez-nous, Jésus._

De l'esprit de fornication,
_délivrez-nous, Jésus._

De la mort éternelle,
_délivrez-nous, Jésus._

Du mépris de vos inspirations,
_délivrez-nous, Jésus._

Par le mystère de votre sainte Incarnation,
_délivrez-nous, Jésus._

Par votre nativité,
_délivrez-nous, Jésus._

Par votre enfance,
_délivrez-nous, Jésus._

Par votre vie toute divine,
_délivrez-nous, Jésus._

Par vos travaux,
_délivrez-nous, Jésus._

Par votre agonie et votre passion,
_délivrez-nous, Jésus._

Par votre croix et votre abandon,
_délivrez-nous, Jésus._

Par vos langueurs,
_délivrez-nous, Jésus._

Par votre mort et votre sépulture,
_délivrez-nous, Jésus._

Par votre résurrection,
_délivrez-nous, Jésus._

Par votre ascension,
_délivrez-nous, Jésus._

Par l'institution de la sainte eucharistie,
_délivrez-nous, Jésus._

Par vos joies,
_délivrez-nous, Jésus._

Par votre gloire,
_délivrez-nous, Jésus._

Agneau de Dieu qui effacez les péchés du monde,
_pardonnez-nous, Seigneur._

Agneau de Dieu qui effacez les péchés du monde,
_exaucez-nous, Seigneur._

Agneau de Dieu qui effacez les péchés du monde,
_ayez pitié de nous._

**℣.** Jésus, écoutez-nous.

**℟.** Jésus, exaucez-nous.

**Prions:**
Seigneur Jésus-Christ qui avez dit : 
"Demandez et vous recevrez, cherchez et vous trouverez,
frappez et l'on vous ouvrira" : donnez-nous, nous vous en supplions,
un tel attrait de votre amour tout divin, que nous vous aimions de tout cœur,
de bouche et d'action, et que nous ne cessions jamais de vous louer.
Vous qui vivez et régnez dans les siècles des siècles. 

**℟.** Amen.
