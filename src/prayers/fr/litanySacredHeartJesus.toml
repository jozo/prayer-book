V. Jésus, doux et humble de cœur.

R. Rendez-nous un cœur semblable au vôtre.

Prions : Dieu éternel et tout-puissant, jetez les yeux sur le cœur de votre fils bien-aimé :
soyez attentif aux louanges et aux satisfactions qu'il vous rend au nom des pécheurs.
