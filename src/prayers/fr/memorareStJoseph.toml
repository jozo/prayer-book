title = "Memorare en l'Honneur de St. Joseph"
categories = ["saints"]

[[versions]]
name = ""
content = """
Souvenez-vous, Ô très chaste époux de la Vierge Marie,
que jamais personne n'ayant sollicité votre soutien
ni prié pour votre intercession n'a été abandonné.
Pleinement confiant en votre puissance,
je viens vers vous, et implore votre protection.
Écoutez, Ô père adoptif du Rédempteur,
mon humble prière, et dans votre bonté veuillez m'entendre et
m'exaucez. Amen.
"""
