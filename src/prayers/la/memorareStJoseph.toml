title = "Memorare ad Sancti Ioseph"
categories = ["saints"]

[[versions]]
name = ""
content = """
Memorare, o purissime Sponse Virginis Mariae,
o dulcis Protector mi, sancte Ioseph,
non esse auditum a saeculo,
quemquem ad tua implorantem auxilia,
tua petentem suffragia, esse derelictum.
Ego tali animatus confidentia ad te venio,
tibique fervide me commendo.
Noli, quaeso, 
o Pater putative Redemptoris,
verba mea despicere,
sed audi propitius. Amen.
"""
