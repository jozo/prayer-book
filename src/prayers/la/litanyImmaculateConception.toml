**℣.** Immaculata Virgo, ora pro nobis,

**℟.** Ut digni efficiamur promissionibus Filii tui Iesu Christi.

**Oremus:**

Omnipotens sempiterne Deus, qui Ecclesiam tuam gloria Immaculatae Conceptionis Matris Tui Filii sempiterni, laetificare dignatus es, concede, ut qui hanc immaculatam Conceptionem recolimus cum laetitia in terris, gaudium sempiternum consequi mereamur in caelis; per Christum Dominum nostrum.

**℟.** Amen.
