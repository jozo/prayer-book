title = "Litania Humilitatis"
categories = ["litany"]

[[versions]]
name = ""
content = """
O Jesu, mitis et humilis corde,
_Exaudi me._

A desiderio, ut amer,
_Libera me Domine._

A desiderio, ut exalter,
_Libera me Domine._

A desiderio, ut honorer,
_Libera me Domine._

A desiderio, ut lauder,
_Libera me Domine._

A desiderio, ut aliis praeterear,
_Libera me Domine._

A desiderio, ut consular,
_Libera me Domine._

A desiderio, ut approber,
_Libera me Domine._

A timore, ne humilier,
_Libera me Domine._

A timore, ne spernar,
_Libera me Domine._

A timore, ne contemnar,
_Libera me Domine._

A timore, ne calumniam feram,
_Libera me Domine._

A timore, ne oblivioni tradar,
_Libera me Domine._

A timore, ne irridear,
_Libera me Domine._

A timore, ne iniuriam accipiam,
_Libera me Domine._

A timore, ne suspiciar,
_Libera me Domine._

Ut magis alii amentur quam ego,
_Iesu, da mihi gratiam ita desiderandi._

Ut plus alii aestimentur quam ego,
_Iesu, da mihi gratiam ita desiderandi._

Ut alii extollantur in mundi existimatione, ego autem minuar,
_Iesu, da mihi gratiam ita desiderandi._

Ut alii eligantur, ego autem praeterear,
_Iesu, da mihi gratiam ita desiderandi._

Ut alii mihi in omnibus rebus praeferantur,
_Iesu, da mihi gratiam ita desiderandi._

Ut alii me, dum sanctus fieri debeam, sanctiores sint,
_Iesu, da mihi gratiam ita desiderandi._
"""
