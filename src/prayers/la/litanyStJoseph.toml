content = """
Kyrie eleison.
Christe eleison.
Kyrie eleison.

Christe audi nos.
Christe exaudi nos.

Pater de caelis, Deus,
_Miserere nobis._

Fili, Redemptor mundi, Deus,
_Miserere nobis._

Spiritus Sancte, Deus,
_Miserere nobis._

Sancta Trinitas, unus Deus,
_Miserere nobis._

Sancta Maria,
_Ora pro nobis._

Sancte Ioseph,
_Ora pro nobis._

Proles David inclyta,
_Ora pro nobis._

Lumen Patriarcharum,
_Ora pro nobis._

Dei Genetricis Sponse,
_Ora pro nobis._

Custos pudice Virginis,
_Ora pro nobis._

Filii Dei nutricie,
_Ora pro nobis._

Christi defensor sedule,
_Ora pro nobis._

Almae Familiae praeses,
_Ora pro nobis._

Ioseph iustissime,
_Ora pro nobis._

Ioseph castissime,
_Ora pro nobis._

Ioseph prudentissime,
_Ora pro nobis._

Ioseph fortissime,
_Ora pro nobis._

Ioseph oboedientissime,
_Ora pro nobis._

Ioseph fidelissime,
_Ora pro nobis._

Speculum patientiae,
_Ora pro nobis._

