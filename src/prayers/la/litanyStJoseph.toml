_Ora pro nobis._

Patrone morientium,
_Ora pro nobis._

Terror daemonum,
_Ora pro nobis._

Protector sanctae Ecclesiae,
_Ora pro nobis._

Agnus Dei, qui tollis peccata mundi,
_Parce nobis Domine._

Agnus Dei, qui tollis peccata mundi,
_Exaudi nobis Domine._

Agnus Dei, qui tollis peccata mundi,
_Miserere nobis._

**℣.** Constituit eum dominum domus suae.

**℟.** Et principem omnis possessionis suae.

**Oremus:**
Deus, qui in ineffabili providentia beatum Ioseph sanctissimae Genetricis tuae Sponsum
eligere dignatus es, praesta, quaesumus, ut quem protectorem veneramur in terris,
intercessorem habere mereamur in caelis Qui vivis et regnas in saecula saeculorum.

**℟.** Amen.
