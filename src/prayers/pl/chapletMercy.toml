title = "Koronka do Miłosierdzia Bożego"
categories = ["basic"]

[[versions]]
name = "Wersja oficjalna KEP"
content = """

*(do odmawiania na zwykłej cząstce różańca - 5 dziesiątków)*

*(Na początku)*

_Ojcze Nasz…_

_Zdrowaś Maryjo…_

_Wierzę w Boga…_


*(Na dużych paciorkach)*

**Ojcze Przedwieczny**, 
_ofiaruję Ci Ciało i Krew, Duszę i Bóstwo najmilszego Syna Twojego, a Pana naszego Jezusa Chrystusa, na przebłaganie za grzechy nasze i całego świata._ *(1 raz)*

*(Na małych paciorkach)*

**Dla Jego bolesnej męki**, 
_miej miłosierdzie dla nas i całego świata._ *(10 razy)*

*(Po ukończeniu 5 dziesiątek)*
**Święty Boże**, Święty Mocny, Święty Nieśmiertelny,
_zmiłuj się nad nami i nad całym światem._ *(3 razy)*

*(Dodatkowe modlitwy, często odmawiane wraz z Koronką)*

**O Krwi i Wodo, któraś wypłynęła z Najświętszego Serca Jezusowego jako zdrój miłosierdzia dla nas** 
_– Ufam Tobie._ *(3 razy)*

**Jezu ufam Tobie.** *(3 razy)*

**Święta Faustyno** 
_– módl się za nami i za całym światem._ *(1 raz)*
"""