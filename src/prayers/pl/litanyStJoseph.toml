content = """
Kyrie elejson.
Chryste elejson.
Kyrie elejson.

Chryste, usłysz nas.
Chryste, wysłuchaj nas.

Ojcze z nieba, Boże,
_zmiłuj się nad nami._

Synu, Odkupicielu świata, Boże,
_zmiłuj się nad nami._

Duchu Święty, Boże,
_zmiłuj się nad nami._

Święta Trójco, Jedyny Boże,
_zmiłuj się nad nami._

Święta Maryjo,
_módl się za nami._

Święty Józefie,
_módl się za nami._

Przesławny potomku Dawida,
_módl się za nami._

Światło Patriarchów,
_módl się za nami._

Oblubieńcze Bogarodzicy,
_módl się za nami._

Przeczysty stróżu Dziewicy,
_módl się za nami._

Żywicielu Syna Bożego,
_módl się za nami._

Troskliwy obrońco Chrystusa,
_módl się za nami._

Głowo Najświętszej Rodziny,
_módl się za nami._

Józefie najsprawiedliwszy,
_módl się za nami._

Józefie najczystszy,
_módl się za nami._

Józefie najroztropniejszy,
_módl się za nami._

Józefie najmężniejszy,
_módl się za nami._

Józefie najposłuszniejszy,
_módl się za nami._

Józefie najwierniejszy,
_módl się za nami._

Zwierciadło cierpliwości,
_módl się za nami._

Miłośniku ubóstwa,
_módl się za nami._

Wzorze pracujących,
_módl się za nami._

Ozdobo życia rodzinnego,
_módl się za nami._

Opiekunie dziewic,
_módl się za nami._

Podporo rodzin,
_módl się za nami._

Pociecho nieszczęśliwych,
_módl się za nami._

Nadziejo chorych,
_módl się za nami._

Patronie umierających,
_módl się za nami._

Postrachu duchów piekielnych,
_módl się za nami._

Opiekunie Kościoła świętego,
_módl się za nami._

Baranku Boży, który gładzisz grzechy świata,
