name = ""
content = """
Kyrie elejson.
Chryste elejson.
Kyrie elejson.

Chryste, usłysz nas.
Chryste, wysłuchaj nas.

Ojcze z nieba, Boże,
_zmiłuj się nad nami._

Synu, Odkupicielu świata, Boże,
_zmiłuj się nad nami._

Duchu Święty, Boże,
_zmiłuj się nad nami._

Święta Trójco, Jedyny Boże,
_zmiłuj się nad nami._

Krwi Chrystusa, Jednorodzonego Syna Ojca Przedwiecznego,
_wybaw nas._

Krwi Chrystusa, wcielonego Słowa Bożego,
_wybaw nas._

Krwi Chrystusa, nowego i wiecznego Przymierza,
_wybaw nas._

Krwi Chrystusa, przy konaniu w Ogrójcu spływająca na ziemię,
_wybaw nas._

Krwi Chrystusa, tryskająca przy biczowaniu,
_wybaw nas._

Krwi Chrystusa, brocząca spod cierniowej korony,
_wybaw nas._

Krwi Chrystusa, przelana na krzyżu,
_wybaw nas._

Krwi Chrystusa, zapłato naszego zbawienia,
_wybaw nas._

Krwi Chrystusa, bez której nie ma przebaczenia,
_wybaw nas._

Krwi Chrystusa, która poisz i oczyszczasz dusze w Eucharystii,
_wybaw nas._

Krwi Chrystusa, zdroju miłosierdzia,
_wybaw nas._

Krwi Chrystusa, zwyciężająca złe duchy,
_wybaw nas._

Krwi Chrystusa, męstwo Męczenników,
_wybaw nas._

Krwi Chrystusa, mocy Wyznawców,
_wybaw nas._

Krwi Chrystusa, rodząca Dziewice,
_wybaw nas._

Krwi Chrystusa, ostojo zagrożonych,
_wybaw nas._

Krwi Chrystusa, ochłodo pracujących,
_wybaw nas._

Krwi Chrystusa, pociecho płaczących,
_wybaw nas._

Krwi Chrystusa, nadziejo pokutujących,
_wybaw nas._

Krwi Chrystusa, otucho umierających,
_wybaw nas._

Krwi Chrystusa, pokoju i słodyczy serc naszych,
_wybaw nas._

Krwi Chrystusa, zadatku życia wiecznego,
_wybaw nas._

Krwi Chrystusa, wybawienie dusz z otchłani czyśćcowej,
_wybaw nas._

Krwi Chrystusa, wszelkiej chwały i czci najgodniejsza,
_wybaw nas._

Baranku Boży, który gładzisz grzechy świata,
_przepuść nam, Panie._

Baranku Boży, który gładzisz grzechy świata,
_wysłuchaj nas, Panie._

Baranku Boży, który gładzisz grzechy świata,
_zmiłuj się nad nami._

**℣.** Odkupiłeś nas, Panie, Krwią swoją.

**℟.** I uczyniłeś nas królestwem Boga naszego.

**Módlmy się:**
Wszechmogący, wieczny Boże, Ty Jednorodzonego Syna swego ustanowiłeś
Odkupicielem świata i Krwią Jego dałeś się przebłagać, daj nam, prosimy,
godnie czcić zapłatę naszego zbawienia i dzięki niej doznawać obrony od
zła doczesnego na ziemi, abyśmy wiekuistym szczęściem radowali się w niebie.
Przez Chrystusa, Pana naszego.

**℟.** Amen.
