content = """
1. **Vestea îngerului adusă Mariei**<br/>
Fructul misterului: umilitate<br/>
2. **Vizita Mariei la Elisabeta**<br/>
Fructul misterului: caritatea fraternă<br/>
3. **Nașterea lui Isus la Betleem**<br/>
Fructul misterului: spiritul de sărăcie<br/>
4. **Prezentarea lui Isus la templu**<br/>
Fructul misterului: puritate și obediență<br/>
5. **Regăsirea lui Isus în templu**<br/>
Fructul misterului: fervoare, răspuns la chemarea lui Dumnezeu<br/>
