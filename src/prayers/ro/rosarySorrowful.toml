4. **Purtarea crucii**<br/>
Fructul misterului: răbdarea în vremurile de încercare<br/>
5. **Răstignirea și moartea lui Isus pe cruce**<br/>
Fructul misterului: setea pentru mântuirea sufletelor<br/>
