title = "Îngere al lui Dumnezeu"
categories = ["basic"]

[[versions]]
name = ""
content = """
Îngere al lui Dumnezeu,<br/>
care ești păzitorul meu,<br/>
luminează-mă, păzește-mă,<br/>
povățuiește-mă<br/>
și ocârmuiește-mă pe mine,<br/>
care-ți sunt încredințat ție<br/>
prin mila lui Dumnezeu.<br/>

Amin.
"""

