title = "Tatăl nostru"
categories = ["basic"]

[[versions]]
name = ""
content = """
Tatăl nostru care ești în ceruri,<br/>
Sfințească-se numele Tău,<br/>
vie împărăția Ta,<br/>
facă-se voia Ta,<br/>
precum în cer așa și pe pământ.<br/>
Pâinea noastră cea de toate zilele,<br/>
dă-ne-o nouă astăzi<br/>
și ne iartă nouă greșelile noastre<br/>
precum și noi iertăm greșiților noștri<br/>
și nu ne duce pe noi în ispită<br/>
ci ne izvbăvește de cel rău.<br/>
"""
