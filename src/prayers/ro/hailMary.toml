title = "Bucură-te, Marie"
categories = ["basic"]

[[versions]]
name = ""
content = """
Bucură-te, Marie, cea plină de har,<br/>
Domnul este cu tine.<br/>
Binecuvântată ești tu între femei<br/>
și binecuvântat este rodul trupului tău, Isus.<br/>

Sfântă Marie, maica lui Dumnezeu,<br/>
roagă-te pentru noi păcătoșii<br/>
acum și în ceasul morții noastre.<br/>

Amin.
"""


