content = """
Bucură-te, Regina cerului, aleluia.<br/>
Căci acela pe care ai fost vrednică să-L porți, aleluia.<br/>
A înviat precum a zis, aleluia.<br/>
Roagă-te pentru noi lui Dumnezeu, aleluia.<br/>
Bucură-te și te veselește, Fecioară Marie, aleluia.<br/>
Căci Domnul a înviat cu adevărat, aleluia.<br/>

Să ne rugăm:<br/>
Dumnezeule, care ai binevoit să bucuri lumea prin învierea Fiului tău, Domnul nostru Isus Cristos,
fă-ne, te rugăm, ca prin Născătoarea lui, Fecioara Maria, să dobândim bucuria învierii. Prin
Cristos, Domnul nostru.

Amin.
"""
