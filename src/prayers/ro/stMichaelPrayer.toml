title = "Rugăciune către arhanghelul Mihail"
categories = ["basic"]

[[versions]]
name = ""
content = """
Sfântule Mihal arhanghelule,<br/>
apără-ne în luptă<br/>
și fii protectorul nostru împotriva<br/>
răutății și lațurilor diavolului.<br/>

Fie ca Dumnezeu să exercite asupra sa puterea Sa, te rugăm:<br/>
și tu, Prinț al Armatei Celeste,<br/>
prin puterea divină care ți-a fost acordată,<br/>
aruncă în adâncurile iadului Satana<br/>
și celelalte spirite rele<br/>
care parcurg lumea pentru pierderea sufletelor.<br/>

Amin.
"""
