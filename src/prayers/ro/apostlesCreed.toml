title = "Simbolul apostolilor"
categories = ["basic"]

[[versions]]
name = ""
content = """
Cred în Dumnezeu, Tatăl atotputernicul, Creatorul cerului și al pământului.

Și în Isus Cristos, Fiul său unic, Domnul nostru, Care s-a zămislit de la Duhul Sfânt, s-a născut
din Maria Fecioară; a pătimit sub Ponțiu Pilat, s-a răstignit, a murit și s-a îngropat; a coborât în
iad, a treia zi a înviat din morți; s-a suit la ceruri, șade de-a dreapta lui Dumnezeu, Tatăl
atotputernicul; de unde are să vie să judece pe vii și pe morți.

Cred în Duhul Sfânt; sfânta Biserică Catolică; împărtășirea sfinților, iertarea păcatelor, învierea
morților și viața veșnică.

Amin.
"""
