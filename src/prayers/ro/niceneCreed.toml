title = "Crezul, Simbolul niceno-constantinopolitan"
categories = ["basic"]

[[versions]]
name = ""
content = """
Cred într-unul Dumnezeu,<br/>
Tatăl atotputernicul,<br/>
creatorul cerului și al pământului,<br/>
al tuturor văzutelor și nevăzutelor.<br/>

Cred într-unul Domn Isus Cristos,<br/>
Fiului lui Dumnezeu, unul-născut,<br/>
care din Tatăl s-a născut<br/>
mai înainte de toți vecii.<br/>
Dumnezeu din Dumnezeu,<br/>
lumină din lumină,<br/>
Dumnezeu adevărat din Dumnezeu adevărat,<br/>
născut, iar nu creat;<br/>
de o ființă cu Tatăl, prin care toate s-au făcut.<br/>
Care pentru noi oamenii<br/>
și pentru a noastră mântuire<br/>
s-a coborât din ceruri.<br/>
S-a întrupat de la Duhul Sfânt,<br/>
din Maria Fecioară, și s-a făcut om.<br/>
S-a răstignit pentru noi sub Ponțiu Pilat,<br/>
a pătimit și s-a îngropat.<br/>
A înviat a treia zi, după Scripturi,<br/>
și s-a suitt la cer;<br/>
șade de-a dreapta Tatălui<br/>
și iarăși va veni cu mărire<br/>
să judece pe cei vii și pe cei morți;<br/>
a cărui împărăție nu va avea sfârșit.<br/>

Cred în Duhul Sfânt,<br/>
Domnul și de viață dătătorul,<br/>
care de la Tatăl și de la Fiul purcede;<br/>
care împreună cu Tatăl și cu Fiul<br/>
este adorat și preamărit<br/>
și a grăit prin proroci.<br/>

Cred într-una, sfântă, catolică<br/>
și apostolică Biserică.<br/>
Mărturisesc un Botez<br/>
spre iertarea păcatelor.<br/>
Aștept învierea morților<br/>
și viața veacului ce va veni.<br/>

Amin.
"""
