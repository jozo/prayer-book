title = "Angelus"
categories = ["basic"]

[[versions]]
name = "Modern"
content = """
Îngerul Domnului a vestit Mariei,<br/>
Și ea a zămislit de la Duhul Sfânt.<br/>
Bucură-te Marie...<br/>

Iată roaba Domnului<br/>
Fie mie după cuvântul tău.<br/>
Bucură-te Marie Marie...<br/>

Și Cuvântul s-a făcut trup<br/>
Și a locuit între noi.<br/>
Bucură-te Marie...<br/>

Rugați-vă pentru noi, sfântă Născătoare de Dumnezeu,<br/>
Ca să ne facem vrednici de făgăduințele lui Cristos.<br/>

Să ne rugăm: Te rugăm, Doamne, să reverși harul tău asupra sufletelor noastre, pentru ca noi, care
am cunoscut prin vestirea îngerului Întruparea lui Cristos, Fiul tău, să ajungem prin patima și
crucea lui la slava învierii, prin același Cristos, Domnul nostru.

Amin.
"""
