title = "Kumbuka Bikira"
categories = ["basic"]

[[versions]]
name = ""
content = """
Kumbuka ee Bikira mwenye rehema,
haijasikika kamwe kwamba ulimwacha mtu aliyekimbilia ulinzi wako,
akiomba msaada wako, akitaka umwombe.
Nami kwa matumaini hayo, nakukimbilia ee mama,
mkuu wa mabikira, ninakuja kwako, ninasimama mbele yako,
nikilalamika mimi mkosefu ewe mama wa neno la mungu,
usiyakatae maneno yangu, mbali uyasikilize kwa wema na unitimizie.

Amina.
"""
