title = "Litani ya Unyenyekevu"
categories = ["litany"]

[[versions]]
name = ""
content = """
Ee Yesu, mpole na mnyenyekevu wa moyo,
_Nifanye moyo wangu kufanana na wako._

Kutokana na tamaa ya kuthaminiwa,
_Uniokoe, Ee Yesu._

Kutokana na tamaa ya kupendwa,
_Uniokoe, Ee Yesu._

Kutokana na tamaa ya kusifiwa,
_Uniokoe, Ee Yesu._

Kutokana na tamaa ya kuheshimiwa,
_Uniokoe, Ee Yesu._

Kutokana na tamaa ya kuinuliwa,
_Uniokoe, Ee Yesu._

Kutokana na tamaa ya kushauriwa,
_Uniokoe, Ee Yesu._

Kutokana na tamaa ya kuidhinishwa,
_Uniokoe, Ee Yesu._

Kutokana na hofu ya kudharauliwa,
_Uniokoe, Ee Yesu._

Kutokana na hofu ya kudharauliwa kwa dharau,
_Uniokoe, Ee Yesu. _

Kutokana na hofu ya kukataliwa,
_Uniokoe, Ee Yesu._

Kutokana na hofu ya kusahaulika,
_Uniokoe, Ee Yesu._

Kutokana na hofu ya kudhihakiwa,
_Uniokoe, Ee Yesu._

Kutokana na hofu ya kuumizwa au kukosewa,
_Uniokoe, Ee Yesu._

Kwamba wengine wapendwe zaidi kuliko mimi,
_Nipe neema ya kulitamani, Ee Yesu._

Kwamba wengine waheshimiwe zaidi kuliko mimi,
_Nipe neema ya kulitamani, Ee Yesu._

Kwamba kwa mtazamo wa ulimwengu, wengine waongezeke nami nipungue,
_Nipe neema ya kulitamani, Ee Yesu._

Kwamba wengine wachaguliwe nami niachwe,
_Nipe neema ya kulitamani, Ee Yesu._

Kwamba wengine wasifiwe nami nisahaulike,
_Nipe neema ya kulitamani, Ee Yesu._

Kwamba wengine wapendelewe katika yote,
_Nipe neema ya kulitamani, Ee Yesu._

Kwamba wengine wawe watakatifu zaidi kuliko mimi,
mradi tu niwe mtakatifu kadiri nipendavyo kuwa,
_Nipe neema ya kulitamani, Ee Yesu._

**Tuombe:**
Ee Yesu, Uniondoe katika roho ya majivuno na unifundishe unyenyekevu wa kweli, 
ili nikufuate kwa uaminifu.

Amina.
"""
