_utuhurumie._

Yesu, Mwokozi wa dunia,
_utuhurumie._

Yesu, Nuru ya kweli,
_utuhurumie._

Yesu, Njia, Ukweli na Uzima,
_utuhurumie._

Yesu, Hakimu wa walio hai na wafu,
_utuhurumie._

Yesu, Mlinzi wa roho,
_utuhurumie._

Yesu, Faraja ya wenye huzuni,
_utuhurumie._

Yesu, Msaada wa waaminifu,
_utuhurumie._

Yesu, Mfalme wa mbinguni,
_utuhurumie._

Mwana-Kondoo wa Mungu, uondoaye dhambi za dunia,
_utusamehe, Ee Bwana._

Mwana-Kondoo wa Mungu, uondoaye dhambi za dunia,
_utusikilize, Ee Bwana._

Mwana-Kondoo wa Mungu, uondoaye dhambi za dunia,—
_utuhurumie._

Yesu, utusikie.
_Yesu, utusikilize kwa huruma._

**Tuombe:**
Ee Mungu, uliweka wokovu wa wanadamu katika Jina la Yesu Mwanao wa pekee;
tunakuomba, utujalie kuliheshimu Jina hilo takatifu duniani,
ili tupate pia kufurahia ulinzi wake mbinguni.
Tunakuomba kwa njia ya Kristo Bwana wetu.

Amina.
