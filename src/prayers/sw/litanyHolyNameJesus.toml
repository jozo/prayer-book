content = """
Bwana, utuhurumie.
_Bwana, utuhurumie._

Kristo, utuhurumie.
_Kristo, utuhurumie._

Bwana, utuhurumie.
_Bwana, utuhurumie._

Yesu, utusikie.
_Yesu, utusikilize kwa huruma._

Mungu Baba wa mbinguni,
_utuhurumie._

Mungu Mwana, Mkombozi wa dunia,
_utuhurumie._

Mungu Roho Mtakatifu,
_utuhurumie._

Utatu Mtakatifu, Mungu mmoja,
_utuhurumie._

Yesu, Mwana wa Mungu aliye hai,
_utuhurumie._

Yesu, mng’ao wa Baba,
_utuhurumie._

Yesu, uangavu wa mwanga wa milele,
_utuhurumie._

Yesu, Mfalme wa utukufu,
_utuhurumie._

Yesu, Jua la haki,
_utuhurumie._

Yesu, Mwana wa Bikira Maria,
_utuhurumie._

Yesu, Mpole na mnyenyekevu wa moyo,
_utuhurumie._

Yesu, Mpenzi wa usafi,
_utuhurumie._

Yesu, Mpaji wa uzima,
_utuhurumie._

Yesu, Kielelezo cha wema,
_utuhurumie._

Yesu, Mfano wa fadhila zote,
_utuhurumie._

Yesu, Mwenye bidii kwa ajili ya roho,
_utuhurumie._

Yesu, Mungu wa amani,
_utuhurumie._

Yesu, Mwanzilishi wa uzima,
_utuhurumie._

Yesu, Kielelezo cha utiifu,
_utuhurumie._

