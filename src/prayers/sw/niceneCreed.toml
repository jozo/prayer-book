title = "Imani ya Nisea"
categories = ["basic"]

[[versions]]
name = ""
content = """
Nasadiki kwa Mungu mmoja, Baba mwenyezi,
muumba wa mbingu na dunia na vitu vyote vinavyoonekana na visivyoonekana.

Nasadiki kwa Bwana mmoja Yesu Kristo, Mwana pekee wa Mungu,
aliyezaliwa kwa Baba tangu milele yote. Mungu aliyetoka kwa Mungu, mwanga kwa mwanga,
Mungu kweli kwa Mungu kweli, aliyezaliwa bila kuumbwa, mwenye umungu mmoja na Baba,
ambaye vitu vyote vimeumbwa naye.

Alishuka kutoka mbinguni, kwa ajili yetu sisi wanadamu, na kwa ajili ya wokovu wetu.

Akapata mwili kwa uwezo wa Roho Mtakatifu kwake yeye Bikira Maria, akawa mwanadamu.

Akasulubiwa kwa ajili yetu sisi, kwa mamlaka ya Ponsyo Pilato; akateswa, akafa na akazikwa.

Siku ya tatu akafufuka, kadiri ya Maandiko, akapaa mbinguni, ameketi kuume kwa Baba.

Atakuja tena kwa utukufu, kuwahukumu wazima na wafu, na ufalme wake hautakuwa na mwisho.

Nasadiki kwa Roho Mtakatifu, Bwana na mleta uzima: atokaye kwa Baba na Mwana.
Anayeabudiwa na kutukuzwa, pamoja na Baba na Mwana: aliyenena kwa vinywa vya manabii.

Nasadiki kwa Kanisa moja, takatifu, katoliki, la Mitume.

Naungama ubatizo mmoja kwa maondoleo ya dhambi.

Nangojea na ufufuko wa wafu, na uzima wa milele ijayo.

Amina.
"""
