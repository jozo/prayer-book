title = "Sala Kwa Mtakatifu Mikaeli Malaika Mkuu"
categories = ["basic", "saints"]

[[versions]]
name = ""
content = """
Mtakatifu Mikaeli Malaika Mkuu, utulinde katika vita,
uwe kinga yetu katika maovu na maoteo ya shetani,
Mungu amtiishe, tunaomba sana, nawe Mkuu wa Majeshi ya
Mbinguni kwa nguvu ya Mungu uwaangushe motoni shetani
na pepo wabaya wengine wote, wanaozunguka duniani,
ili kuzipoteza roho za watu.

Amina.
"""
