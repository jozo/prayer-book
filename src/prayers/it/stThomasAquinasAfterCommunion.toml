title = "Dopo la Comunione (di San Tommaso d'Aquino)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Ti ringrazio, Signore, Padre onnipotente, eterno Dio, che non per mio merito,
ma per sola degnazione della tua misericordia, ti sei degnato di saziare
col prezioso Corpo e Sangue del tuo Figlio e Signore nostro Gesù Cristo,
me peccatore e servo indegno.

Ti supplico perché questa Comunione non sia per me motivo di castigo,
ma piuttosto pegno salutare di perdono; mi sia armatura di fede e scudo di buona volontà;
liberazione dai miei vizi, distruzione della concupiscenza e dissolutezza,
aumento di carità e di pazienza, di umiltà, di obbedienza e di tutte le virtù.
Sia mia salda difesa contro le insidie di tutti i nemici sia visibili sia invisibili,
quiete perfetta delle passioni carnali e spirituali; con te, unico e vero Dio,
stabile unione e possesso beato del mio fine.

Degnati, ti prego, di ammettere me peccatore a quell’ineffabile convito,
dove tu col tuo Figlio e con lo Spirito Santo sei luce vera, sazietà piena,
gaudio sempiterno, giocondità completa e felicità perfetta.
Per lo stesso Gesù Cristo nostro Signore.

Amen.
"""

