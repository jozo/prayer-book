title = "Concedimi… (di San Tommaso d'Aquino)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Concedimi, o Signore mio Dio,
una mente per conoscerti,
un cuore per cercarti,
saggezza per trovarti,
una condotta a te gradita,
una fedele perseveranza nell’aspettarti
e una speranza per abbracciarti finalmente.

Amen.
"""

