title = "Misteri Dolorosi"
categories = ["rosary"]

[[versions]]
name = ""
content = """
1. **L'Agonia nel Getsemani.**
Frutto del Mistero: Rimorso per il Peccato, obbedienza alla Volontà di Dio.
2. **La Flagellazione alla Colonna.**
Frutto del Mistero: Mortificazione (Purezza)
3. **L'Incoronazione di Spine.**
Frutto del Mistero: Disprezzo del Mondo (Coraggio Morale).
4. **Il Peso della Croce.**
Frutto del Mistero: Pazienza.
5. **La Crocifissione e la Morte di Nostro Signore.**
Frutto del Mistero: Perseveranza nella Fede, Grazia per una Santa Morte, Perdono.
"""
