content = """
Signore, pietà
Cristo, pietà
Signore, pietà.

Cristo, ascoltaci.
Cristo, esaudiscici.

Padre del cielo, che sei Dio,
_abbi pietà di noi._

Figlio, Redentore del mondo, che sei Dio,
_abbi pietà di noi._

Spirito Santo, che sei Dio,
_abbi pietà di noi._

Santa Trinità, unico Dio,
_abbi pietà di noi._

Santa Maria,
_prega per noi._

Santa Madre di Dio,
_prega per noi._

Santa Vergine delle vergini,
_prega per noi._

Madre di Cristo,
_prega per noi._

Madre della Chiesa,
_prega per noi._

Madre di misericordia,
_prega per noi._

Madre della divina grazia,
_prega per noi._

Madre della speranza,
_prega per noi._

Madre purissima,
_prega per noi._

Madre castissima,
_prega per noi._

Madre sempre vergine,
_prega per noi._

Madre immacolata,
_prega per noi._

Madre degna d'amore,
_prega per noi._

Madre ammirabile,
_prega per noi._

Madre del buon consiglio,
_prega per noi._

Madre del Creatore,
_prega per noi._

Madre del Salvatore,
_prega per noi._

Vergine prudente,
_prega per noi._

Vergine degna di onore,
_prega per noi._

Vergine degna di lode,
_prega per noi._

Vergine potente,
_prega per noi._

Vergine clemente,
_prega per noi._

Vergine fedele,
_prega per noi._

Specchio di perfezione,
_prega per noi._

Sede della Sapienza,
_prega per noi._

Fonte della nostra gioia,
_prega per noi._

Tempio dello Spirito Santo,
_prega per noi._

Tabernacolo dell'eterna gloria,
_prega per noi._

Dimora consacrata di Dio,
_prega per noi._

Rosa mistica,
_prega per noi._

Torre della santa città di Davide,
_prega per noi._

Fortezza inespugnabile,
_prega per noi._

Santuario della divina presenza,
_prega per noi._

Arca dell'alleanza,
_prega per noi._

Porta del cielo,
_prega per noi._

Stella del mattino,
_prega per noi._

