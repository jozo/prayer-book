title = "L'Eterno Riposo"
categories = ["basic"]

[[versions]]
name = ""
content = """
_(Per una persona)_

L'eterno riposo dona lui/lei, o Signore,
e splenda ad lui/lei la luce perpetua.
Riposi in pace.

Amen.

_(Per molti)_

L'eterno riposo dona loro, o Signore,
e splenda ad essi la luce perpetua.
Riposino in pace.

Amen.
"""
