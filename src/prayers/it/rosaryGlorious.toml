title = "Misteri Gloriosi"
categories = ["rosary"]

[[versions]]
name = ""
content = """
1. **La Risurrezione.**
Frutto del Mistero: la Fede
2. **L'Ascensione.**
Frutto del Mistero: la Speranza e il Desiderio del Cielo
3. **La Pentecoste.**
Frutto del Mistero: Amore di Dio, Santa Sapienza per conoscere la verità e condividerla con tutti, Carità Divina, Culto dello Spirito Santo.
4. **L'Assunzione di Maria.**
Frutto del Mistero: Unione con Maria e Vera Devozione a Maria
5. **L'Incoronazione di Maria.**
Frutto del Mistero: Perseveranza e un Aumento delle Virtù (Fiducia nell'Intercessione di Maria).
"""
