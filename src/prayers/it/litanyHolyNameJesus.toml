_liberaci, Gesù._

Per il mistero della tua santa incarnazione,
_liberaci, Gesù._

Per la tua nascita,
_liberaci, Gesù._

Per la tua infanzia,
_liberaci, Gesù._

Per la tua vita divina,
_liberaci, Gesù._

Per il tuo lavoro,
_liberaci, Gesù._

Per le tue fatiche,
_liberaci, Gesù._

