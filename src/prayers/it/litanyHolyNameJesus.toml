_abbi pietà di noi._

Gesù, purezza delle vergini,
_abbi pietà di noi._

Gesù, corona di tutti i santi,
_abbi pietà di noi._

Sii indulgente,
_perdonaci, Gesù._

Sii indulgente,
_ascoltaci, Gesù._

Da ogni male,
_liberaci, Gesù._

Da ogni peccato,
_liberaci, Gesù._

Dalla tua ira,
_liberaci, Gesù._

Dalle insidie del diavolo,
_liberaci, Gesù._

Dallo spirito impuro,
_liberaci, Gesù._

Dalla morte eterna,
_liberaci, Gesù._

Dalla resistenza alle tue ispirazioni,
_liberaci, Gesù._

