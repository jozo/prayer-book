_abbi pietà di noi._

Gesù, eterna sapienza,
_abbi pietà di noi._

Gesù, infinita bontà,
_abbi pietà di noi._

Gesù, nostra via e nostra vita,
_abbi pietà di noi._

Gesù, gioia degli angeli,
_abbi pietà di noi._

