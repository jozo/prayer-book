_liberaci, Gesù._

Per la tua croce e il tuo abbandono,
_liberaci, Gesù._

Per le tue sofferenze,
_liberaci, Gesù._

Per la tua morte e sepoltura,
_liberaci, Gesù._

Per la tua resurrezione,
_liberaci, Gesù._

Per la tua ascensione,
_liberaci, Gesù._

Per averci dato la SS. Eucaristia,
_liberaci, Gesù._

Per le tue gioie,
_liberaci, Gesù._

Per la tua gloria,
_liberaci, Gesù._

Agnello di Dio che togli i peccati del mondo,
_perdonaci, Signore._

Agnello di Dio che togli i peccati del mondo,
_ascoltaci, Signore._

Agnello di Dio che togli i peccati del mondo,
_abbi pietà di noi._

**Preghiamo:**
Signore Gesù, che hai detto: “chiedete e vi sarà dato, cercate e troverete,
bussate e vi sarà aperto”, ti preghiamo, concedi a noi che lo imploriamo l’amore
per il tuo divinissimo nome perché ti possiamo amare con tutto il cuore, con la
bocca e con le opere e non ci allontaniamo mai dalla tua lode.
Dona al tuo popolo, o Padre, di vivere sempre nella venerazione e nell'amore
per il tuo santo nome, poiché tu non privi mai della tua guida coloro che hai
stabilito sulla salda roccia del tuo amore.
Tu che vivi e regni nei secoli dei secoli.

**℟.** Amen.
