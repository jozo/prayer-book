title = "Concedimi la Grazia (di San Tommaso d'Aquino)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Concedimi la grazia, o Dio misericordioso:

- di desiderare ardentemente ciò che tu approvi,
- di ricercarlo con prudenza,
- di riconoscerlo secondo verità,
- di compierlo in modo perfetto,

a lode e gloria del tuo nome.

Amen.
"""

