title = "Preghiera a San Michele Arcangelo"
categories = ["basic", "saints"]

[[versions]]
name = ""
content = """
San Michele Arcangelo, difendici nella battaglia;
sii nostro aiuto contro la malvagità e le insidie del diavolo.

Che Dio eserciti su di lui il suo dominio, ti preghiamo supplichevoli:
e tu, o Principe della milizia celeste,
col divino potere ricaccia nell'inferno Satana
e gli altri spiriti maligni
che si aggirano per il mondo per perdere le anime.

Amen.
"""
