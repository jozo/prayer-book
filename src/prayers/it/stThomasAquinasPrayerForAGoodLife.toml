title = "Preghiera per una Buona Vita(di San Tommaso d'Aquino)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Concedimi, Dio misericordioso, di desiderare ardentemente ciò che piace a te,
di ricercarlo con saggezza, di riconoscerlo con verità
e di compierlo con perfezione a lode e gloria del tuo nome.

Metti ordine, mio Dio, nella mia vita: fa' che sappia ciò che mi richiedi di fare
e concedimi di eseguirlo come è necessario e come giova alla mia anima.

Accordami, Signore mio Dio, di non venire meno nelle prosperità e nelle avversità,
perché in quelle non mi esalti e in queste non mi abbatta.

Di nessuna cosa io mi rallegri o mi dolga
se non di ciò che conduce a te o lontano da te.

A nessuno desideri piacere o tema di dispiacere se non a te.

Dammi, Signore Dio mio,
- un cuore sempre vigile, che nessun pensiero vano porti lontano da te;
- un cuore nobile, che nessun indegno affetto trascini in basso;
- dammi un cuore retto, che nessuna cattiva intenzione faccia deviare.

Dammi un cuore saldo, che nessuna tribolazione spezzi,
un cuore libero, che nessuna passione violenta soggioghi.

Donami, Signore Dio mio, un intelletto che ti conosca,
una diligenza che ti cerchi, una sapienza che ti trovi.

Dammi uno stile di vita che ti piaccia,
una perseveranza che ti attenda con fiducia
e una fiducia che ti abbracci alla fine.

Amen.
"""
