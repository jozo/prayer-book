title = "Misteri Gaudiosi"
categories = ["rosary"]

[[versions]]
name = ""
content = """
1. **L'Annunciazione.**
Frutto del Mistero: Umiltà
2. **La Visitazione.**
Frutto del Mistero: Amore verso il Prossimo
3. **La nascita di Gesù.**
Frutto del Mistero: Povertà, Distacco dalle cose del mondo, Disprezzo delle Ricchezze, Amore per i Poveri
4. **La Presentazione di Gesù al Tempio.**
Frutto del Mistero: Dono della Sapienza e Purezza di mente e corpo (Obbedienza).
5. **Il ritrovamento di Gesù nel tempio.**
Frutto del Mistero: Vera Conversione (Pietà, Gioia di Trovare Gesù)
"""
