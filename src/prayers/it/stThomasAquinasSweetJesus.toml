title = "Dolce Gesù (di San Tommaso d'Aquino)"
categories = ["saints"]

[[versions]]
name = ""
content = """
Dolce Gesù, Santissimo Corpo e Sangue,
sii la delizia e la gioia della mia anima,
la mia forza e salvezza in tutte le tentazioni,
la mia gioia e pace in ogni prova,
la mia luce e guida in ogni parola e azione,
e il mio ultimo protettore nella morte.

Amen.
"""
