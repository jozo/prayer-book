title = "Misteri Luminosi"
categories = ["rosary"]

[[versions]]
name = ""
content = """
1. **Il Battesimo di Gesù nel Giordano.**
Frutto del Mistero: Apertura allo Spirito Santo, il Guaritore.
2. **Le Nozze di Cana.**
Frutto del Mistero: A Gesù attraverso Maria, comprensione della capacità di manifestare attraverso la fede.
3. **L'annuncio di Gesu del Regno di Dio.**
Frutto del Mistero: Fiducia in Dio (Chiamata alla Conversione a Dio).
4. **La Trasfigurazione.**
Frutto del Mistero: Desiderio di Santità.
5. **L'istituzione dell'Eucaristia.**
Frutto del Mistero: Adorazione.
"""
