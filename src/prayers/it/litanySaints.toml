Agnello di Dio che togli i peccati del mondo,
_perdonaci, Signore._

Agnello di Dio che togli i peccati del mondo,
_ascoltaci, Signore._

Agnello di Dio che togli i peccati del mondo,
_abbi pietà di noi._

**Preghiamo:**
O Dio nostro Padre Santissimo, tu lo sai, senza il tuo aiuto, noi siamo tutti poveri peccatori.
Tuttavia, pieni di fiducia nei meriti del tuo Figlio e dei suoi santi, ti preghiamo di renderci degni fin da ora del Regno dei cieli che tu ci hai preparato fin dalla fondazione del mondo.

