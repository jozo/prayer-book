title = "Memorare a San Giuseppe"
categories = ["saints"]

[[versions]]
name = ""
content = """
Ricordati, o purissimo sposo di Maria Vergine,
o caro mio protettore san Giuseppe,
che mai si udì aver alcuno invocato la tua protezione
e chiesto il tuo aiuto senza essere stato consolato.
Con questa fiducia, io vengo a te
e a te fervorosamente mi raccomando.
O san Giuseppe,
ascolta la mia preghiera,
accoglila pietosamente ed esaudiscila. Amen.
"""
